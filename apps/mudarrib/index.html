<title>مدرّبي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* التصميم: تطبيق موبايل داكن بلون ليموني واحد، بطاقات بزوايا ناعمة، قائمة سفلية */
:root{
  --bg:#0b0d0f; --s1:#13161a; --s2:#1a1e23; --s3:#242930; --line:#2a2f37;
  --fg:#eef1ea; --mut:#8e959d; --lime:#c6f432; --lime-d:#8fb21a; --ink:#0d1006;
  --warn:#ffb84d; --bad:#ff6b5d; --ok:#5ad89b;
  --fd:'Readex Pro',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--fd);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font-family:var(--fd)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg{direction:ltr}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px}
.view{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mut{color:var(--mut)}
.small{font-size:13px}
.tiny{font-size:11.5px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:var(--s2);border-color:transparent}
.hero{background:var(--lime);color:var(--ink);border:0}
.hero .mut{color:#3b4a12}
.btn{background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.dark{background:var(--ink);color:var(--lime)}
.btn.ghost{background:var(--s3);color:var(--fg)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--s3);color:var(--fg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;background:var(--s3);color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip.p{background:rgba(198,244,50,.14);color:var(--lime);border-color:rgba(198,244,50,.35)}
.chip.s{background:transparent;color:var(--mut);border-color:var(--line)}
button.chip{cursor:pointer}
button.chip.on{background:var(--lime);color:var(--ink)}
.tabs{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:999px;padding:9px 12px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--lime);color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:10px;align-items:flex-start}
.li .b{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.b.ok{background:rgba(90,216,155,.15);color:var(--ok)}
.b.bad{background:rgba(255,107,93,.15);color:var(--bad)}
.b.n{background:var(--lime);color:var(--ink)}
.b.w{background:rgba(255,184,77,.15);color:var(--warn)}
input[type=number],input[type=text],textarea,select{background:var(--s2);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
textarea{font-size:12px;min-height:90px;direction:ltr}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--s3);display:grid;place-items:center;border:2px dashed var(--lime)}
.avatar svg{width:26px;height:26px}
.flame{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600}
.flame svg{width:18px;height:18px;color:var(--lime)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut)}
.day b{font-size:16px;color:var(--fg);font-weight:600}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.day.train .dot{background:var(--mut)}
.day.done .dot{background:var(--lime)}
.day.today{border-color:var(--lime);background:var(--s2)}
.stat{background:var(--s2);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--s3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .4s}
.excard{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:10px;text-align:right;color:var(--fg);width:100%}
.excard .th{width:84px;height:84px;flex:none;border-radius:16px;background:radial-gradient(circle at 50% 35%,#20262d,#111418);overflow:hidden}
.excard .th svg{width:100%;height:100%}
.excard .go{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;flex:none}
.excard .go svg{width:16px;height:16px}
.stage{position:relative;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#1d232a 0%,#111418 60%,#0b0d0f 100%);border:1px solid var(--line);aspect-ratio:1/1;max-width:100%}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 75%)}
.stage .hud{position:absolute;inset:auto 12px 12px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.stage .phase{background:rgba(11,13,15,.82);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.stage .phase i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.stage .phase small{color:var(--mut);font-weight:400}
.stage .reps{position:absolute;top:12px;left:12px;background:rgba(11,13,15,.82);border:1px solid var(--line);border-radius:16px;padding:6px 12px;text-align:center;line-height:1.2}
.stage .reps b{display:block;font-size:22px;color:var(--lime)}
.stage .reps span{font-size:11px;color:var(--mut)}
.stage .tag{position:absolute;top:12px;right:12px;background:var(--lime);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.stage .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.stage .prog i{display:block;height:100%;background:var(--lime);width:0}
.ctrls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.info div{background:var(--s2);border-radius:16px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.info svg{width:18px;height:18px;margin:0 auto;color:var(--lime)}
.info b{font-size:15px}
.info span{font-size:11px;color:var(--mut)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;overscroll-behavior:contain}
.sheet .in{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:18px}
nav.bn .in{max-width:520px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-radius:28px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;position:relative}
nav.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);text-decoration:none;font-size:11px;padding:6px 0;border-radius:20px}
nav.bn a svg{width:22px;height:22px}
nav.bn a.on{color:var(--lime)}
nav.bn a.fab{color:var(--ink)}
nav.bn a.fab span.c{width:56px;height:56px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin-top:-30px;box-shadow:0 0 0 6px var(--bg),0 8px 24px rgba(198,244,50,.35)}
nav.bn a.fab svg{width:26px;height:26px}
nav.bn a.fab small{color:var(--lime);font-size:11px}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:52px;font-weight:600;line-height:1}
.setrow{display:grid;grid-template-columns:42px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow .n{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:600}
.setrow.done .n{background:var(--lime);color:var(--ink)}
.setrow input{text-align:center;padding:9px 6px}
.setrow .ok{width:46px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--s2);color:var(--mut);display:grid;place-items:center}
.setrow.done .ok{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.setrow .ok svg{width:20px;height:20px}
.tier{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--s1)}
.tier h3{display:flex;align-items:center;gap:8px}
.tier .dotc{width:10px;height:10px;border-radius:50%}
.supp{background:var(--s2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.supp .k{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.meal{display:flex;gap:12px;align-items:flex-start;background:var(--s2);border-radius:18px;padding:12px;border:1px solid transparent;text-align:right;color:var(--fg);width:100%}
.meal.on{border-color:var(--lime);background:rgba(198,244,50,.07)}
.meal .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:2px}
.meal.on .ck{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.meal .ck svg{width:16px;height:16px}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glasses button{width:34px;height:42px;border-radius:8px 8px 12px 12px;border:2px solid var(--line);background:transparent;padding:0;position:relative;overflow:hidden}
.glasses button.on{border-color:#6fc7ff;background:linear-gradient(to top,rgba(111,199,255,.55) 70%,transparent 70%)}
.badge{background:var(--s2);border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);border:1px solid transparent}
.badge .i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.badge .i svg{width:22px;height:22px}
.badge.on{color:var(--fg);border-color:rgba(198,244,50,.3)}
.badge.on .i{background:var(--lime);color:var(--ink)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;color:var(--fg);text-decoration:none}
.menu a .i{width:42px;height:42px;border-radius:14px;background:var(--s3);display:grid;place-items:center;color:var(--lime);flex:none}
.menu a .i svg{width:22px;height:22px}
.mapwrap{display:grid;grid-template-columns:1fr;gap:8px}
.map{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:22px;background:radial-gradient(circle at 50% 40%,#1c2229,#111418 70%)}
.map svg{width:100%;height:100%}
.hm{cursor:pointer}
.phase-step{display:flex;gap:12px}
.phase-step .n{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--s3);color:var(--mut)}
.phase-step.cur .n{background:var(--lime);color:var(--ink)}
.phase-step.past .n{background:rgba(198,244,50,.18);color:var(--lime)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:600;z-index:90;font-size:14px;max-width:90%;text-align:center}
.note{background:rgba(255,184,77,.08);border:1px solid rgba(255,184,77,.3);border-radius:16px;padding:12px;font-size:13.5px}
.good{background:rgba(198,244,50,.07);border:1px solid rgba(198,244,50,.3);border-radius:16px;padding:12px;font-size:13.5px}
.sub{font-size:12px;color:var(--mut);letter-spacing:.03em}
.chart svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2128"/><stop offset="1" stop-color="#0b0d0f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shad"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="skinN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dee4"/><stop offset="1" stop-color="#9aa2ac"/></linearGradient>
    <linearGradient id="skinT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd5dc"/><stop offset="1" stop-color="#8d959f"/></linearGradient>
  </defs>
</svg>

<div id="app" dir="rtl"></div>
<nav class="bn" dir="rtl" aria-label="القائمة">
  <div class="in">
    <a href="#home" data-v="home"><span id="ic-home"></span>الرئيسية</a>
    <a href="#plan" data-v="plan"><span id="ic-plan"></span>برنامجي</a>
    <a href="#go" class="fab" data-v="go" aria-label="ابدأ تمرين اليوم"><span class="c" id="ic-go"></span><small>تمرّن</small></a>
    <a href="#food" data-v="food"><span id="ic-food"></span>أكلي</a>
    <a href="#more" data-v="more"><span id="ic-more"></span>المزيد</a>
  </div>
</nav>
<div id="sheet" class="sheet" hidden dir="rtl"></div>
<div id="session" class="sheet" hidden dir="rtl"></div>

<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
/* ================= أيقونات ================= */
const I={
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',

speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',

function render(id,t,c,opt={}){
  const ex=EX[id],S=solve(ex,t);
  const SA=opt.SA||solve(ex,0),SB=opt.SB||solve(ex,1);
  const e=equip(id,S,SA,SB);
  const pO=.38+.62*c,sO=.2+.25*c;
  let mus='';
  if(!opt.nomus){
    for(const m of ex.sec)mus+=S.front?musFront(S,m,'#7aa315',sO):musSide(S,m,'#7aa315',sO);
    for(const m of ex.prim)mus+=S.front?musFront(S,m,C.lime,pO):musSide(S,m,C.lime,pO);
  }
  const shx=S.front?S.cx:(S.hip[0]+S.an[0])/2;
  let o=`<rect x="0" y="${G}" width="400" height="${400-G}" fill="url(#floor)"/><line x1="0" y1="${G}" x2="400" y2="${G}" stroke="#2a3038" stroke-width="1.5"/><ellipse cx="${f(shx)}" cy="${G+2}" rx="95" ry="9" fill="url(#shad)"/>`;
  o+=e.b;
  if(S.front)o+=drawFront(S);
  else{const d=drawSide(S);o+=d.far+d.body+d.nearLeg+d.nearArm}
  o+=e.fr+mus;
  return o;
}

/* محرك التشغيل */
class Stage{
  constructor(root,id,opts={}){
    this.root=root;this.id=id;this.ex=EX[id];this.speed=1;this.playing=true;this.time=0;this.last=0;this.rep=0;this.opts=opts;
    this.SA=solve(this.ex,0);this.SB=solve(this.ex,1);
    const ex=this.ex;
    root.innerHTML=`<div class="grid"></div><svg viewBox="0 0 400 400" role="img" aria-label="رسم متحرك يشرح ${esc(ex.name)}"></svg>
      <div class="reps"><b class="num">${AR(0)}</b><span>${ex.hold?'ثانية':'عدّة'}</span></div>
      ${ex.star?'<div class="tag">⭐ أهم تمرين لشكلك</div>':`<div class="tag">${esc(ex.view==='front'?(ex.backv?'منظر من ورا':'منظر من گدام'):'منظر جانبي')}</div>`}
      <div class="hud"><div class="phase"><i></i><span class="pl"></span><small class="br"></small></div></div><div class="prog"><i></i></div>`;
    this.svg=root.querySelector('svg');this.pl=root.querySelector('.pl');this.br=root.querySelector('.br');this.rc=root.querySelector('.reps b');this.pg=root.querySelector('.prog i');
    this.tm=ex.tm||[1,.45,2,.55];this.total=this.tm.reduce((a,b)=>a+b,0);
    this.loop=this.loop.bind(this);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!opts.force)this.playing=false;
    this.draw(0);if(this.playing)requestAnimationFrame(this.loop);
  }
  frame(time){
    const T=this.total,tm=this.tm,k=time%T;let t,c,ph;
    if(k<tm[0]){const u=ease(k/tm[0]);t=u;c=u;ph=0}
    else if(k<tm[0]+tm[1]){t=1;c=1;ph=2}
    else if(k<tm[0]+tm[1]+tm[2]){const u=ease((k-tm[0]-tm[1])/tm[2]);t=1-u;c=1-u;ph=1}
    else{t=0;c=0;ph=3}
    if(this.ex.df)c=t; // الانقباض بأعمق نقطة
    return{t,c,ph,k};
  }
  draw(time){
    const ex=this.ex,{t,c,ph,k}=this.frame(time);
    const breath=ex.hold?Math.sin(time*2.2)*.012:0;
    this.svg.innerHTML=render(this.id,Math.max(0,Math.min(1,t+breath)),ex.hold?(.75+.25*Math.sin(time*3)):c,{SA:this.SA,SB:this.SB});
    let label,br='';
    if(ex.hold){label=ph===0?ex.ph[0]:ph===2?ex.ph[2]:ph===1?ex.ph[1]:'استعد';br=ph===2?'نفَس عادي':''}
    else{label=ph===0?ex.ph[0]:ph===1?ex.ph[1]:ph===2?'اعصر':'استعد';
      const conc=ex.df?ph===1:ph===0,ecc=ex.df?ph===0:ph===1;br=conc?'طلّع نفَس':ecc?'سحب نفَس':''}
    this.pl.textContent=label;this.br.textContent=br;
    this.pg.style.width=(k/this.total*100)+'%';
    const reps=ex.hold?Math.floor(time):Math.floor(time/this.total);
    this.rc.textContent=AR(ex.hold?reps%60:reps%(ex.reps[1]+1));
  }
  loop(ts){
    if(!this.playing||!this.root.isConnected){this.last=0;return}
    if(this.last)this.time+=Math.min(.05,(ts-this.last)/1000)*this.speed;
    this.last=ts;this.draw(this.time);requestAnimationFrame(this.loop);
  }
  toggle(){this.playing=!this.playing;if(this.playing){this.last=0;requestAnimationFrame(this.loop)}return this.playing}
  stop(){this.playing=false}
}

function prof(){return ST.profile}
function curW(){const w=ST.weights;return w.length?w[w.length-1].w:+prof().w||52}
function targets(){
  const p=prof(),w=curW(),h=+p.h||168,age=+p.age||20;
  const bmr=10*w+6.25*h-5*age+5,tdee=bmr*1.5,kcal=Math.round((tdee+300)/50)*50;
  const pro=Math.round(w*2),fat=Math.round(w*.9),carb=Math.round((kcal-pro*4-fat*9)/4);
  return{kcal,pro,fat,carb,water:Math.round(w*.04*10)/10};
}
function weekNo(){const s=new Date(ST.start+'T00:00:00');return Math.max(1,Math.floor((Date.now()-s)/864e5/7)+1)}
function phaseNo(){const w=weekNo();return w<=4?1:w<=16?2:3}
function nextType(){return ST.sessions.length%2===0?'A':'B'}
function setsFor(ex){return(phaseNo()===1&&weekNo()<=2&&!ex.hold)?2:ex.sets}
function suggest(id){
  const ex=EX[id],last=ST.last[id];
  if(!last||!last.length)return{w:ex.w0,msg:ex.hold?'ابدي بهالوقت، وزيد شوية كل أسبوع':'أول مرة: جرّب هذا الوزن. إذا كلش سهل زيده، وإذا صعب نقّصه.'};
  const w=last[0].w;const all=last.every(s=>+s.r>=ex.reps[1]);
  if(ex.hold)return all?{w:w,r:ex.reps[1]+5,msg:'كفو! زيد 5 ثواني هالمرة'}:{w,msg:'نفس الوقت، حاول تثبت أكثر'};

}

function streakWeeks(){ // عدد الأسابيع المتتالية الي بيها 3 تمارين أو أكثر
  let n=0;const now=new Date();const day=now.getDay();const diff=(day+1)%7;let end=new Date(now);end.setHours(0,0,0,0);end.setDate(end.getDate()-diff+7);
  for(let i=0;i<60;i++){const st=new Date(end);st.setDate(st.getDate()-7);const c=ST.sessions.filter(x=>{const d=new Date(x.d+'T12:00:00');return d>=st&&d<end}).length;if(c>=3)n++;else if(i>0)break;end=st}

}

  let fb='سجّل وزنك كل أسبوع بنفس اليوم، الصبح قبل الأكل.';
  if(rate!==null){fb=rate<.15?'وزنك يزيد ببطء. زيد 200 سعرة (مثلاً شيك ثاني أو كوب تمن زيادة).':rate>.6?'وزنك يزيد بسرعة، يمكن دهون. نقّص 150 سعرة.':'ممتاز! وزنك يزيد بالسرعة الصحيحة.'}

  const n=ST.sessions.length,wk=streakWeeks();

  </div>`;

function weightChart(W,goal){
  const pts=W.slice(-12),vals=pts.map(p=>p.w).concat([goal]);const lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const w=320,h=150,px=36,py=14,X=i=>px+(pts.length<2?(w-px-10)/2:i*(w-px-10)/(pts.length-1)),Y=v=>py+(hi-v)/(hi-lo)*(h-py*2);
  let g='';const step=Math.max(1,Math.round((hi-lo)/4));for(let v=lo;v<=hi;v+=step)g+=`<line x1="${px}" x2="${w-6}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="#2a2f37"/><text x="${px-6}" y="${f(Y(v)+4)}" fill="#8e959d" font-size="10" text-anchor="end">${v}</text>`;
  const line=pts.map((p,i)=>`${f(X(i))},${f(Y(p.w))}`).join(' ');
  const area=pts.length>1?`<polygon points="${f(X(0))},${h-py} ${line} ${f(X(pts.length-1))},${h-py}" fill="rgba(198,244,50,.1)"/>`:'';
  const lastP=pts[pts.length-1];
  return`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="رسم وزنك">${g}<line x1="${px}" x2="${w-6}" y1="${f(Y(goal))}" y2="${f(Y(goal))}" stroke="#c6f432" stroke-dasharray="4 4" opacity=".6"/><text x="${w-8}" y="${f(Y(goal)-5)}" fill="#c6f432" font-size="10" text-anchor="end">الهدف</text>${area}<polyline points="${line}" fill="none" stroke="#c6f432" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${f(X(i))}" cy="${f(Y(p.w))}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'#c6f432':'#13161a'}" stroke="#c6f432" stroke-width="2"/>`).join('')}<text x="${f(X(pts.length-1))}" y="${f(Y(lastP.w)-10)}" fill="#eef1ea" font-size="11" text-anchor="middle">${lastP.w}</text></svg>`;
}

let SES=null,restT=null,audioCtx=null,wake=null;
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.6)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startSession(){
  const type=nextType(),ids=PROG[type];
  SES={type,i:0,data:{}};
  for(const id of ids){const ex=EX[id],sg=suggest(id),n=setsFor(ex);SES.data[id]={msg:sg.msg,sets:Array.from({length:n},()=>({w:sg.w,r:sg.r||ex.reps[1],done:false}))}}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  const s=$('#session');s.hidden=false;document.body.style.overflow='hidden';renderSession();
}
function renderSession(){
  stopStage();const ids=PROG[SES.type],id=ids[SES.i],ex=EX[id],d=SES.data[id];
  const doneSets=d.sets.filter(s=>s.done).length;
  const s=$('#session');
  s.innerHTML=`<div class="in">
  <div class="bar-top"><button class="iconbtn" id="sClose" aria-label="طلّع">${I.x}</button><div class="grow" style="display:flex;flex-direction:column;gap:6px"><span class="small mut" style="text-align:center">يوم ${SES.type==='A'?'أ':'ب'} • تمرين ${AR(SES.i+1)} من ${AR(ids.length)}</span><div class="bar"><i style="width:${(SES.i+doneSets/d.sets.length)/ids.length*100}%"></i></div></div><button class="iconbtn" id="sInfo" aria-label="شرح التمرين">؟</button></div>
  <div class="stage" id="sstg"></div>
  <div><span class="sub">${esc(ex.gym)} • راحة ${AR(ex.rest)} ثانية</span><h2 style="margin-top:2px">${esc(ex.name)}</h2></div>
  <div class="good small">${esc(d.msg)}</div>
  <div class="card"><div class="setrow small mut" style="text-align:center"><span>السِت</span><span>${ex.hold?'—':'الوزن (كغم)'}</span><span>${ex.hold?'ثواني':'العدّات'}</span><span></span></div>
  ${d.sets.map((st,k)=>`<div class="setrow ${st.done?'done':''}"><span class="n num">${AR(k+1)}</span>${ex.hold?'<span class="mut" style="text-align:center">وزن جسمك</span>':`<input type="number" inputmode="decimal" step="0.5" data-sw="${k}" value="${st.w}" aria-label="الوزن">`}<input type="number" inputmode="numeric" data-sr="${k}" value="${st.r}" aria-label="العدّات"><button class="ok" data-sd="${k}" aria-label="خلصت السِت">${I.check}</button></div>`).join('')}
  <p class="tiny mut">اكتب الي سوّيته فعلاً، واضغط ✓ بعد كل سِت حتى يبدي وقت الراحة.</p></div>
  <div class="row"><button class="btn ghost grow" id="sPrev" ${SES.i===0?'disabled':''}>السابق</button>${SES.i<ids.length-1?`<button class="btn grow" id="sNext">التمرين الجاي</button>`:`<button class="btn grow" id="sFin">خلّصت التمرين 🎉</button>`}</div>
  <div id="rest" hidden></div>
  </div>`;
  curStage=new Stage($('#sstg'),id,{force:true});
}
function showRest(sec){
  clearInterval(restT);const box=$('#rest');if(!box)return;let left=sec;const C2=2*Math.PI*96;
  const paint=()=>{box.innerHTML=`<div style="position:fixed;inset:0;background:rgba(11,13,15,.96);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px"><h2>ارتاح</h2><div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" stroke="#242930" stroke-width="12" fill="none"/><circle cx="110" cy="110" r="96" stroke="#c6f432" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-left/sec)}"/></svg><div class="c"><div><b class="num">${AR(left)}</b><p class="mut">ثانية</p></div></div></div><p class="mut small" style="text-align:center;max-width:280px">اشرب مي، وتنفّس بعمق. السِت الجاي بنفس القوة.</p><div class="row"><button class="btn ghost" id="rPlus">+15 ثانية</button><button class="btn" id="rSkip">كمّل</button></div></div>`;
    $('#rPlus').onclick=()=>{left+=15;sec+=15;paint()};$('#rSkip').onclick=()=>{clearInterval(restT);box.hidden=true}};
  box.hidden=false;paint();
  restT=setInterval(()=>{left--;if(left<=0){clearInterval(restT);beep();box.hidden=true;toast('يلا السِت الجاي 💪');return}paint()},1000);
}
function finishSession(){
  clearInterval(restT);const ex={};let cnt=0,vol=0;
  for(const [id,d] of Object.entries(SES.data)){const done=d.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0}));if(done.length){ex[id]=done;ST.last[id]=done;cnt+=done.length;vol+=done.reduce((a,s)=>a+s.w*s.r,0)}}
  if(!cnt){toast('ما سجّلت ولا سِت. اضغط ✓ بعد كل سِت.');return}
  ST.sessions.push({d:todayKey(),type:SES.type,ex});save();
  stopStage();
  $('#session').innerHTML=`<div class="in" style="min-height:100%;justify-content:center;text-align:center;align-items:center"><div class="avatar" style="width:90px;height:90px;border-style:solid;background:var(--lime);color:var(--ink)">${I.trophy.replace('<svg','<svg style="width:46px;height:46px"')}</div><h1>عاشت إيدك يا بطل!</h1><p class="mut">هذا تمرينك رقم ${AR(ST.sessions.length)}</p><div class="grid2" style="width:100%"><div class="stat"><span>سِتات</span><b class="num">${AR(cnt)}</b></div><div class="stat"><span>مجموع الي رفعته</span><b class="num">${AR(Math.round(vol))}</b><span>كغم</span></div></div><div class="card flat" style="width:100%;text-align:right"><b>هسه:</b><p class="small">اشرب مي، وكُل وجبة بيها بروتين خلال ساعتين، ونام زين الليلة. باچر راحة.</p></div><button class="btn block" id="sDone">رجوع للرئيسية</button></div>`;
  try{wake&&wake.release()}catch(e){}
}
function closeSession(){clearInterval(restT);stopStage();SES=null;const s=$('#session');s.hidden=true;s.innerHTML='';document.body.style.overflow='';try{wake&&wake.release()}catch(e){}route()}

  sh.innerHTML=`<div class="in" style="min-height:100%">
  <div class="stage" id="obst" style="max-width:320px;margin:0 auto;width:100%"></div>
  <h1>هلا بيك، أنا مدرّبك 💪</h1>
  <p class="mut">راح أعلمك كل شي من الصفر: شلون تتمرن صح، شنو تاكل، وشلون تبين أحلى. بدون إعلانات وبدون اشتراك.</p>
  <div class="card"><div class="grid2"><label class="f">عمرك<input type="number" id="oAge" inputmode="numeric" placeholder="مثلاً 22"></label><label class="f">طولك (سانتي)<input type="number" id="oH" value="168" inputmode="numeric"></label></div><label class="f">وزنك (كغم)<input type="number" id="oW" value="52" inputmode="decimal"></label>
  <p class="small mut">أيام التمرين: السبت والاثنين والأربعاء. تگدر تبدلها بعدين من "ملفي".</p></div>
  <button class="btn block" id="oGo">يلا نبدي</button></div>`;
  curStage=new Stage($('#obst'),'lateral',{force:true});
  $('#oGo').onclick=()=>{const a=$('#oAge').value,h=+$('#oH').value||168,w=+$('#oW').value||52;Object.assign(ST.profile,{age:a,h,w,onboard:true});ST.start=todayKey();ST.weights=[{d:todayKey(),w}];save();closeSheet();route()};
}

/* ================= التوجيه ================= */
const VIEWS={home:vHome,plan:vPlan,food:vFood,progress:vProgress,more:vMore,supps:vSupps,height:vHeight,machines:vMachines,firstday:vFirst,glossary:vGloss,profile:vProfile};
const NAVOF={home:'home',plan:'plan',food:'food',more:'more',progress:'more',supps:'more',height:'more',machines:'more',firstday:'more',glossary:'more',profile:'more'};
function route(){
  let h=(location.hash||'#home').slice(1);
  if(h==='go'){history.replaceState(null,'','#home');h='home';if(!SES)startSession()}
  if(!VIEWS[h])h='home';
  $('#app').innerHTML=VIEWS[h]();
  document.querySelectorAll('nav.bn a').forEach(a=>a.classList.toggle('on',a.dataset.v===NAVOF[h]));
  if(h==='home')drawMap();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ================= الضغطات ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.ex){openEx(t.dataset.ex);return}
  if(t.hasAttribute('data-close')){closeSheet();return}
  if(t.dataset.go){startSession();return}
  if(t.dataset.tab){planTab=t.dataset.tab}
  if(t.dataset.ptab){planTab=t.dataset.ptab;route();return}
  if(t.dataset.mapv){mapView=t.dataset.mapv;mapSel=null;document.querySelectorAll('[data-mapv]').forEach(b=>b.classList.toggle('on',b===t));drawMap();return}
  if(t.dataset.mus){mapSel=mapSel===t.dataset.mus?null:t.dataset.mus;drawMap();return}
  if(t.dataset.meal!==undefined){const k=todayKey(),dd=ST.daily[k]||(ST.daily[k]={m:[],wat:0});dd.m[+t.dataset.meal]=!dd.m[+t.dataset.meal];save();const y=scrollY;route();scrollTo(0,y);return}
  if(t.dataset.wat){const k=todayKey(),dd=ST.daily[k]||(ST.daily[k]={m:[],wat:0});const n=+t.dataset.wat;dd.wat=dd.wat===n?n-1:n;save();const y=scrollY;route();scrollTo(0,y);return}
  if(t.dataset.day){const d=+t.dataset.day,p=prof();if(p.days.includes(d))p.days=p.days.filter(x=>x!==d);else p.days.push(d);t.classList.toggle('on');return}
  switch(t.id){
  case'wAdd':{const v=+$('#wIn').value;if(!(v>25&&v<200)){toast('اكتب وزن صحيح بالكيلو');return}const k=todayKey();const ex=ST.weights.find(x=>x.d===k);if(ex)ex.w=v;else ST.weights.push({d:k,w:v});save();route();toast('انحفظ وزنك');return}
  case'mSave':{ST.meas.push({d:todayKey(),sh:+$('#mSh').value||0,wa:+$('#mWa').value||0,ch:+$('#mCh').value||0,ar:+$('#mAr').value||0});save();const y=scrollY;route();scrollTo(0,y);toast('انحفظت القياسات');return}
  case'pSave':{const p=prof();if(p.days.length!==3){toast('اختار 3 أيام بالضبط');return}p.age=$('#pAge').value;p.h=+$('#pH').value||168;p.w=+$('#pW').value||52;save();toast('انحفظ');return}
  case'bkCopy':{const ta=$('#bk');const txt=ta.value;try{navigator.clipboard.writeText(txt).then(()=>toast('انسخ الكود'),()=>{ta.select();toast('الكود محدد، انسخه')})}catch(er){ta.select();toast('الكود محدد، انسخه')}return}
  case'rsBtn':{try{const o=JSON.parse($('#rs').value);if(!o||!o.profile)throw 0;ST=Object.assign(defState(),o);save();toast('رجعت معلوماتك');route()}catch(er){toast('الكود مو صحيح، تأكد نسخته كامل')}return}
  case'reset':{if(!resetArm){resetArm=true;t.textContent='متأكد؟ اضغط مرة ثانية';setTimeout(()=>{resetArm=false},4000);return}resetArm=false;ST=defState();ST.profile.onboard=true;save();toast('انمسح كلشي');route();return}
  case'sClose':closeSession();return;
  case'sDone':closeSession();location.hash='#home';return;
  case'sInfo':{const id=PROG[SES.type][SES.i];openEx(id);return}
  case'sPrev':SES.i--;renderSession();$('#session').scrollTop=0;return;
  case'sNext':SES.i++;renderSession();$('#session').scrollTop=0;return;
  case'sFin':finishSession();return;
  }
  if(t.dataset.sd!==undefined&&SES){const id=PROG[SES.type][SES.i],d=SES.data[id],k=+t.dataset.sd;d.sets[k].done=!d.sets[k].done;const row=t.closest('.setrow');row.classList.toggle('done',d.sets[k].done);
    const doneSets=d.sets.filter(s=>s.done).length;$('#session .bar i').style.width=((SES.i+doneSets/d.sets.length)/PROG[SES.type].length*100)+'%';
    if(d.sets[k].done){if(doneSets<d.sets.length)showRest(EX[id].rest);else toast('خلصت هذا التمرين! روح للجاي')}return}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!SES)return;const id=PROG[SES.type][SES.i];
  if(t.dataset.sw!==undefined)SES.data[id].sets[+t.dataset.sw].w=t.value;
  if(t.dataset.sr!==undefined)SES.data[id].sets[+t.dataset.sr].r=t.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('click',e=>{const g=e.target.closest('.hm');if(g){mapSel=mapSel===g.dataset.m?null:g.dataset.m;drawMap()}});

route();
if(!ST.profile.onboard)onboarding();
</script>
