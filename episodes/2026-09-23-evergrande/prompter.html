<title>الملقّن</title>
<style>
:root{--bg:#0E0D0C;--fg:#F4EFE6;--mute:#8C857A;--accent:#F2C230;--mark:#E2553B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Noto Naskh Arabic","Amiri",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden}
#text{position:absolute;inset-inline:0;padding:45vh 7vw 80vh;direction:rtl;font-size:var(--size,44px);line-height:1.75;
  font-weight:600;will-change:transform}
#text p{margin:0 0 1.1em}
#text .mark{color:var(--mark);font-size:.6em;font-family:system-ui,sans-serif;display:block;margin:.4em 0}
.mirror #text{transform-origin:center}
.focus{position:fixed;inset-inline:0;top:38vh;height:14vh;border-block:2px solid rgba(242,194,48,.35);pointer-events:none;
  background:linear-gradient(transparent,rgba(242,194,48,.05),transparent)}
.fade{position:fixed;inset-inline:0;height:30vh;pointer-events:none}
.fade.t{top:0;background:linear-gradient(var(--bg),transparent)}.fade.b{bottom:0;background:linear-gradient(transparent,var(--bg))}
#bar{position:fixed;inset-inline:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;background:rgba(14,13,12,.92);direction:rtl;font-family:system-ui,sans-serif;font-size:15px;
  transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
button{background:#26231F;color:var(--fg);border:1px solid #3A3630;border-radius:10px;padding:10px 14px;font-size:16px;min-height:44px}
button.go{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
label{display:flex;align-items:center;gap:6px;color:var(--mute)}
input[type=range]{width:120px}
#left{margin-inline-start:auto;color:var(--mute);font-variant-numeric:tabular-nums}
</style>
<div id="stage"><div id="text"></div><div class="focus"></div><div class="fade t"></div><div class="fade b"></div></div>
<div id="bar">
  <button class="go" id="play">▶ ابدي</button>
  <button id="back">⟲ رجّع</button>
  <label>السرعة <input id="speed" type="range" min="40" max="320" value="140"></label>
  <label>الخط <input id="size" type="range" min="28" max="84" value="44"></label>
  <button id="mirror">مرآة</button>
  <span id="left"></span>
</div>
<script>
const DATA = {"paras": [{"text": "بأيلول 2021، مستثمرين غاضبين اقتحموا لوبي مقر شركة إيفرغراند بمدينة شنجن الصينية، وصاروا يصيحون: \"رجعولنا فلوسنا\". وبنفس الشهر، حسب ملفات المصفّين الي نقلتها بلومبرغ، انشترى قصر بكاليفورنيا بـ20 مليون دولار، والمصفّين يگولون إن المسيطر عليه هو الرجل الثاني بنفس الشركة. بعدها بخمس سنين، بـ20 آب 2026، مؤسس إيفرغراند، الرجال الي جان سنة 2017 أغنى واحد بآسيا كلها، وگف بين شرطيين وسمع الحكم: سجن مؤبد. هواي ناس گالوا: خلصت القصة. بس الي صاحوا بذاك اللوبي بعدهم يسألون نفس السؤال: فلوسنا وين؟ واليوم، آني وياك، راح نلحگها يوان يوان."}, {"text": "خليني أگولك أول شي شگد فلوس نحچي عنها. إيفرغراند، وقت انهارت، جانت عليها التزامات أكثر من 300 مليار دولار. يعني فلوس لازم ترجعها لناس وبنوك وشركات. سنة 2021 جان عدها 1300 مشروع بـ280 مدينة، و200 ألف موظف، وحوالي 3.8 مليون وظيفة ثانية معلّگة بيها بشكل غير مباشر. والأهم من كل هذا: 1.6 مليون عائلة جانت دافعة فلوس لبيوت، وگاعدة تنتظر المفتاح."}, {"text": "بس قبل ما نبدي، لازم أكون صريح وياك، لأن هاي حلقة عن الفلوس، والفلوس تريد دقة. مو كل هذوله الناس خسروا فلوسهم. قسم كبير من المشترين استلموا بيوتهم بعدين، ببرنامج حكومي اسمه \"ضمان التسليم\". رسمياً، لحد شباط 2023، الشركة سلّمت 421 ألف شقة. واكو تقارير أحدث تحچي عن أرقام أكبر بهواي، بس هاي الأرقام مو رسمية ومختلف عليها. لعد منو الي فلوسه بعدها عالقة؟ الموظفين الي أقرضوا الشركة من جيوبهم. والناس الي حطوا فلوسهم بمنتجات الاستثمار مالتها. والي أقرضوها عن طريق السندات، والسند ببساطة ورقة تگول: انت أقرضتني، وآني أرجعلك فلوسك ويا فايدة. والمورّدين الي اشتغلوا وياها. ومشترين بعدهم لهسه ينتظرون، لو ساكنين بشقق نص مخلصة."}, {"text": "وليش هذا يهمك انت؟ لأن كل مرة تدفع فلوسك مقدماً على وعد، شقة على الخارطة، لو استثمار يضمنلك ربح ثابت، لو شركة تشتغل بيها وتطلب منك تثق بيها، انت واقف بنفس المكان الي وگف بيه هذوله الناس. وهمّه صدّگوا أغنى رجل بآسيا."}, {"text": "فراح نمشي ورا الفلوس خطوة خطوة، من سنة 1958 لحد الشهر الي فات. وأنبهك من هسه: بنص الطريق، راح تكتشف إن قسم من الفلوس الي دا ندور عليها… ما جان موجود أصلاً. وبالآخر، راح آخذك لمدن بناها هذا الرجال، وأگلك منو ساكن بيها هسه. والجواب، صدگني، ما تتوقعه."}, {"text": "نبدي من الصفر. وأقصد الصفر حرفياً."}, {"text": "بـ9 تشرين الأول 1958، يعني قبل الحكم بحوالي 68 سنة، بقرية صغيرة اسمها جوتايگانگ بإقليم خنان وسط الصين، انولد طفل اسمه هوي كا يان. بالصيني الرسمي اسمه شو جيايين، بس خلينا على هوي، أسهل على اللسان."}, {"text": "وسنة 1958 مو سنة عادية بالصين. هاي السنة الي بدت بيها خطة حكومية اسمها \"القفزة الكبرى للأمام\"، والخطة سببت مجاعة. يعني هوي انولد بأسوأ توقيت ممكن."}, {"text": "وهو بعده رضيع، ما مكمل سنتين، أمه مرضت. تسمم بالدم. والعائلة ما جان عدها فلوس تعالجها. فماتت."}, {"text": "فكّر بيها شوية. أول شي علّمته الدنيا لهذا الطفل، قبل حتى ما يعرف يحچي: شنو يصير لمن ماكو فلوس."}, {"text": "ربّته جدته. وهو بنفسه تذكر بخطاب بعد سنين إنه جان ياكل بس بطاطا حلوة وخبز مبخّر. وحسب السيرة الي تنشرها مواقع صينية، جدته جانت معروفة بصناعة الخل، وهو صغير جان ياخذ خلها ويبيعه بالطرق. وبعمر 16 خلّص الثانوية، واشتغل بالزراعة سنتين. سنة 1977 دخل الامتحان الوطني للجامعات، الي يسموه بالصين \"گاوكاو\"، ورسب. سنة 1978 رجع دخله، ونجح، وطلع الثالث على مدينة جوكو. وحسب نفس المصادر، طوله وقتها جان 176 سانتي، ووزنه حوالي 45 لـ50 كيلو بس. من الجوع."}, {"text": "هذا الولد الضعيف، بعد 39 سنة من ذاك الامتحان، راح يصير أغنى واحد بآسيا. بس انتبه لشي من هسه: الي راح يوصله للقمة مو فلوسه هو. فلوس الناس. وراح تشوف شلون."}, {"text": "دخل معهد ووهان للحديد والصلب، وتخرج سنة 1982، واشتغل بمصنع صلب 10 سنين. عشر سنين موظف عادي، وماكو أي شي يدل إن هذا الشخص راح يصير يوم من الأيام أغنى واحد بآسيا."}, {"text": "وسنة 1992، ترك المصنع وراح لمدينة شنجن، واشتغل بائع بشركة تجارية صغيرة. وبعدها بأربع سنين، سنة 1996، أسس شركته الخاصة بمدينة گوانگجو. الشركة الي راح تصير إيفرغراند."}, {"text": "وبـ8 حزيران 1997، حسب نفس المواقع الصينية، بدا أول مشروع إلها: مجمع سكني اسمه \"جينبي گاردن\"، على أرض جانت معمل مبيدات قديم. والشركة كلها وقتها 8 أشخاص. ثمانية بس."}, {"text": "وهنا لازم أشرحلك الفكرة الي انبنت عليها إيفرغراند، لأن بدونها ما راح تفهم ولا شي من الي جاي. إيفرغراند كبرت على شغلتين: الديون، والبيع المسبق. البيع المسبق يعني الشركة تبيعك الشقة قبل ما تبنيها، أو مثل ما نگول: البيع على الخارطة. انت تدفع هسه، والشقة بعدها أرض فارغة، والشركة توعدك تسلمك إياها بعد سنة لو سنتين."}, {"text": "تخيّلها هيچ: انت ما دا تشتري شقة. انت دا تشتري وعد. وفلوسك توصل للشركة قبل ما ينحط أول طابوگ."}, {"text": "وهاي اللعبة تمشي زين كلش… بشرط: إن الناس يبقون يشترون، والبنوك تبقى تقرض. إذا وحدة من الثنتين وگفت، الوعد يتعلّگ بالهوا."}, {"text": "احفظ هاي الفكرة، لأن البيع قبل البناء هو الي صنع هوي كا يان… وهو نفسه الي راح يدفنه."}, {"text": "وبتشرين الثاني 2009، دخلت الشركة بورصة هونگ كونگ. البورصة ببساطة سوگ، الشركة تبيع بيه حصص صغيرة منها للناس حتى تجمع فلوس. وجمعت أكثر من 700 مليون دولار. الولد الي جان يبيع خل جدته بالشارع، صار عنده شركة بالبورصة، وجيوب الناس مفتوحة إله."}, {"text": "ومن هنا تبدي أول وجهة للفلوس. وجهة ما تخطر على بالك."}, {"text": "سنة 2010، هوي اشترى نادي كرة قدم بگوانگجو، وسمّاه \"گوانگجو إيفرغراند\". والنادي فاز بدوري أبطال آسيا مرتين: سنة 2013 بقيادة المدرب الإيطالي ليپي، وسنة 2015. زين، شركة بيوت عدها نادي كرة. ماشي، نگول دعاية."}, {"text": "بس سنة 2014، هوي قرر يبيع… ماي. ماي معدني اسمه \"إيفرغراند سبرنگ\". يمعود، شركة بيوت تبيع ماي؟ لا تسألني ليش، آني هم ما فاهم. وحسب تقارير صينية، الهدف جان 10 مليار يوان مبيعات بأول سنة، وصرفوا 1.3 مليار يوان إعلانات بعشرين يوم بس."}, {"text": "النتيجة؟ حسب نفس التقارير، خسارة حوالي 4 مليار يوان بثلاث سنين. وسنة 2016 باعوا الماي، ويا الزيوت والألبان الي جانوا فاتحيها هم، كلها بـ2.7 مليار يوان."}, {"text": "شركة بيوت تبيع ماي وزيت وحليب. وبعدين راح تسوي سيارات. بس السيارات قصة ثانية، وراح نوصلها."}, {"text": "وبين 2016 و2017 صار شي أخطر من الماي. إيفرغراند جمعت 130 مليار يوان من مستثمرين كبار، يسموهم \"المستثمرين الاستراتيجيين\". والمقابل؟ وعد. وعد إن الشركة راح تنزل ببورصة شنجن داخل الصين. احفظ هذا الوعد، لأن بعد ثلاث سنين راح يطلع مشكلة للعلن."}, {"text": "وسنة 2017، هوي وصل للقمة. بأيلول 2017، مجلة فوربس حطته أغنى رجل بآسيا كلها، وثروته بذروتها وصلت حوالي 45 مليار دولار. وبالصين صاروا يسمونه \"شو الحزام\"، لأن شافوه لابس حزام هيرمز باجتماع سياسي وطني. يعني الرجال صار معروف حتى بحزامه."}, {"text": "وسنة 2018، صار الأول بقائمة فوربس للمتبرعين بالصين: 4.21 مليار يوان، لمكافحة الفقر بمنطقة بيجيه بإقليم گويجو. وتصدّر هاي القائمة 4 مرات."}, {"text": "والي دخل جيبه هو؟ حسب بلومبرغ، من 2009 لـ2020، هوي استلم من الشركة حوالي 7 لـ8 مليار دولار أرباح. الأرباح هنا يعني حصته كمالك من الأرباح الي توزعها الشركة على أصحاب الأسهم. شي طبيعي، كل مالك ياخذ أرباح. بس هاي الأرباح بالذات، راح ترجعلنا بعدين بشكل ما تتوقعه."}, {"text": "وبنيسان 2020، بدا يبني ملعب كرة بگوانگجو بسعة 100 ألف متفرج، على شكل زهرة لوتس."}, {"text": "بس بنفس السنة صار شي أهم من الملاعب والماي، وهو الي غيّر كلشي."}, {"text": "بـ20 آب 2020، وزارة الإسكان والبنك المركزي الصيني جمعوا 12 شركة عقار كبيرة، وبيناتهم إيفرغراند، والاجتماع طلّع قواعد صارت تنعرف بـ\"الخطوط الحمراء الثلاث\". خليني أبسطها: الحكومة گالت للشركات، عدكم ثلاث شروط. أول شي، ديونك ما تعبر 70% من أملاكك. ثاني شي، ديونك الصافية ما تعبر رأس مالك. ثالث شي، الكاش الي بإيدك لازم يغطي الديون الي موعدها قريب. والي يكسر الثلاث، ممنوع يزيد ديونه."}, {"text": "وإيفرغراند؟ كسرت الثلاث."}, {"text": "يعني بجملة وحدة: الحكومة سدّت حنفية الديون. واحفظ هذا التاريخ زين: 20 آب. راح يرجعلنا."}, {"text": "وبعدها بشهر، بأواخر أيلول 2020، انتشرت رسالة منسوبة لإيفرغراند، تطلب مساعدة حكومة إقليم گوانگدونگ بخصوص الـ130 مليار يوان مال المستثمرين الاستراتيجيين. تتذكر الوعد؟ هذا هو. الشركة نفت إن الرسالة صحيحة. بس هاي جانت أول مرة الناس تسمع إن الوعد صار مشكلة."}, {"text": "والشي الغريب إن الشركة ما وگفت تبيع. بـ5 كانون الأول 2020، فتحت بيع مشروع ضخم بإقليم گوانگشي اسمه \"مدينة نانينغ للثقافة والسياحة\". الوعد: استثمار 120 مليار يوان، وعالم مائي، ومدينة ألعاب داخلية، ودار أوبرا، و51 مدرسة و4 جامعات. وحسب تقارير صينية، بأول يوم انباعت أكثر من 10 آلاف شقة، بحوالي 4 مليار يوان."}, {"text": "بيوم واحد. وبعد ثلاث شهور ونص بس من اليوم الي الحكومة سدّت بيه حنفية الديون."}, {"text": "لا تنسى نانينغ. بالآخر راح نرجعلها، ونشوف شكلها هسه."}, {"text": "ونوصل لسنة 2021. السنة الي انسدت بيها الحنفية بصدگ."}, {"text": "من نيسان 2021، الشركة بدت تضغط على موظفينها. حسب نيويورك تايمز، الموظفين انطلب منهم يشترون منتجات استثمارية من ذراع الشركة المالي، اسمه \"إيفرغراند للثروة\"، لو يقرضون الشركة فلوس. والي يرفض؟ تنقطع عنه مكافأة الأداء."}, {"text": "شگد موظف؟ من 70 لـ80% من موظفي الشركة بكل الصين. واحد منهم، عمره 28 سنة، بمدينة خفي، حط 62 ألف دولار من فلوسه الخاصة."}, {"text": "تخيّل انت. الشركة الي تعطيك راتبك، تجي تگلك: أقرضني. وإذا ما تقرضها، تعاقبك. احفظ هذا المشهد، لأن بعد 3 سنين نفس الشركة راح تجي لموظفينها بطلب أغرب."}, {"text": "وبنفس الشهر، نيسان 2021، شركة السيارات الكهربائية التابعة لإيفرغراند وصلت قيمتها بالبورصة 87 مليار دولار. أكثر من شركة فورد. وهي لحد ذاك اليوم ما باعت ولا سيارة. ولا وحدة."}, {"text": "تخيّل مطعم ما طبخ ولا صحن، والناس دا يشترون أسهمه كأنه أكبر مطعم بالمدينة. هذا جان وضع الشركة الصغيرة. أما الشركة الأم؟ دا تستلف من موظفينها."}, {"text": "وبعدين إجه أيلول 2021."}, {"text": "بـ13 أيلول، المستثمرين الغاضبين دخلوا لوبي المقر بشنجن وصاحوا: \"إيفرغراند، رجعولنا فلوسنا\". وبگوانگجو، موظفين رفعوا لافتة مكتوب عليها: \"إيفرغراند نصبت على موظفينها بفلوس تعبوا عليها بدمهم وعرقهم\"."}, {"text": "وبنفس الشهر، مثل ما گلتلك بالبداية، حسب ملفات المصفّين، انشترى القصر الي بكاليفورنيا بـ20 مليون دولار. منو ساكن بيه، وشلون وصلوله، راح أحچيلك بعد شوية."}, {"text": "وهوي؟ بعيد منتصف الخريف، حوالي 21 أيلول، بعث رسالة لموظفينه گال بيها: \"آني مؤمن تماماً إنه بجهدكم وتعبكم، إيفرغراند راح تطلع من أظلم لحظة، وترجع للبناء الكامل بأسرع وقت\"."}, {"text": "ما طلعت."}, {"text": "بـ9 كانون الأول 2021، وكالة فيتش، وهي وكالة تقيّم إذا الشركات تگدر تسدد ديونها لو لا، أعلنت إن إيفرغراند بحالة \"تخلّف محدود عن السداد\". بكلام بسيط: اكو ديون إجه موعدها، والشركة ما دفعتها."}, {"text": "وبعدها بثلاث أسابيع، بـ30 كانون الأول، بلدية دانجو بجزيرة هاينان أمرت بهدم 39 بناية بمشروع لإيفرغراند اسمه \"جزيرة زهرة المحيط\". يعني الناس جانوا خايفين على بيوت ما انبنت، وهنا بيوت انبنت وانأمر بهدمها."}, {"text": "وبأول 2022، محتجة اسمها صوفي، عمرها 34 سنة، والشرطة أخذتها 4 مرات، گالت لرويترز: \"خايفين يضحّون بينا. ما نعرف شصار بفلوسنا، ويريدونا نسكت. هذا مو صح\"."}, {"text": "\"شصار بفلوسنا\". نفس سؤالنا بالضبط. بس الناس العاديين ما بقوا ينتظرون الجواب. قرروا يردّون."}, {"text": "بـ30 حزيران 2022، مشترين مشروع اسمه \"إيفرغراند لونگتينگ\" بمدينة جينگدجن، والمشروع واگف أكثر من سنة، نشروا رسالة مفتوحة. گالوا: إذا البناء ما يرجع كامل قبل 20 تشرين الأول 2022، كل المالكين الي ما سددوا قروضهم راح يوقفون الأقساط."}, {"text": "افهمها زين. هذوله ناس أخذوا قرض من البنك حتى يدفعون للشركة. وصاروا يسددون البنك كل شهر، على بيت ما موجود. فگالوا: خلاص، ما ندفع."}, {"text": "وخلال أسابيع، الفكرة انتشرت. أكثر من 300 مشروع واگف، بأكثر من 90 مدينة، مو كلها لإيفرغراند. وحسب CNN، القروض المعنية تقدّر بحوالي 2 تريليون يوان، يعني 296 مليار دولار. وكل هذا بدا من رسالة وحدة على مشروع واحد لإيفرغراند."}, {"text": "وبتموز 2022، الرئيس التنفيذي للشركة، شيا هايجون، استقال بعد تحقيق بضمانات قروض ما انكشفت. تذكّر هذا الاسم زين: شيا هايجون. هذا هو الرجل الثاني الي حچيتلك عنه بأول الحلقة."}, {"text": "وبتشرين الأول 2022، ملعب الـ100 ألف، ملعب زهرة اللوتس، أخذته شركة حكومية تابعة لبلدية گوانگجو. وحسب مواقع متخصصة، اشترت الأرض بـ3.155 مليار يوان، وغيّرت التصميم من زهرة لوتس لشكل نحت عاج، ونزّلت المقاعد لـ73 ألف."}, {"text": "وبهاي الفترة، اكو مستثمر اسمه وانگ، حاط فلوسه بـ\"إيفرغراند للثروة\". وحسب تقرير صيني، قصته تمشي هيچ: بكانون الأول 2021 بدا ياخذ 8000 يوان بالشهر من فلوسه. يعني الشركة صارت ترجعله فلوسه بالتقسيط. بتشرين الثاني 2022 نزلت لـ2000. بنيسان 2023 نزلت لـ400. وبعدين… 100 يوان بالشهر."}, {"text": "من 8000 لـ100. احفظ هذا الرقم، 100 يوان، لأن بعد شوية راح نحطه جنب مصروف واحد من كبار الشركة."}, {"text": "وديون \"إيفرغراند للثروة\" جانت واصلة 41 مليار يوان نهاية 2021، ولحد آب 2023 بعد أكثر من 30 مليار ما راجعة لأصحابها."}, {"text": "وبـ17 تموز 2023، إيفرغراند أخيراً طلّعت حساباتها المتأخرة: خسارة 581.9 مليار يوان، يعني 81 مليار دولار، بسنتين بس، 2021 و2022. والتزامات 2.4 تريليون يوان."}, {"text": "وبأيلول 2023، خه كنگ، نائب رئيس الإحصاء الصيني السابق، وعمره 81 سنة، گال كلام معناه: الصين بيها بيوت فارغة ما يملاها حتى 1.4 مليار نسمة، وأكثر تقدير متطرف يگول تكفي 3 مليار. احفظ هاي الجملة، البيوت الفارغة، لأن بالآخر راح تشوفها بشكل مقلوب."}, {"text": "وبنص أيلول 2023، الشرطة اعتقلت موظفين من \"إيفرغراند للثروة\". وبـ28 أيلول، الشركة نفسها أعلنت إن هوي كا يان خاضع لـ\"إجراءات إلزامية\" للاشتباه بجرائم. أغنى رجل بآسيا قبل 6 سنين، صار تحت إيد الشرطة."}, {"text": "ولحد هنا، القصة تبين بسيطة: شركة كبرت أكثر من حجمها، وصرفت على شغلات ما إلها داعي، وانسدت عليها الديون، ووگعت. والكل يدور منو أخذ الفلوس."}, {"text": "بس سنة 2024، طلعت ورقة قلبت السؤال كله."}, {"text": "بـ29 كانون الثاني 2024، بمحكمة بهونگ كونگ، القاضية ليندا چان أمرت بتصفية إيفرغراند. التصفية يعني المحكمة تعيّن ناس يسمونهم \"المصفّين\"، شغلهم يلمون كل شي تملكه الشركة، يبيعوه، ويوزعون الفلوس على الي إلهم ديون. وگالت القاضية جملة صارت مشهورة: \"إجه الوقت حتى المحكمة تگول: بس، كافي\"."}, {"text": "وتره هواي مواقع كتبت إن إيفرغراند \"أفلست\" سنة 2024. الأدق: سنة 2024 انصدر أمر تصفيتها بهونگ كونگ. أما التصفية الكبيرة داخل الصين، فهاي قصة ثانية، ووكتها بعده ما إجه."}, {"text": "وبعد أمر التصفية بشهرين بس، بـ18 آذار 2024، طلع الخبر الي يقلب كلشي حچيناه لهسه."}, {"text": "هيئة الأوراق المالية الصينية، يعني الجهة الي تراقب الشركات الي بالبورصة، أعلنت إن إيفرغراند ضخّمت إيراداتها، يعني مبيعاتها، بـ564 مليار يوان بسنتين. تقريباً 78 مليار دولار."}, {"text": "سنة 2019، حوالي نص الإيرادات منفوخة. وسنة 2020… حوالي 79%."}, {"text": "خليني أبسطها. تخيّل صاحب دكان يگلك: هاي السنة بعت بـ100 دولار. والحقيقة إنه بايع بـ21 بس. الـ79 الباقية؟ حبر على ورق."}, {"text": "فكّر بهاي شوية. احنا صارلنا نص حلقة ندور على فلوس الناس وين راحت. وطلع إن قسم من الأرقام الي صدّگها العالم كله، البنوك والمستثمرين والناس الي اشتروا الأسهم، ما جانت موجودة من الأساس."}, {"text": "والهيئة غرّمت هوي 47 مليون يوان، ومنعته من السوق مدى الحياة."}, {"text": "وهسه تتذكر الأرباح؟ الـ7 لـ8 مليار دولار الي استلمها هوي؟ الأرباح تنحسب من الأرقام. وإذا الأرقام منفوخة… فبنفس الفترة، بآذار 2024، المصفّين رفعوا دعوى بهونگ كونگ يطالبون بـ46.8 مليار دولار هونگ كونگي، يعني حوالي 6 مليار دولار، على أرباح ومكافآت يگولون إنها انصرفت على أساس حسابات مزورة. على منو؟ على هوي، وزوجته السابقة دينگ يومي، والرئيس التنفيذي السابق شيا هايجون، والمدير المالي السابق پان دارونگ."}, {"text": "بس اكو سؤال يضل يحك براسك: هاي الأرقام المنفوخة، منو وقّع عليها؟ جان اكو مدقق حسابات، يعني شركة شغلتها تفحص الأرقام وتگول للعالم: هاي صحيحة. وهاي الشركة اسم عالمي، وراح نوصلها."}, {"text": "وخليني أوگف ثواني وألخصلك وين وصلنا. عدنا فلوس انصرفت على ماي وكرة وملعب وسيارات. وعدنا مليارات دخلت جيب المؤسس كأرباح. وعدنا أرقام، سنة 2020 تقريباً أربعة أخماسها، ما جانت حقيقية. والناس؟ بعدهم ينتظرون."}, {"text": "وبتشرين الثاني 2024، صار شي ما يتصدگ. الشركة طالبت المدراء الحاليين والسابقين يرجّعون 15% من رواتبهم ومكافآتهم عن السنين من 2017 لـ2021. وموظفي \"إيفرغراند للثروة\" يرجّعون العمولات الي أخذوها. والفلوس تنحط بحساب بنكي فتحته الشرطة، وآخر موعد 30 تشرين الثاني 2024."}, {"text": "تتذكر الموظفين الي انجبروا يقرضون الشركة سنة 2021؟ هسه، بعد 3 سنين، نفس الشركة رجعت تطلب من موظفينها فلوس. الناس الي بنوا الإمبراطورية، صاروا ضحاياها مرتين."}, {"text": "وسنة 2025، بدت المطاردة الحقيقية للفلوس."}, {"text": "بـ6 كانون الثاني 2025، نادي گوانگجو، بطل آسيا مرتين، انحل بسبب ديونه."}, {"text": "وبـ12 آب 2025، المصفّين بهونگ كونگ طلّعوا رقم يوجع: المطالبات 45 مليار دولار. وخلال 18 شهر، شگد گدروا يبيعون؟ 255 مليون دولار بس. باعوا أسهم بشركات وساطة، وسندات مدارس، وعضويات نوادي، ولوحات فنية، وسيارات. يعني الي إله دولار، لحد ذاك الوكت انجمع مقابله تقريباً نص سنت."}, {"text": "وبعدها بأسبوعين، بـ25 آب 2025، انشطبت إيفرغراند من بورصة هونگ كونگ، بعد 16 سنة. نفس البورصة الي جمعت منها أكثر من 700 مليون دولار سنة 2009."}, {"text": "ومن هنا بدت ملاحقة فلوس العائلة."}, {"text": "بـ16 أيلول 2025، محكمة هونگ كونگ عيّنت المصفّين حرّاس على كل أموال هوي الشخصية. الحارس هنا يعني المحكمة تسلّم أموالك لناس ثانيين يديرونها بدالك. وأموال هوي المجمّدة تقدّر لحد 7.7 مليار دولار. ليش هاي الخطوة؟ لأن هوي رفض يكشف شنو عنده. والقاضي گال إن هذا هو \"الطريق الوحيد\" حتى يوصلون للمعلومات الي جان لازم هوي بنفسه يكشفها. وهنا اكو تفصيل صغير عن هوي، عن أغنى رجل بآسيا وفلوس المحكمة، راح أخليه للآخر."}, {"text": "وزوجته السابقة، دينگ يومي؟ حسب تقارير، طلعت من هونگ كونگ لكندا بتموز 2023، وأخذت الجنسية الكندية بآب 2023. وبـ26 تشرين الثاني 2025، القاضي وسّع تجميد أموالها ليشمل 220 مليون دولار، موزعة على أربع أماكن: 100 مليون دولار كندي ببنك رويال الكندي، و71 مليون دولار بسنغافورة، و57.6 مليون دولار ببنك UBS بجبل طارق، و675 ألف جنيه إسترليني بجزيرة جيرسي."}, {"text": "بس الي صار ويا الرجل الثاني بالشركة… أغرب من هذا كله."}, {"text": "وهسه نرجع للقصر، مثل ما وعدتك. شيا هايجون، الرجل الثاني، طلع لكاليفورنيا. وحسب ملفات المصفّين الي نقلتها بلومبرغ، العقار الي انشترى بأيلول 2021 بـ20 مليون دولار، نفس شهر \"رجعولنا فلوسنا\"، هسه يسوى أكثر من 30 مليون. والمصفّين لگوا شيا ساكن بهذا القصر، وابنه، عمره 12 سنة، بمدرسة خاصة. وگالوا بالمحكمة إن شيا دا ينقل أمواله ويلعب وياهم لعبة \"الحگني إذا تگدر\"."}, {"text": "شيا استأنف، وبكانون الثاني 2026 محكمة الاستئناف بهونگ كونگ رفضت استئنافه وبقى التجميد. والمحكمة جانت حاطة سقف لمصروفه الشهري: 50 ألف دولار هونگ كونگي. وبحزيران 2026، طلب يرفعه. لشگد؟ حسب تقارير صحفية عن ملفات القضية، لحوالي 43 ألف دولار أمريكي بالشهر. ومن ضمن المصاريف الي دافع عنها: حقيبة ديور لبنته، ومصاريف مدرسة ابنه. والمصفّين يتهمونه إنه حوّل حوالي 78 مليون دولار بعد التجميد، وصرف 300 ألف دولار ببطاقة أمريكان إكسبريس سنة 2025."}, {"text": "هسه حط الرقمين جنب بعض. وانگ، المستثمر الصغير، صار ياخذ 100 يوان بالشهر من فلوسه. وشيا، الرجل الثاني بنفس الشركة، يطلب 43 ألف دولار بالشهر مصروف."}, {"text": "وداخل الصين، بآذار 2026، فرع إيفرغراند العقاري بشنجن دخل تصفية. وحسب تقارير صينية، 414 دائن، يعني ناس وشركات إلهم فلوس عند الشركة، قدّموا مطالبات بـ250 مليار يوان. المصفّي اعترف بـ52.3 مليار بس. يعني حتى قبل ما نسأل شگد راح يرجع، حوالي أربعة أخماس المطالبات… ما انعترف بيها أصلاً. وهذا فرع واحد بس. الشركة الأم، الأكبر، دورها جاي، وبيوم محد توقعه."}, {"text": "وهسه نرجع لسؤال المدقق. الشركة الي دققت حسابات إيفرغراند اسمها PwC، شركة تدقيق عالمية. بـ23 نيسان 2026، فرع PwC بهونگ كونگ وافق يدفع 1.3 مليار دولار هونگ كونگي، يعني 166 مليون دولار، حتى يسكّر التحقيقات. منها غرامة، ويا منع 6 شهور من قبول شركات مدرجة جديدة كزبائن، ومليار دولار هونگ كونگي لصندوق تعويض صغار المساهمين. وهيئة الأوراق المالية بهونگ كونگ گالت إن الاتفاق يسكّر الموضوع \"بشكل كامل ونهائي\". وكل هذا بدون ما PwC تعترف بأي مسؤولية."}, {"text": "بس المصفّين ما سكتوا. بأيار 2026 طالبوا PwC بـ8.4 مليار دولار، بسبب الي يسمونه \"إهمال\" و\"تضليل\" بالتدقيق. وحسب SCMP، طعنوا حتى بتسوية المليار. وبـ26 آب 2026، محكمة هونگ كونگ رفضت طلب PwC International تطلع من القضية. يعني هاي المعركة بعدها مفتوحة."}, {"text": "ونوصل لسنة 2026. سنة الحساب."}, {"text": "بـ13 و14 نيسان 2026، انحاكم هوي بمحكمة الشعب المتوسطة بشنجن. وحسب وكالة شينخوا، اعترف بالتهم، وبكلمته الأخيرة \"عبّر عن الندم\"."}, {"text": "والتهم ثمانية. راح أگولها مثل ما انذكرت بالحكم، بس بكلام بسيط: جمع ودائع من الناس بشكل غير قانوني. والاحتيال بجمع الأموال. ومنح قروض بشكل غير قانوني. واستخدام أموال بشكل غير قانوني. وإصدار أوراق مالية بالاحتيال. والإفصاح المخالف عن معلومات مهمة، يعني معلومات جان لازم تنعلن بشكلها الصحيح وما انعلنت. والاستيلاء على أموال الشركة بحكم منصبه. ورشوة باسم الشركة."}, {"text": "والمحكمة گالت إن من 2016 لـ2021، الشركة وهوي سوّوا \"تزوير مالي مستمر وواسع\" حتى يكبّرون الأملاك ويخفون الديون. وعن طريق الرشوة وغيرها، سيطروا على مؤسسات مالية، وسحبوا منها فلوس قروض وفلوس تأمين بشكل غير قانوني."}, {"text": "وبعدين إجه يوم الحكم."}, {"text": "تتذكر التاريخ الي گلتلك احفظه؟"}, {"text": "20 آب 2026. نفس اليوم الي انولدت بيه الخطوط الحمراء سنة 2020. بس بعد 6 سنين بالضبط."}, {"text": "لو تشوف صور المحكمة، تشوف رجال عمره 67 سنة، شعره رمادي، واگف بين شرطيين بقميص كحلي. والحكم: سجن مؤبد، وحرمان من الحقوق السياسية مدى الحياة، ومصادرة كل أمواله الشخصية. وغرامة على مجموعة إيفرغراند 8.82 مليار يوان، وعلى إيفرغراند العقارية 7 مليار يوان. المجموع حوالي 2.35 مليار دولار."}, {"text": "ووياه 56 شخص ثاني، بضمنهم ابنيه، أحكامهم من سنة و10 شهور لحد 18 سنة. وحكم كل ابن بالضبط ما انعلن بالتفاصيل الي وصلتنا."}, {"text": "والمحكمة وصفت القضية هيچ: \"المبلغ ضخم بشكل استثنائي، والظروف فظيعة، والخسائر الاقتصادية هائلة، والضرر على المجتمع خطير كلش\"."}, {"text": "بـ20 آب 2020 سدّوا الحنفية عنه. وبـ20 آب 2026 سدّوا الباب عليه."}, {"text": "بس اسمع شنو گال الحكم عن الأموال غير المشروعة: \"يستمر استردادها، والنقص يُعوّض\". يعني حسب الحكم نفسه: الفلوس بعدها ما رجعت كلها."}, {"text": "وهواي ناس گالوا: خلص، انتهت القصة."}, {"text": "ثاني يوم بالضبط، 21 آب 2026، محكمة بگوانگجو قبلت طلب تصفية \"إيفرغراند العقارية\"، الشركة الأم داخل الصين. الطلب قدّمه فرع لبنك محلي، لأن الشركة ما تگدر تسدد ديونها، وأملاكها ما تكفي. وشگد ديونها؟ حسب كايشين، حوالي 2 تريليون يوان."}, {"text": "وهنا تنسد البذرة الي زرعناها بأول الحلقة. تتذكر البيع قبل البناء؟ حسب تحليل صيني، الي دخل التصفية هو الي يسمونه \"الخزنة الكبيرة\" للمجموعة. وحسب نفس التحليل، إيفرغراند جانت تجمع فلوس الشقق الي تنباع على الخارطة، من مشاريعها بكل المحافظات، بحساب مركزي واحد، وبعدين توزعها على مشاريع ثانية، أو حتى على شغلات ما إلها علاقة بالعقار."}, {"text": "يعني إذا هذا التحليل صحيح، فالعائلة الي دفعت على شقة بمشروع، فلوسها ممكن تكون راحت تبني مشروع بمدينة ثانية، لو راحت لشي ثاني بالمرة. البيع قبل البناء صنع هوي كا يان… وبالآخر هو الي دفنه."}, {"text": "وبنفس اليوم، 21 آب، الجهة الرقابية المالية بالصين ألغت رخصة شركة \"إيفرغراند للتأمين على الحياة\". والسبب، حسب كايشين: استخدام فلوس التأمين بشكل غير قانوني، ونقل منافع لأطراف مرتبطة بيها، وتزوير تقارير. وحسب التقارير، الشركة جانت وسيلة تمويل للمجموعة. يعني ناس دفعوا حتى يأمّنون على حياتهم، وفلوسهم، حسب الرقابة، انصرفت بشكل غير قانوني."}, {"text": "زين، هسه السؤال الي يهم كل واحد إله فلوس عند الشركة: شگد راح يرجعلي؟ حسب تقديرات صينية، الدائن العادي، يعني الي ماعنده أملاك مرهونة تضمن حقه، متوقع ياخذ بين 3 و8 من كل 100. وبفرع سابق لإيفرغراند بمدينة جانجيانگ، الدائنين العاديين أخذوا 0.69%. يعني الي جان إله 100 يوان، رجعله أقل من يوان واحد."}, {"text": "والمشترين الي بعدهم ينتظرون؟ بعد الحكم، تقارير صينية حچت عن مالكين ساكتين. قسم منهم سكنوا بشقق نص مخلصة، لأن الإيجار الي يوفرونه، حوالي 2000 يوان بالشهر، هو نفسه قسط القرض. بلا غاز، يستعملون قنينة. وبلا ماي حار. والبنك ما يرحم: يوم تأخير واحد ينحسب بسجلك الائتماني، يعني سمعتك عند البنوك، وثلاث شهور توقف تعني دعوى قضائية."}, {"text": "وبقت شغلتين وعدتك نرجعلهن: شركة السيارات، ونانينغ."}, {"text": "شركة السيارات، الي جانت أغلى من فورد، أول سيارة إلها انسلمت بتشرين الأول 2022. وبأيلول 2026، أعلنت إنها طلعت نهائياً من صناعة السيارات، وراح تشتغل بتجارة البطاريات. عليها ديون 32.72 مليار يوان. والنقد الي بصندوقها؟ 205 آلاف يوان. يعني أقل من 30 ألف دولار. نفس الشركة الي جانت تسوى 87 مليار دولار بالبورصة."}, {"text": "ونانينغ؟ مشروع العشر آلاف شقة بيوم واحد؟ بالنص الثاني من 2021 سكت موقع البناء. بشباط 2022 تأكد إنه واگف. سنة 2023 الشركة أعلنت عن قرض حكومي \"ضمان تسليم\" ينصرف على دفعات. وبـ21 أيلول 2026، تقرير صيني وصفه بجملة وحدة: \"انطبل هواي وقتها، وهسه خراب\"."}, {"text": "بس خليني آخذك لمكان ما تتوقعه. تتذكر سؤالي بالبداية؟ المدن الي بناها هوي، منو ساكن بيها هسه؟"}, {"text": "على الساحل الشرقي للصين، بمدينة چيدونگ، اكو مشروع لإيفرغراند اسمه \"الحياة بالبندقية\". نسخة من مدينة البندقية الإيطالية، كلّفت مليارات الدولارات. بيها 46 ألف وحدة سكنية. وحسب وكالة AP، أقل من وحدة من كل 5 مسكونة. قوارب مهجورة، ولافتات \"للبيع\"، ومحلات فارغة."}, {"text": "وهناك تعيش ساشا تشن. عمرها 28 سنة. جانت تشتغل بوظيفة مالية بشنگهاي، ودخلها عالي، وتعبت. فأجّرت شقة بالبندقية المزيفة بـ1200 يوان بالشهر. يعني 168 دولار."}, {"text": "وساشا تعتبر نفسها… متقاعدة. بعمر 28."}, {"text": "گالت لـAP: \"عندي كل الوقت بالدنيا، وحرية أسوي الي أريده. عايشة الحياة الي أريدها\"."}, {"text": "تتذكر خه كنگ، الي گال إن بيوت الصين الفارغة ما يملاها 1.4 مليار نسمة؟ هاي هي البيوت الفارغة. بس لساشا ما صارت مأساة. صارت ملجأ."}, {"text": "وبمدينة هوايلاي، 130 كيلو عن بكين، اكو مشروع ثاني لإيفرغراند. حسب تقارير صحفية، جان مخطط إله 11 ألف و326 وحدة و30 ألف ساكن، وهسه بيه حوالي 1500. وحسب صحيفة لوموند الفرنسية، بـ7 أيلول 2026، هناك متحف نبيذ على شكل اسطوانتين بنفسجية ما انفتح أبد، وعربات گولف وباصات عليها اسم إيفرغراند دا تصدّي بالشمس."}, {"text": "وبهاي المدينة اكو تفصيل صغير يرجعنا لسؤال الفلوس نفسه. بس خليني أعرّفك على سكانها أول. حسب تقارير صحفية، هناك تعيش لين يوپينگ، عمرها 49 سنة، تركت شغلها المالي ببكين، وتأجر شقة غرفتين بـ900 يوان بالشهر. وزوجين متقاعدين اشتروا شقة 110 متر بـ320 ألف يوان، ونفس الشقة جان سعرها قبل سنين 1.2 مليون. ليش رخيصة هيچ؟ لأن إيفرغراند سدّدت ديون مورّدينها… بشقق."}, {"text": "يعني الانهيار الي ضرب ملايين الناس، صنع بنفس الوقت أرخص سكن بالصين. والسوق كله بعده ينزل: بأول 8 شهور من 2026، الاستثمار بالعقار بالصين نزل 19.9%، حسب المكتب الوطني للإحصاء. وحسب Asia Times، بمدن هواي أسعار البيوت نزلت أكثر من 40%."}, {"text": "هسه نرجع للسؤال الي بدينا بيه: فلوس الناس… وين راحت؟"}, {"text": "جمعنا الجواب قطعة قطعة، وطلع أربع وجهات."}, {"text": "الأولى: أراضي ومدن ما خلصت. نانينغ الي صارت خراب، والبندقية الي أقل من خمسها مسكون، وهوايلاي، و39 بناية بهاينان انأمر بهدمها. وحسب تحليل صيني، فلوس البيع على الخارطة جانت تنلم بخزنة وحدة وتتنقل من مشروع لمشروع."}, {"text": "الثانية: مشاريع ما إلها علاقة بالبيوت. ماي خسّر حوالي 4 مليار يوان. ونادي كرة بطل آسيا مرتين، وانحل. وملعب 100 ألف، راح لغيرهم. وسيارات جانت أغلى من فورد، وهسه النقد الي عدها 205 آلاف يوان. وشركة تأمين انسحبت رخصتها لأن فلوسها، حسب الرقابة، انصرفت بشكل غير قانوني."}, {"text": "الثالثة: جيوب قليلة. 7 لـ8 مليار دولار أرباح استلمها هوي حسب بلومبرغ. ودعوى بـ6 مليار على أرباح ومكافآت، يگول المصفّين إنها انصرفت على حسابات مزورة. و220 مليون مجمّدة للزوجة السابقة. وقصر بكاليفورنيا."}, {"text": "والرابعة، وهي الأغرب: قسم من الفلوس ما جان موجود أصلاً. 564 مليار يوان مبيعات على الورق بس."}, {"text": "وشگد راح يرجع؟ بهونگ كونگ، المصفّين باعوا بـ255 مليون مقابل مطالبات 45 مليار. وداخل الصين، حسب التقديرات، الدائن العادي ياخذ بين 3 و8 من كل 100."}, {"text": "يعني هسه نگدر نجاوب الناس الي صاحوا بلوبي شنجن بأيلول 2021: فلوسكم راحت هنا. والي راح يرجعلكم، حسب التقديرات، قليل كلش. أما القصر الي انشترى بنفس ذاك الشهر؟ حسب ملفات المصفّين، هسه يسوى أكثر من 30 مليون."}, {"text": "وخليني أختم بالتفصيل الصغير الي وعدتك بيه."}, {"text": "الرجال الي جان أغنى واحد بآسيا، بثروة حوالي 45 مليار دولار، محكمة هونگ كونگ بشباط 2026 أعطته مهلة لـ20 شباط، حتى يدفع 1.2 مليون دولار هونگ كونگي مصاريف قضائية. يعني حوالي 150 ألف دولار أمريكي. وإذا ما يدفع، يخسر حقه يدافع عن نفسه. ليش المهلة؟ لأنه ما دفعها من تشرين الثاني 2025. وبأيلول 2026، المحكمة رفضت إن محاميه ياخذون أتعابهم، 153 ألف دولار، من أمواله المحروسة."}, {"text": "الرجال الي جان عنده 1300 مشروع بـ280 مدينة، صارت المحكمة تلاحگه على مصاريف قضية."}, {"text": "والقصة ما خلصت. بـ21 تشرين الثاني 2026، آخر يوم يسجل بيه الدائنين مطالباتهم بتصفية الشركة الأم. وبعدها يبدي الحساب الحقيقي: منو ياخذ، وشگد."}, {"text": "والي أريدك تطلع بيه من هاي الحلقة بسيط: كل مرة تدفع فلوسك على وعد، اسأل قبل ما تدفع: فلوسي وين راح تروح، قبل ما يصير الوعد حقيقة؟ لأن مليون و600 ألف عائلة دفعت على وعد، والي وعدهم جان أغنى رجل بآسيا."}, {"text": "وانت؟ دفعت يوم فلوس مقدماً على شي بعدك ما شفته؟ اكتبلي بالتعليقات شصار وياك."}], "words": 4321};
const $ = (id) => document.getElementById(id);
const text = $("text");
DATA.paras.forEach((p) => { const el = document.createElement("p"); if (p.mark) { el.className = "mark"; el.textContent = "● " + p.mark; } else el.textContent = p.text; text.appendChild(el); });
let y = 0, playing = false, last = 0, mirrored = false, idle;
const wpm = () => +$("speed").value;              // words a minute: 140 ≈ his normal pace
function pxPerSec(){ const words = DATA.words, h = text.scrollHeight - innerHeight * 1.25; return h / Math.max(1, words / wpm() * 60); }
function draw(){ text.style.transform = `translateY(${-y}px)` + (mirrored ? " scaleX(-1)" : "");
  const left = Math.max(0, (text.scrollHeight - innerHeight * 1.25 - y) / pxPerSec()); $("left").textContent = `باقي ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, "0")}`; }
function frame(t){ if (playing){ y += pxPerSec() * Math.min(0.1, (t - last) / 1000); y = Math.min(y, text.scrollHeight); draw(); } last = t; requestAnimationFrame(frame); }
requestAnimationFrame((t) => { last = t; frame(t); });
function toggle(){ playing = !playing; $("play").textContent = playing ? "❚❚ وگّف" : "▶ كمّل"; showBar(); }
function showBar(){ $("bar").classList.remove("hide"); clearTimeout(idle); if (playing) idle = setTimeout(() => $("bar").classList.add("hide"), 2500); }
$("play").onclick = (e) => { e.stopPropagation(); toggle(); };
$("back").onclick = (e) => { e.stopPropagation(); y = Math.max(0, y - innerHeight * 0.4); draw(); };
$("speed").oninput = () => draw();
$("size").oninput = (e) => { document.documentElement.style.setProperty("--size", e.target.value + "px"); draw(); };
$("mirror").onclick = (e) => { e.stopPropagation(); mirrored = !mirrored; draw(); };
$("stage").addEventListener("click", toggle);
addEventListener("keydown", (e) => { if (e.key === " "){ e.preventDefault(); toggle(); } if (e.key === "ArrowUp"){ y = Math.max(0, y - 80); draw(); } if (e.key === "ArrowDown"){ y += 80; draw(); } });
addEventListener("wheel", (e) => { y = Math.max(0, y + e.deltaY); draw(); }, {passive: true});
let ty = null; addEventListener("touchstart", (e) => { ty = e.touches[0].clientY; }, {passive: true});
addEventListener("touchmove", (e) => { if (ty == null) return; const d = ty - e.touches[0].clientY; ty = e.touches[0].clientY; y = Math.max(0, y + d); draw(); }, {passive: true});
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (_) {}
draw();
</script>
