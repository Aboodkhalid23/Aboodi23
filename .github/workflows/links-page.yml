# ينشر صفحة الروابط (مجلد links) على GitHub Pages تلقائياً بكل تعديل
name: صفحة الروابط

on:
  push:
    paths: ["links/**", ".github/workflows/links-page.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: links
      - id: deployment
        uses: actions/deploy-pages@v4
