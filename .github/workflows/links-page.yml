# ينشر صفحة الروابط (مجلد links) على GitHub Pages تلقائياً بكل تعديل
name: صفحة الروابط

on:
  push:
    branches: ["claude/github-skills-development-3orc6c"]   # الفرع الوحيد المسموحله بالنشر (الفروع الثانية كانت تفشل وتلغي النشر الصحيح)
    paths: ["links/**", "scripts/update-salah.py", "scripts/make-salah-ics.py", ".github/workflows/links-page.yml"]
  schedule:
    - cron: "17 1 * * *"   # كل يوم بالليل: يحدّث جدول الصلاة من موقع مسجد توركو
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: تحديث جدول الصلاة من موقع المسجد
        run: python3 scripts/update-salah.py || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: links
      - id: deployment
        uses: actions/deploy-pages@v4
