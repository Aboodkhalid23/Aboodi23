<!doctype html><html><meta charset="utf-8"><style>
@font-face{font-family:U;src:url(fonts/ui-700.woff2)}@font-face{font-family:A;src:url(fonts/amiri.woff2)}
*{margin:0;box-sizing:border-box}html,body{width:720px;height:1280px;overflow:hidden;background:#0b1026}
#c{position:absolute;inset:0}
.top{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:U;color:#e9bd5f}
.top img{width:64px;border-radius:16px;vertical-align:middle;margin:0 10px}.top b{font-size:34px;vertical-align:middle}
.lbl{position:absolute;top:150px;left:0;right:0;text-align:center;font-family:U;font-size:26px;color:#cdd2e6}
#txt{position:absolute;left:70px;right:70px;top:300px;height:700px;display:flex;align-items:center;justify-content:center;text-align:center;color:#f3ecd8}
#txt.ar{font-family:A;font-size:50px;line-height:1.75;direction:rtl}#txt.en{font-family:U;font-size:40px;line-height:1.45}
#txt span{display:inline}
.foot{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-family:U;font-size:22px;color:#a3aac8}
#bar{position:absolute;bottom:40px;left:120px;height:5px;border-radius:9px;background:#e9bd5f}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:U;color:#e9bd5f;opacity:0}
#end img{width:150px;border-radius:36px}#end b{font-size:56px}#end p{font-size:28px;color:#cdd2e6}
</style><body><canvas id="c" width="720" height="1280"></canvas>
<div class="top"><img src="icon-192.png"><b id="brand"></b></div><div class="lbl" id="lbl"></div>
<div id="txt"></div><div class="foot" id="foot"></div><div id="bar"></div>
<div id="end"><img src="icon-192.png"><b id="eb"></b><p id="ep"></p></div>
<script>/*DATA*/
var D=window.D,AR=D.lang=='ar',c=document.getElementById('c'),x=c.getContext('2d');
document.getElementById('brand').textContent=AR?'أوّاب':'Awwab';
document.getElementById('lbl').textContent=AR?'حديث اليوم · الحديث '+D.n+' من الأربعين النووية':'Hadith of the day · '+D.n+" of An-Nawawi's Forty";
document.getElementById('foot').textContent=AR?'المصدر: الأربعون النووية':"Source: An-Nawawi's Forty Hadith";
document.getElementById('eb').textContent=AR?'أوّاب':'Awwab';document.getElementById('ep').textContent=AR?'طريق العودة إلى الله':'The way back to Allah';
var T=document.getElementById('txt');T.className=AR?'ar':'en';
function star(cx,cy,r,a){x.beginPath();for(var i=0;i<16;i++){var ang=a+i*Math.PI/8,rr=i%2?r*.72:r;x.lineTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang))}x.closePath()}
function bg(t){var g=x.createRadialGradient(360,0,50,360,300,1300);g.addColorStop(0,'#24345f');g.addColorStop(.45,'#121a3c');g.addColorStop(1,'#0b1026');x.fillStyle=g;x.fillRect(0,0,720,1280);
 x.strokeStyle='rgba(233,189,95,.07)';x.lineWidth=1.5;for(var yy=0;yy<1400;yy+=120)for(var xx=(yy/120%2)*60;xx<800;xx+=120){star(xx,yy-(t*8%120),34,t*.05);x.stroke()}
 // نجوم صغيرة تلمع
 for(var i=0;i<40;i++){var sx=(i*137)%720,sy=(i*263)%560,a=.3+.7*Math.abs(Math.sin(t*1.3+i));x.fillStyle='rgba(255,255,255,'+a*.8+')';x.fillRect(sx,sy,2,2)}
 // نافذة القبة
 x.save();x.strokeStyle='rgba(233,189,95,.85)';x.lineWidth=3;x.beginPath();x.moveTo(60,1090);x.lineTo(60,520);x.quadraticCurveTo(60,240,360,230);x.quadraticCurveTo(660,240,660,520);x.lineTo(660,1090);x.closePath();x.stroke();
 x.strokeStyle='rgba(233,189,95,.3)';x.lineWidth=1.2;x.beginPath();x.moveTo(78,1072);x.lineTo(78,525);x.quadraticCurveTo(78,262,360,252);x.quadraticCurveTo(642,262,642,525);x.lineTo(642,1072);x.closePath();x.stroke();x.restore();
 // مسجد جوه
 x.fillStyle='#070b1c';x.beginPath();x.moveTo(0,1280);x.lineTo(0,1180);x.lineTo(150,1180);x.quadraticCurveTo(150,1120,210,1120);x.quadraticCurveTo(270,1120,270,1180);x.lineTo(450,1180);x.quadraticCurveTo(450,1120,510,1120);x.quadraticCurveTo(570,1120,570,1180);x.lineTo(720,1180);x.lineTo(720,1280);x.fill();
 x.beginPath();x.moveTo(250,1180);x.quadraticCurveTo(250,1060,360,1050);x.quadraticCurveTo(470,1060,470,1180);x.fill();x.fillRect(40,1060,26,140);x.fillRect(654,1060,26,140);
 // فانوس يتمايل
 var sw=Math.sin(t*1.2)*.05;x.save();x.translate(360,262);x.rotate(sw);x.strokeStyle='#e9bd5f';x.lineWidth=2;x.beginPath();x.moveTo(0,0);x.lineTo(0,18);x.stroke();
 var gl=.55+.45*Math.abs(Math.sin(t*1.6));x.fillStyle='rgba(255,215,122,'+gl*.22+')';x.beginPath();x.arc(0,52,46,0,7);x.fill();
 x.fillStyle='#e9bd5f';x.beginPath();x.moveTo(-14,18);x.lineTo(14,18);x.lineTo(20,52);x.lineTo(0,84);x.lineTo(-20,52);x.closePath();x.globalAlpha=.85;x.fill();x.globalAlpha=1;x.fillStyle='#ffe08a';x.beginPath();x.arc(0,50,7,0,7);x.fill();x.restore()}
var cur=-1;
window.R=function(t){bg(t);var i=-1;for(var k=0;k<D.times.length;k++)if(t>=D.times[k][0]-.15)i=k;
 var endT=D.total-2.4,e=document.getElementById('end');e.style.opacity=t>endT?Math.min(1,(t-endT)/.6):0;e.style.background=t>endT?'rgba(11,16,38,'+Math.min(.97,(t-endT)/.6)+')':'none';
 if(i!=cur){cur=i;T.innerHTML='';if(i>=0){var s=document.createElement('span');s.textContent=D.segs[i];T.appendChild(s)}}
 if(i>=0){var a=D.times[i],p=Math.min(1,(t-a[0]+.15)/.4);T.style.opacity=p;T.style.transform='translateY('+(1-p)*24+'px)'}else{T.style.opacity=0}
 document.getElementById('bar').style.width=(480*Math.min(1,t/D.total))+'px'};
R(0);
</script></body></html>
