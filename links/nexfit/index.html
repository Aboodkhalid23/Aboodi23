:root[data-theme=light] .card,:root[data-theme=light] .exrow,:root[data-theme=light] .meal2,:root[data-theme=light] .mini{box-shadow:0 2px 12px rgba(0,0,0,.04)}

.stage,.anim{color:#f6f6f8}.dishhero h1,.dishhero p{color:#fff}

.sl{animation:sl .32s cubic-bezier(.2,.8,.2,1)}.sr{animation:sr .32s cubic-bezier(.2,.8,.2,1)}

.noanim *{animation:none!important;transition:none!important}

:root:not([data-theme=light]){--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:#2c2c2e;--glass:var(--s1);--edge:transparent}
body,:root:not([data-theme=light]) body{background:var(--bg)!important}
.card,.slist,.exrow,.rrow,.frow,.mcard,.store,.bcard,.prow,.trow,.tile,.lastt,.hcard,.smart,.coach,.scard,.forecard,.irow,.wrow,.sgrp,.sprof{background:var(--s1)!important;border:0!important;box-shadow:0 2px 14px rgba(0,0,0,.05)!important;color:var(--fg)}
:root:not([data-theme=light]) .card,:root:not([data-theme=light]) .slist,:root:not([data-theme=light]) .exrow,:root:not([data-theme=light]) .rrow,:root:not([data-theme=light]) .frow,:root:not([data-theme=light]) .mcard{box-shadow:none!important}
.card{border-radius:24px;padding:18px}
.sec-h h2::before{display:none}
.btn{background:var(--g);box-shadow:none}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--s2);color:var(--fg)}
main.fade>*,main.sl>*,main.sr>*{animation:none}
main.fade,main.sl,main.sr{animation:fade .25s ease}
.scanhero .ring{animation:none}
nav{background:none;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
nav .in{grid-template-columns:repeat(5,1fr)!important;background:var(--s1)!important;border:0!important;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.10)!important;padding:8px 4px!important}
nav a{font-size:11px;color:var(--mut);background:none!important;padding:4px 0}
nav a.on{color:var(--g)!important;font-weight:700}nav a.on::after{display:none!important}
nav a svg{width:23px;height:23px}
/* الرئيسية */
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hhead p{font-size:14px}.hhead h1{font-size:28px;margin-top:2px}
.streak{background:var(--s1);border:0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.rings2{flex-direction:row!important;align-items:center;gap:16px}.rings2 svg{width:124px;height:124px;flex:none;transform:rotate(-90deg)}
.rings2 .lg{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}.rings2 .lg>div{display:flex;align-items:center;gap:8px;font-size:13.5px}.rings2 .lg i{width:10px;height:10px;border-radius:50%;flex:none}.rings2 .lg b{margin-right:auto;font-size:15px}
.wo{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:right;color:var(--fg)}
.wo img{width:92px;height:92px;border-radius:20px;object-fit:cover;flex:none}.wo small{color:var(--g);font-weight:700;font-size:12.5px}.wo h2{font-size:22px;margin:2px 0}.wo p{font-size:13px;color:var(--mut)}
.donebox{background:rgba(52,199,89,.12);color:#1f9d47;border-radius:14px;padding:12px;text-align:center;font-weight:700}
.mlist{display:flex;flex-direction:column}.mlist button{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:right;color:var(--fg);width:100%}
.mlist button:last-child{border:0}.mlist .e,.linkc .e{width:42px;height:42px;border-radius:13px;background:var(--s2);display:grid;place-items:center;font-size:20px;flex:none}
.mlist .grow{display:flex;flex-direction:column;min-width:0}.mlist b{font-size:15.5px}.mlist small,.linkc small{font-size:12.5px;color:var(--mut)}.mlist .p{color:var(--g);font-size:16px;margin-right:auto}
.mlist button.on .e{background:rgba(52,199,89,.15);color:#1f9d47}.mlist button.on .grow b{color:var(--mut);text-decoration:line-through}
.linkc{flex-direction:row!important;align-items:center;gap:12px;text-decoration:none}.linkc .grow{display:flex;flex-direction:column}.linkc b{font-size:16px}.linkc svg{width:18px;height:18px;color:var(--mut)}
/* بطاقات كانت قوية: صارت هادئة */
.hero{background:var(--s1)!important;color:var(--fg)!important;box-shadow:0 2px 14px rgba(0,0,0,.05)!important;min-height:170px}
.hero .wm{display:none}.hero .lab,.hero .mut,.hero p{color:var(--mut)!important}.hero .lab{color:var(--g)!important;opacity:1}
.hero img{-webkit-mask-image:none!important;mask-image:none!important;height:100%!important;width:42%!important;object-fit:cover;border-radius:0 0 0 24px;left:0!important}
.hero h1{font-size:28px;text-shadow:none!important}.hero .go{background:var(--fg)!important;color:var(--bg)!important}
.scanhero{background:var(--s1)!important;color:var(--fg)!important;box-shadow:0 2px 14px rgba(0,0,0,.05)}.scanhero .ring{background:rgba(255,45,61,.1)!important;color:var(--g)}.scanhero small{color:var(--mut)}
.forecard{color:var(--fg)!important}.forecard small{color:var(--mut)}
.smart{background:var(--s1)!important}
.coach{background:var(--s1)!important}
.danger{background:rgba(255,45,61,.07)}.okbox{background:rgba(52,199,89,.08)}
.stile:not(.mini2)>div{background:linear-gradient(transparent,rgba(0,0,0,.7))}
.curmeal{box-shadow:0 6px 24px rgba(0,0,0,.12)}
:root[data-theme=light] .mpic,.dishhero{background:#eee}
.chips button,.cats button{background:var(--s1);border:0;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.chips button.on,.cats button.on{background:var(--fg)!important;color:var(--bg)!important}
.seg{background:var(--s3);border:0}.seg button.on{background:var(--s1);color:var(--fg);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.ib{background:var(--s1);border:0;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.pill.g{background:rgba(255,45,61,.1)}

/* v21: مقاسات مضبوطة */
main{padding-top:20px}
.hhead{width:100%}.hhead>div:first-child{flex:1;min-width:0}.hhead h1{font-size:26px;line-height:1.25;overflow-wrap:break-word}.hhead p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hhead>.row{flex:none;padding-top:2px}
/* الشريط تحت: ثابت بالأسفل مثل الآيفون، ما يبين شي من تحته */
nav{padding:0!important;background:var(--s1)!important;border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
nav .in{max-width:520px;border-radius:0!important;box-shadow:none!important;background:none!important;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))!important}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 0;font-size:11px;line-height:1.2;min-height:48px}
nav a>span{width:28px;height:26px;display:grid;place-items:center;flex:none}nav a svg{width:24px!important;height:24px!important}
:root:not([data-theme=light]) nav{background:rgba(22,22,24,.96)!important}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
</style>
