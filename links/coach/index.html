/* هوية مدرّبي: أسود مخضّر، أخضر نيون للفعل، خط عريض للعناوين، صور المجسّم بالبطاقات */
:root{
  --bg:#070b09;--s1:#0f1712;--s2:#16211a;--s3:#1f2c23;--line:#22302a;
  --fg:#f2f6f2;--mut:#8b9b92;--g:#62e87a;--g2:#2f8a46;--ink:#051109;
  --gold:#f5bd45;--bronze:#c9803a;--red:#ff4d5e;--blue:#6fc3ff;--violet:#b99bff;
  --fd:'Changa','Readex Pro',system-ui,sans-serif;--fb:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--fb);font-size:15.5px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
button,input,textarea{font-family:var(--fb);font-size:16px;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
h1,h2,h3,p{margin:0}
.d{font-family:var(--fd);letter-spacing:.005em}
h1{font-family:var(--fd);font-size:30px;font-weight:800;line-height:1.1}
h2{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1.15}
h3{font-family:var(--fd);font-size:17.5px;font-weight:700;line-height:1.2}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:999px;background:var(--g);color:var(--ink);font-family:var(--fd);font-weight:700;font-size:18px;padding:12px 24px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--s3);color:var(--fg)}.btn.sm{min-height:40px;font-size:15px;padding:6px 16px}.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;flex:none;color:var(--fg)}
.ib svg{width:21px;height:21px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;background:var(--s3);white-space:nowrap}
.pill.g{background:rgba(98,232,122,.14);color:var(--g)}
.bar{height:9px;background:var(--s3);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.sec-h h2{font-size:20px}
/* الرئيسية */
.top{display:flex;align-items:center;gap:12px}
.ava{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;color:var(--ink);font-family:var(--fd);font-weight:800;font-size:22px;flex:none}
.streak{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:8px 14px;font-family:var(--fd);font-weight:700}
.streak svg{width:18px;height:18px;color:var(--gold)}
.hero{position:relative;background:var(--g);color:var(--ink);border-radius:30px;padding:20px;min-height:220px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.hero .wm{position:absolute;top:6px;left:-6px;font-family:var(--fd);font-weight:800;font-size:64px;line-height:.9;color:rgba(5,17,9,.12);white-space:nowrap;pointer-events:none}
.hero img{position:absolute;left:-10px;bottom:0;height:112%;width:auto;max-width:none;object-fit:cover;-webkit-mask-image:linear-gradient(to left,transparent 0,#000 30%);mask-image:linear-gradient(to left,transparent 0,#000 30%);border-radius:0 0 0 30px}
.hero .txt{position:relative;z-index:1;max-width:58%;display:flex;flex-direction:column;gap:6px}
.hero .lab{font-size:13px;font-weight:600;opacity:.75}
.hero h1{font-size:34px}
.hero .go{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:var(--ink);color:var(--g);display:grid;place-items:center;border:0;align-self:flex-start}
.hero .go svg{width:26px;height:26px}
.weekchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wc{border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:center;padding:8px 0;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mut)}
.wc b{font-family:var(--fd);font-size:18px;color:var(--fg)}
.wc.done{background:var(--s2)}.wc.done b{color:var(--g)}
.wc.today{border-color:var(--g)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile svg{width:22px;height:22px;color:var(--g)}
.tile b{font-family:var(--fd);font-size:24px;line-height:1.1}
.tile span{font-size:12px;color:var(--mut)}
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodymap svg{width:100%;height:auto}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:5px 12px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:50%}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:34px;border-radius:12px;background:var(--s3);min-height:8px}
.bars i.on{background:var(--g)}
.bars span{font-size:11px;color:var(--mut)}
.medals{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.medal{flex:none;width:112px;background:linear-gradient(160deg,#1c1a12,#0f0e0a);border:1px solid #3a3220;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px}
.medal .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe08a,#f5bd45 50%,#a8741c);box-shadow:0 6px 18px rgba(245,189,69,.25);color:#3d2a05}
.medal .c svg{width:26px;height:26px}
.medal.off{filter:grayscale(1);opacity:.45}
/* الكورس */
.month{position:relative;border-radius:30px;overflow:hidden;background:var(--s1);border:1px solid var(--line);min-height:190px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.month img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.month::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,11,9,.95),rgba(7,11,9,.15))}
.month>*:not(img){position:relative;z-index:1}
.wtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wtabs button{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:9px 16px;font-family:var(--fd);font-weight:600;font-size:15px;color:var(--mut)}
.wtabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dcard{position:relative;display:flex;gap:12px;align-items:center;border-radius:24px;background:var(--s1);border:1px solid var(--line);padding:10px;width:100%;text-align:right;overflow:hidden}
.dcard img{width:92px;height:92px;border-radius:18px;object-fit:cover;flex:none}
.dcard .n{font-family:var(--fd);font-size:13px;color:var(--mut)}
.dcard.now{border-color:var(--g);background:var(--s2)}
.dcard.done{opacity:.7}
.dcard .st{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--s3)}
.dcard.done .st{background:var(--g);color:var(--ink)}.dcard.now .st{background:var(--g);color:var(--ink)}
.dcard .st svg{width:17px;height:17px}
.dcard.rest img{filter:saturate(.4)}
/* الشاشات الكاملة */
.screen{position:fixed;inset:0;background:var(--bg);z-index:62;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen .in{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.exrow{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:8px;width:100%;text-align:right}
.exrow img{width:74px;height:74px;border-radius:16px;object-fit:cover;flex:none}
.exrow .k{width:30px;height:30px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-family:var(--fd);font-weight:700;flex:none}
/* مشغّل التمرين */
.player{position:fixed;inset:0;background:var(--bg);z-index:55;display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:none;height:min(56vh,520px);background:#050806}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .ov{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px}
.stage .ov .row{pointer-events:auto}
.stage .ttl{text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.stage .ttl h2{font-size:24px}.stage .ttl p{font-family:var(--fd);font-weight:600;color:#cfe9d5;font-size:15px}
.stage .ph{align-self:center;background:rgba(5,8,6,.78);border:1px solid rgba(98,232,122,.35);border-radius:999px;padding:7px 16px;font-family:var(--fd);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px)}
.stage .ph i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.stage .fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.ploop{flex:1;overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 54px;gap:8px;align-items:center}
.set .i{font-family:var(--fd);font-weight:700;text-align:center;color:var(--mut)}
.set .i.cur{color:var(--red)}
.pillin{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:999px;height:52px;padding:0 10px}
.pillin input{width:100%;min-width:0;background:transparent;border:0;text-align:center;font-family:var(--fd);font-weight:700;font-size:19px;color:var(--fg)}
.pillin span{font-size:13px;color:var(--mut)}
.set .ok{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;color:var(--mut)}
.set .ok svg{width:24px;height:24px}
.set.done .ok{background:var(--g);color:var(--ink);border-color:var(--g)}
.set.done .pillin{opacity:.6}
.pbar{flex:none;border-top:1px dashed var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;background:var(--bg)}
.ringp{position:relative;width:52px;height:52px;flex:none}
.ringp svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringp b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:14px}
.dots{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:45%}
.dots button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--mut);font-family:var(--fd);font-weight:700;flex:none}
.dots button.on{background:var(--s3);color:var(--fg)}.dots button.ok{color:var(--g)}
.rest-ov{position:fixed;inset:0;background:rgba(7,11,9,.97);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.ring{width:230px;height:230px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:68px;font-weight:700}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps p{display:flex;gap:10px;align-items:flex-start}
.steps p::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--g);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;margin-top:1px}
.bad p{display:flex;gap:10px}.bad p::before{content:"✕";width:26px;height:26px;border-radius:50%;background:rgba(255,77,94,.15);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.good p{display:flex;gap:10px}.good p::before{content:"✓";width:26px;height:26px;border-radius:50%;background:rgba(98,232,122,.15);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.video{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/9;background:#000;border:0;padding:0;width:100%}
.video img{width:100%;height:100%;object-fit:cover;opacity:.7}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play span{width:64px;height:64px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:var(--ink)}
.video .play svg{width:28px;height:28px;margin-right:-4px}
.video .cap{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:13px;text-align:right}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.anim{position:relative;border-radius:26px;overflow:hidden;height:380px;background:#050806}
.anim canvas{position:absolute;inset:0;width:100%;height:100%}
.anim .ph{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(5,8,6,.78);border:1px solid rgba(98,232,122,.35);border-radius:999px;padding:6px 14px;font-family:var(--fd);font-weight:700;display:flex;gap:8px;align-items:center}
.anim .ph i{width:9px;height:9px;border-radius:50%;background:var(--red)}
/* الأكل */
.seg{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:999px;padding:9px 4px;font-family:var(--fd);font-weight:600;font-size:15px}
.seg button.on{background:var(--g);color:var(--ink)}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h .ic{width:42px;height:42px;border-radius:14px;background:var(--s2);display:grid;place-items:center;color:var(--g);flex:none}
.meal-h .ic svg{width:22px;height:22px}
.opts{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -16px;padding-inline:16px;scroll-snap-type:x mandatory}
.opts::-webkit-scrollbar{display:none}
.opt{flex:none;width:168px;scroll-snap-align:start;background:var(--s1);border:2px solid var(--line);border-radius:22px;padding:8px;text-align:right;display:flex;flex-direction:column;gap:6px}
.opt.on{border-color:var(--g)}
.plate{background:radial-gradient(circle at 50% 45%,#fbfaf6 0 52%,#e9e5dc 53% 64%,#f6f3ec 65%);border-radius:16px;height:96px;display:flex;align-items:center;justify-content:center;gap:2px;padding:6px;position:relative}
.plate img{width:31%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.plate .chk{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--g);color:var(--ink);display:grid;place-items:center}
.plate .chk svg{width:14px;height:14px}
.opt b{font-family:var(--fd);font-size:15px;line-height:1.2}
.opt .k{font-size:12px;color:var(--mut)}
.detail{background:var(--s2);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.items p{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.items p:last-child{border:0}
.fi{font-size:11.5px;color:var(--blue);direction:ltr;unicode-bidi:isolate;display:block}
.macro{display:flex;gap:6px;flex-wrap:wrap}
/* المكملات */
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tl:not(:last-child)::after{content:"";position:absolute;right:20px;top:42px;bottom:0;width:2px;background:var(--line)}
.tl .ic{width:42px;height:42px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--g);flex:none}
.tl .ic svg{width:20px;height:20px}
.prod{background:#fff;border-radius:20px;display:grid;place-items:center;padding:10px;height:180px}
.prod img{max-height:160px;width:auto;object-fit:contain}
.kv{display:grid;grid-template-columns:1fr;gap:8px}
.kv div{background:var(--s2);border-radius:16px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--mut)}
.kv b{font-size:15px;font-weight:600}
.took{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:16px}
.took.on{background:var(--g);color:var(--ink);border-color:var(--g)}
.took svg{width:18px;height:18px}
.warn{background:rgba(245,189,69,.08);border:1px solid rgba(245,189,69,.35);border-radius:20px;padding:12px 14px;font-size:14px}
/* القائمة السفلية */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 40%)}
nav .in{max-width:520px;margin:0 auto;background:rgba(15,23,18,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:32px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:26px;color:var(--mut);text-decoration:none;font-size:11.5px}
nav a svg{width:23px;height:23px}
nav a.on{background:var(--g);color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:90;max-width:90%;text-align:center}
.field{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:16px;color:var(--fg);padding:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:8px 14px;font-size:14px}
.chips button.on{background:var(--g);color:var(--ink);border-color:var(--g);font-weight:600}
textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;color:var(--fg);padding:10px;font-size:12px;min-height:80px;direction:ltr}
.chart svg{width:100%;height:auto;display:block}
.install{background:var(--s2);border:1px dashed var(--g);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pth{display:inline-grid;place-items:center;background:#fff;border-radius:14px;overflow:hidden;flex:none;padding:3px}

.mtl{display:flex;flex-direction:column;gap:10px}

.fring b{position:absolute;top:22px;left:0;right:0;font-family:var(--fd);font-size:19px}
.fring > span{font-size:13px;font-weight:600;margin-top:2px}
.fring small{font-size:11px;color:var(--mut)}
.fring:last-child b{position:static}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:right}
.pcard b{font-family:var(--fd);font-size:15px;line-height:1.2}
.pimg{position:relative;background:#fff;border-radius:16px;height:120px;display:grid;place-items:center;padding:8px}

.badges{display:flex;flex-wrap:wrap;gap:4px}

.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acard{display:flex;flex-direction:column;gap:4px}

.verd .ok{background:rgba(98,232,122,.12);color:var(--g)}.verd .no{background:rgba(255,77,94,.12);color:var(--red)}.verd .mid{background:rgba(245,189,69,.12);color:var(--gold)}
button.prow{width:100%;text-align:right;color:var(--fg)}
.pro-head{display:flex;align-items:center;gap:14px}
.ava.big{width:68px;height:68px;font-size:30px}
.goal{flex-direction:row;align-items:center;gap:16px}
.gring{position:relative;width:150px;height:150px;flex:none}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gring b{font-family:var(--fd);font-size:36px;line-height:1}
.gring span{font-size:12px;color:var(--mut)}
.wstep{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.wstep .ib{width:56px;height:56px;font-size:28px;font-weight:600}
.wstep input{text-align:center;font-family:var(--fd);font-size:28px;font-weight:700;height:60px}
.mpath,.road{display:flex;flex-direction:column}
.mstep,.rstep{display:flex;gap:12px;align-items:center;position:relative;padding-bottom:14px}
.mstep:not(:last-child)::after,.rstep:not(:last-child)::after{content:"";position:absolute;right:17px;top:38px;bottom:2px;width:2px;background:var(--line)}
.mstep.on:not(:last-child)::after,.rstep.done::after{background:var(--g)}
.mstep .dot,.rstep .dot{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-family:var(--fd);font-weight:700;flex:none;font-size:14px}
.mstep .dot svg,.rstep .dot svg{width:18px;height:18px}
.mstep.on .dot,.rstep.done .dot{background:var(--g);color:var(--ink)}
.mstep.next .dot,.rstep.now .dot{border:2px solid var(--g);color:var(--g);background:transparent}
.mstep>div,.rstep>div{display:flex;flex-direction:column}
.rstep b{font-family:var(--fd);font-size:16px}.rstep.lock{opacity:.6}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid input{text-align:center;font-family:var(--fd);font-size:18px}
details summary{cursor:pointer;font-weight:600}
