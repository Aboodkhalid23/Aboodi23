<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدرّبي</title>
<meta name="theme-color" content="#0c0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدرّبي">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* هوية مدرّبي: خلفية فحمية، لون ليموني واحد للفعل، بطاقات كبيرة وواضحة، شي واحد بكل شاشة */
:root{
  --bg:#0c0e10;--s1:#15181c;--s2:#1c2025;--s3:#262b31;--line:#2b3037;
  --fg:#f1f3ee;--mut:#8f969e;--lime:#c8f43c;--ink:#10140a;
  --blue:#6fc3ff;--orange:#ffb44d;--red:#ff6b5c;--violet:#b99bff;
  --font:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input{font-family:var(--font);font-size:16px}
button{cursor:pointer;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:27px;font-weight:700;line-height:1.25;text-wrap:balance}
h2{font-size:20px;font-weight:600;line-height:1.3}
h3{font-size:16.5px;font-weight:600;line-height:1.35}
.mut{color:var(--mut)} .sm{font-size:14px} .xs{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:600;padding:14px 22px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.btn.ghost{background:var(--s3);color:var(--fg)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14.5px}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--s3);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;background:var(--s3);white-space:nowrap}
.pill.lime{background:rgba(200,244,60,.14);color:var(--lime)}
.bar{height:10px;background:var(--s3);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
/* الكورس */
.hero{background:var(--lime);color:var(--ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .mut{color:#45541a}
.hero .btn{background:var(--ink);color:var(--lime)}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:flex;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:12px 14px;width:100%;text-align:right}
.day .n{width:52px;height:52px;border-radius:16px;background:var(--s3);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.day .n b{font-size:19px}.day .n span{font-size:10.5px;color:var(--mut)}
.day.rest .n{background:transparent;border:1.5px dashed var(--line)}
.day.done .n{background:rgba(200,244,60,.16);color:var(--lime)}
.day.done .n span{color:var(--lime)}
.day.now{border-color:var(--lime);background:var(--s2)}
.day.now .n{background:var(--lime);color:var(--ink)}.day.now .n span{color:var(--ink)}
.day .thumbs{display:flex;gap:4px;margin-top:6px}
.day .thumbs img{width:34px;height:34px;border-radius:9px;object-fit:cover}
.week-h{display:flex;align-items:center;gap:10px;margin-top:8px}
.week-h::after{content:"";flex:1;height:1px;background:var(--line)}
/* شاشة كاملة */
.screen{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen .in{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:10px}
.exrow{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:10px;width:100%;text-align:right}
.exrow img{width:76px;height:76px;border-radius:16px;object-fit:cover;flex:none;background:#fff}
.exrow .k{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.exrow.ok .k{background:var(--lime);color:var(--ink)}
/* عرض الحركة */
.demo{position:relative;border-radius:26px;overflow:hidden;background:#fff;aspect-ratio:4/3}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.b{animation:swap 2.6s ease-in-out infinite}
.demo.slow img.b{animation-duration:5s}
@keyframes swap{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
.demo .lab{position:absolute;bottom:12px;right:12px;background:rgba(12,14,16,.85);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.demo .lab::before{content:"البداية";animation:lab 2.6s infinite}
.demo.slow .lab::before{animation-duration:5s}
@keyframes lab{0%,37%{content:"البداية"}38%,87%{content:"النهاية"}88%,100%{content:"البداية"}}
.demo .tag{position:absolute;top:12px;right:12px;background:var(--lime);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.video{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/9;background:#000;border:0;padding:0;width:100%}
.video img{width:100%;height:100%;object-fit:cover;opacity:.75}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play span{width:68px;height:68px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.video .play svg{width:30px;height:30px;margin-right:-4px}
.video .cap{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:13.5px;text-align:right}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts div{background:var(--s2);border-radius:18px;padding:12px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.facts b{font-size:18px}.facts span{font-size:11.5px;color:var(--mut)}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps p{display:flex;gap:10px;align-items:flex-start}
.steps p::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;margin-top:1px}
.bad p{display:flex;gap:10px}.bad p::before{content:"✕";width:26px;height:26px;border-radius:50%;background:rgba(255,107,92,.15);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
/* جلسة */
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:40px 1fr 1fr 56px;gap:8px;align-items:center}
.set .i{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700}
.set input{width:100%;min-width:0;background:var(--s2);border:1px solid var(--line);border-radius:14px;color:var(--fg);padding:10px 4px;text-align:center}
.set .ok{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;color:var(--mut)}
.set .ok svg{width:22px;height:22px}
.set.done .i,.set.done .ok{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.rest-ov{position:fixed;inset:0;background:rgba(12,14,16,.97);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.ring{width:230px;height:230px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:600}
/* الأكل */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.tile svg{width:26px;height:26px}
.tile b{font-size:22px;line-height:1.2}
.tile span{font-size:12px}
.meal-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.meal-tabs::-webkit-scrollbar{display:none}
.meal-tabs button{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:9px 16px;white-space:nowrap;font-size:15px}
.meal-tabs button.on{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:600}
.opt{background:var(--s1);border:2px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:right}
.opt.on{border-color:var(--lime);background:rgba(200,244,60,.06)}
.plate{display:flex;gap:6px;justify-content:center;background:radial-gradient(circle,#f4f1ea 0%,#e4ded2 68%,#cfc8ba 70%,transparent 71%);aspect-ratio:2.1/1;align-items:center;border-radius:20px;background:#f5f2ec;padding:8px}
.plate img{width:30%;max-width:92px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.items{display:flex;flex-direction:column;gap:4px}
.items p{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.items p span:last-child{color:var(--mut);white-space:nowrap}
.pick{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--mut)}
.opt.on .pick{color:var(--lime)}
.pick i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt.on .pick i{border-color:var(--lime);background:var(--lime)}
.opt.on .pick i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.sweets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sweet{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:center}
.sweet .ph{background:#f5f2ec;border-radius:16px;display:flex;justify-content:center;gap:2px;padding:6px;height:86px;align-items:center}
.sweet .ph img{height:70px;width:auto;object-fit:contain}
/* المكملات */
.supp{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--s1)}
.supp .head{display:flex;gap:12px;align-items:center}
.supp .ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;flex:none}
.supp .ic svg{width:28px;height:28px}
.supp .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.supp .kv div{background:var(--s2);border-radius:14px;padding:8px 10px}
.supp .kv span{display:block;font-size:11.5px;color:var(--mut)}
.supp .kv b{font-size:14.5px;font-weight:600}
.took{border:1px solid var(--line);background:var(--s2);border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.took.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.took svg{width:18px;height:18px}
/* القائمة السفلية */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%)}
nav .in{max-width:520px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:24px;color:var(--mut);text-decoration:none;font-size:12px}
nav a svg{width:24px;height:24px}
nav a.on{background:var(--lime);color:var(--ink);font-weight:600}
.install{background:var(--s2);border:1px dashed var(--lime);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:90;max-width:90%;text-align:center}
input.field{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;color:var(--fg);padding:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--mut)}
.chart svg{width:100%;height:auto;display:block}
textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;color:var(--fg);padding:10px;font-size:12px;min-height:80px;direction:ltr}
.clip{position:relative;border-radius:26px;overflow:hidden;background:#000;aspect-ratio:9/12;max-height:62vh;width:100%}
.clip iframe{position:absolute;inset:-12% 0;width:100%;height:124%;border:0;pointer-events:none}
.clip .tag{position:absolute;top:12px;right:12px;background:var(--lime);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;z-index:2}
.clip .sound{position:absolute;bottom:12px;left:12px;z-index:2;background:rgba(12,14,16,.85);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:13px}
.seg{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:999px;padding:9px 6px;font-size:14px}
.seg button.on{background:var(--lime);color:var(--ink);font-weight:600}
.prod{background:#fff;border-radius:18px;display:grid;place-items:center;padding:10px;height:170px}
.prod img{max-height:150px;width:auto;object-fit:contain}
.buy{display:flex;flex-wrap:wrap;gap:6px}
.fi{font-size:12px;color:var(--blue);direction:ltr;unicode-bidi:isolate}
.warn{background:rgba(255,180,77,.08);border:1px solid rgba(255,180,77,.35);border-radius:18px;padding:12px;font-size:14px}
.src a{color:var(--blue)}
.macro{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.demo img.b{animation-duration:6s}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="القائمة"><div class="in">
  <a href="#course" data-t="course"><span data-i="dumb"></span>الكورس</a>
  <a href="#food" data-t="food"><span data-i="food"></span>الأكل</a>
  <a href="#supps" data-t="supps"><span data-i="pill"></span>المكملات</a>
  <a href="#me" data-t="me"><span data-i="user"></span>أنا</a>
</div></nav>
<div id="screen" class="screen" hidden></div>
<script>
/* ===== أيقونات ===== */
const I={
dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.5 1-4 3.5-4 7v3h4"/></svg>',
pill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="m9.5 9.3 5 5"/></svg>',
user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></svg>',
fire:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 1.5-4s.5 2 2 2.5C10 7 12 2 12 2z"/></svg>',
drop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 9.5 12 2.5 12 2.5z"/></svg>',
egg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c3.5 0 7 6 7 11a7 7 0 0 1-14 0c0-5 3.5-11 7-11z"/></svg>',
stop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></svg>',
share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v8h14v-8"/></svg>',
};
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=I[e.dataset.i]);

/* ===== أدوات ===== */
const $=s=>document.querySelector(s);
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let tT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.append(t)}t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2500)}

/* ===== الحفظ ===== */
const KEY='coach-v3';
const def=()=>({age:'',h:168,w:52,done:{},log:{},meals:{},supp:{},weights:[],start:today()});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ===== التمارين =====
   demo = مقطع قصير لمدرّب يسوي الحركة (يشتغل لحاله ويعيد)
   yt   = شرح كامل بالعربي
   img  = صور ثابتة للحركة (البداية والنهاية) */
const EX={

const WORK={
A:{n:'صدر + أمامية',d:'الصدر والبايسبس والبطن',ex:['chestpress','incline','pecdeck','curl','hammer','plank']},
B:{n:'ظهر + خلفية',d:'الظهر والترايسبس',ex:['latpull','row','dbrow','backext','pushdown','ohtri']},
C:{n:'أكتاف + رجل',d:'الكتف والفخذ والسمانة',ex:['legpress','legext','legcurl','shpress','lateral','reardelt','calf']},
R:{n:'استراحة',d:'مشي 30 دقيقة + تمارين الوگفة 10 دقايق',ex:['hipflex','cat','chest','hang','child']},
};
const WEEKS=12,CYCLE=['A','B','C','R'],TOTAL=WEEKS*7;
const dayType=i=>CYCLE[i%4];
const weekOf=i=>Math.floor(i/7)+1;
const deload=i=>weekOf(i)===6||weekOf(i)===12;
function setsFor(i,id){const w=weekOf(i);if(dayType(i)==='R')return 1;if(w<=2||deload(i))return 2;if(w>=9&&['lateral','curl','hammer','incline','pushdown','ohtri'].includes(id))return 4;return 3}
function curDay(){for(let i=0;i<TOTAL;i++)if(!S.done[i])return i;return TOTAL-1}
const img=(id,k)=>`img/ex/${EX[id].img}_${k}.jpg`;

/* ===== الكورس ===== */
function vCourse(){
  const c=curDay(),t=dayType(c),W=WORK[t],doneN=Object.keys(S.done).length;
  let list='';
  for(let i=0;i<TOTAL;i++){
    if(i%7===0){const wk=weekOf(i);list+=`<div class="week-h"><h3>الأسبوع ${AR(wk)}</h3><span class="xs mut">${wk===6||wk===12?'أسبوع خفيف (الجسم يرتاح ويكبر)':wk<=2?'تعلّم الحركات':wk<=8?'البناء':'التشكيل'}</span></div>`}
    const ty=dayType(i),w=WORK[ty],cls=['day',ty==='R'?'rest':'',S.done[i]?'done':'',i===c?'now':''].join(' ');
    list+=`<button class="${cls}" data-day="${i}"><div class="n"><span>اليوم</span><b class="num">${AR(i+1)}</b></div><div class="grow"><div class="row between"><h3>${w.n}</h3>${S.done[i]?'<span class="pill lime">✓ خلص</span>':i===c?'<span class="pill lime">اليوم</span>':''}</div><p class="xs mut">${w.d}</p>${ty!=='R'&&i>=c&&i<c+4?`<div class="thumbs">${w.ex.map(id=>`<img src="${img(id,0)}" alt="" loading="lazy">`).join('')}</div>`:''}</div></button>`;
  }
  return`<div class="row between"><div><p class="sm mut">هلا بطل 👋</p><h1>الكورس</h1></div><span class="pill"><span style="color:var(--lime);width:16px;display:inline-flex">${I.fire}</span><span class="num">${AR(doneN)} / ${AR(TOTAL)}</span></span></div>
  ${installCard()}
  <div class="hero"><span class="xs" style="font-weight:600">اليوم ${AR(c+1)} • الأسبوع ${AR(weekOf(c))}${deload(c)?' • أسبوع خفيف':''}</span><h2>${t==='R'?'اليوم استراحة 😴':W.n}</h2><p class="sm mut">${t==='R'?'العضلة تكبر وانت مرتاح. امشي 30 دقيقة وسوّي تمارين الوگفة.':W.d+' • '+AR(W.ex.length)+' تمارين • تقريباً 50 دقيقة'}</p><button class="btn" data-day="${c}">${I.play} ${t==='R'?'شوف تمارين الوگفة':'ابدأ تمرين اليوم'}</button></div>
  <div class="card"><div class="row between"><b>طريقة الكورس</b><span class="sm mut num">${AR(Math.round(doneN/TOTAL*100))}٪</span></div><div class="bar"><i style="width:${doneN/TOTAL*100}%"></i></div>
  <div class="steps sm"><p><b>اليوم ١:</b> صدر + أمامية (بايسبس)</p><p><b>اليوم ٢:</b> ظهر + خلفية (ترايسبس)</p><p><b>اليوم ٣:</b> أكتاف + رجل</p><p><b>اليوم ٤:</b> استراحة، وبعدها ترجع لليوم ١</p></div>
  <p class="xs mut">كل عضلة تتمرن مرة كل 4 أيام، وتاخذ 3 أيام حتى ترتاح وتكبر. إذا حسيت جسمك تعبان كلش، خذ يوم راحة زيادة، ما يضر.</p></div>
  <div class="days">${list}</div>`;
}
function installCard(){
  const sa=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(sa||S.hideInstall)return'';
  return`<div class="install"><b>خلّيه تطبيق على شاشة الآيفون</b><p class="sm">١. افتح الرابط بـ<b>سفاري</b>.<br>٢. اضغط زر المشاركة <span style="display:inline-flex;width:18px;vertical-align:-3px;color:var(--lime)">${I.share}</span>.<br>٣. اختار <b>"إضافة إلى الشاشة الرئيسية"</b>.</p><button class="btn ghost sm" data-hideinstall>سوّيتها، خفي هذا</button></div>`;
}

/* ===== شاشة اليوم ===== */
let SES=null;
function openDay(i){
  const t=dayType(i),W=WORK[t];
  SES={i,ex:W.ex,k:0,sets:{}};
  W.ex.forEach(id=>{const last=S.log[id];SES.sets[id]=Array.from({length:setsFor(i,id)},()=>({w:last&&last.w?(last.up&&!deload(i)?last.w+(id==='lateral'||id==='curl'||id==='hammer'||id==='ohtri'?1:2.5):last.w):'',r:EX[id].r[1],ok:false}))});
  show(`<div class="topbar"><button class="icon-btn" data-close aria-label="رجوع">${I.back}</button><div class="grow"><p class="xs mut">اليوم ${AR(i+1)} • الأسبوع ${AR(weekOf(i))}</p><h2>${W.n}</h2></div></div>
  ${t==='R'?`<div class="card"><p class="sm"><b>اليوم:</b> امشي 30 دقيقة، وسوّي هاي التمارين 10 دقايق قبل النوم. تعدّل وگفتك وتفك ضغط ظهرك.</p></div>`:`<div class="card"><p class="sm"><b>قبل ما تبدي (إحماء):</b> 5 دقايق مشي سريع أو دراجة، وبعدها أول تمرين سوّي سِت خفيف بنص الوزن.</p><p class="xs mut">${weekOf(i)<=2?'أول أسبوعين: سِتين بس ووزن خفيف. ركّز على الحركة الصحيحة.':deload(i)?'هذا أسبوع خفيف: سِتين بس ونفس الوزن. هذا جزء من الخطة حتى مفاصلك ترتاح.':'إذا التطبيق كاتبلك وزن أعلى من المرة الفاتتة، معناها خلّصت كل العدّات وتستاهل تزيد.'}</p></div>`}
  <div class="col">${W.ex.map((id,k)=>exRow(id,k,i)).join('')}</div>
  <button class="btn wide" data-start>${I.play} ${t==='R'?'يلا نبدي':'ابدأ التمرين خطوة بخطوة'}</button>

  <div class="warn">الجبن: بعض الأجبان مصنوعة بإنفحة حيوانية (<span class="fi">eläinperäinen juoksete</span>). أغلب الجبن الفنلندي العادي يستعمل إنفحة نباتية أو ميكروبية، بس إذا تريد تتأكد، اقرا الغلاف.</div>`;
  return`<h1>أكلك اليوم</h1>
  <div class="tiles"><div class="tile" style="background:rgba(200,244,60,.12);color:var(--lime)">${I.fire}<b class="num">${AR(T.k)}</b><span>سعرة باليوم</span></div><div class="tile" style="background:rgba(255,180,77,.12);color:var(--orange)">${I.egg}<b class="num">${AR(T.p)}</b><span>غرام بروتين</span></div><div class="tile" style="background:rgba(111,195,255,.12);color:var(--blue)">${I.drop}<b class="num">${AR(T.water)}</b><span>لتر مي</span></div></div>
  ${seg}${body}`;
}

];

   ${minor&&s.adult?'':`<button class="took ${d[s.id]?'on':''}" data-took="${s.id}">${d[s.id]?I.check+' أخذته اليوم':'اضغط لما تاخذه اليوم'}</button>`}</div>`).join('')}
  <div class="supp" style="border-color:rgba(255,107,92,.45)"><div class="head"><span class="ic" style="background:rgba(255,107,92,.13);color:var(--red)">${I.stop}</span><h3>ابتعد عنها نهائياً</h3></div><div class="bad sm col"><p>الإبر والهرمونات والمنشطات</p><p>حبوب فتح الشهية والتسمين</p><p>حوارق الدهون (انت تريد تزيد وزن)</p><p>حبوب "زيادة الطول" (ما تشتغل)</p><p>كبسولات جيلاتين (liivate) إذا ما مكتوب عليها حلال أو سمك</p></div></div>

/* ===== أنا ===== */
function vMe(){
  const W=S.weights.length?S.weights:[{d:S.start,w:+S.w||52}],last=W[W.length-1].w,diff=+(last-W[0].w).toFixed(1);
  return`<h1>أنا</h1>
  <div class="card"><div class="row between"><h3>وزني</h3><span class="pill lime">الهدف 62 كغم</span></div>
   <div class="tiles"><div class="tile" style="background:var(--s2)"><span>هسه</span><b class="num">${AR(last)}</b><span>كغم</span></div><div class="tile" style="background:var(--s2)"><span>زاد</span><b class="num" dir="ltr">${diff>0?'+':''}${AR(diff)}</b><span>كغم</span></div><div class="tile" style="background:var(--s2)"><span>باقي</span><b class="num">${AR(Math.max(0,+(62-last).toFixed(1)))}</b><span>كغم</span></div></div>
   <div class="chart">${chart(W)}</div>
   <div class="row"><input class="field" id="wIn" inputmode="decimal" placeholder="وزنك اليوم بالكيلو" aria-label="وزنك اليوم"><button class="btn sm" data-addw>سجّل</button></div>
   <p class="xs mut">وزّن نفسك مرة بالأسبوع، الصبح قبل الأكل. الأحسن تزيد ربع لنص كيلو بالأسبوع. إذا ما زاد أسبوعين، زيد سناك ثاني.</p></div>
  <div class="card"><h3>معلوماتي</h3><div class="row"><label class="f grow">عمري<input class="field" id="pA" inputmode="numeric" value="${S.age}" placeholder="مثلاً 22"></label><label class="f grow">طولي<input class="field" id="pH" inputmode="numeric" value="${S.h}"></label></div><button class="btn ghost" data-saveme>احفظ</button></div>
  <div class="card"><h3>قواعد صحتك (من المدرّب)</h3><div class="steps sm"><p>الوجع الخفيف بالعضلة بعد يوم أو يومين طبيعي. الوجع الحاد بالمفصل مو طبيعي: وگّف التمرين.</p><p>إذا حسيت دوخة أو وجع بالصدر أو ضيق نفس، وگّف فوراً وروح للطبيب.</p><p>نام 7-9 ساعات. العضلة تكبر وانت نايم، وهرمون النمو يطلع بالنوم.</p><p>الأسبوع 6 و12 خفاف بالقصد، حتى مفاصلك ترتاح.</p><p>إذا عندك أي مرض، اسأل طبيب قبل ما تبدي.</p></div></div>
  <div class="card"><h3>الطول والوگفة</h3><p class="sm">بعد عمر 18-21 العظم ما يطول، بس الوگفة العدلة ترجّعلك 2-3 سانتي، وتمارينها بكل يوم راحة.</p><div class="steps sm"><p>الكتف العريض والخصر النحيف يخلونك تبين أطول (الرفرفة الجانبية أهم تمرين).</p><p>تيشيرت ضيّق على الكتف والزند، وبنطرون ضيّق شوية ومقصّر.</p><p>بنطرون وتيشيرت بنفس اللون يطوّلك.</p></div></div>
  <div class="card src"><h3>منين أخذت المعلومات</h3><p class="xs mut">مراجع علمية معروفة بنيت عليها الخطة (مو كل رقم انفحص اليوم سطر بسطر):</p><div class="steps xs"><p>الجمعية الدولية للتغذية الرياضية (ISSN): البروتين 1.6-2.2 غم لكل كيلو، والكرياتين 3-5 غم باليوم.</p><p>أبحاث براد شونفيلد: 10 سِتات أو أكثر بالأسبوع لكل عضلة تكبّرها.</p><p>توصيات هيئة الغذاء الفنلندية (Ruokavirasto) ومعهد الصحة (THL) لفيتامين د، وجداول التغذية Fineli (القيم تقريبية).</p><p>معلومات زيت مولر مأخوذة من صفحة المنتج بمحل Kärkkäinen.</p><p>فيديوهات الحركة من مدربين عرب: د. ميثم الأستاذ، رشيد النجم، علي غازي، رعد دوجو.</p></div></div>
  <div class="card"><h3>نسخة احتياطية</h3><p class="xs mut">معلوماتك محفوظة بموبايلك بس. انسخ الكود واحفظه بالملاحظات.</p><textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea><button class="btn ghost sm" data-copy>انسخ الكود</button><textarea id="rs" placeholder="الصق الكود هنا حتى ترجّع معلوماتك"></textarea><button class="btn ghost sm" data-restore>رجّع معلوماتي</button></div>`;
}
function chart(W){
  const p=W.slice(-10),v=p.map(x=>x.w).concat([62]),lo=Math.floor(Math.min(...v)-1),hi=Math.ceil(Math.max(...v)+1),w=320,h=140,X=i=>34+(p.length<2?(w-44)/2:i*(w-44)/(p.length-1)),Y=x=>12+(hi-x)/(hi-lo)*(h-24);
  let g='';for(let x=lo;x<=hi;x+=Math.max(1,Math.round((hi-lo)/4)))g+=`<line x1="34" x2="${w-6}" y1="${Y(x)}" y2="${Y(x)}" stroke="#2b3037"/><text x="28" y="${Y(x)+4}" fill="#8f969e" font-size="10" text-anchor="end">${x}</text>`;
  const ln=p.map((x,i)=>`${X(i)},${Y(x.w)}`).join(' ');
  return`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="رسم وزنك">${g}<line x1="34" x2="${w-6}" y1="${Y(62)}" y2="${Y(62)}" stroke="#c8f43c" stroke-dasharray="4 4" opacity=".6"/><polyline points="${ln}" fill="none" stroke="#c8f43c" stroke-width="3" stroke-linejoin="round"/>${p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="4" fill="#c8f43c"/>`).join('')}</svg>`;
}

/* ===== التنقل ===== */
const V={course:vCourse,food:vFood,supps:vSupps,me:vMe};
function route(){let h=location.hash.slice(1);if(!V[h])h='course';$('#app').innerHTML=V[h]();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===h))}
let stack=[];
function show(html,push){const s=$('#screen');if(push)stack.push(s.innerHTML);else stack=[];s.hidden=false;s.innerHTML=`<div class="in">${html}</div>`;s.scrollTop=0;document.body.style.overflow='hidden'}
function closeScreen(){clearInterval(restT);SES=null;stack=[];const s=$('#screen');s.hidden=true;s.innerHTML='';document.body.style.overflow='';route()}
function back(){const s=$('#screen');if(stack.length){s.innerHTML=stack.pop();s.scrollTop=0}else closeScreen()}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
  if(d.day!=null){openDay(+d.day);return}
  if(d.ex){openEx(d.ex);return}
  if('close' in d){closeScreen();return}
  if('back' in d){back();return}
  if(d.sound){const c=$('#clip iframe');if(c){c.src=`https://www.youtube-nocookie.com/embed/${d.sound}?autoplay=1&loop=1&playlist=${d.sound}&playsinline=1&rel=0&modestbranding=1`;c.style.pointerEvents='auto';b.remove()}return}
  if(d.yt){b.outerHTML=`<div class="video"><iframe src="${ytsrc(d.yt)}" title="فيديو شرح" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><a class="xs mut" style="text-align:center" href="https://www.youtube.com/watch?v=${d.yt}" target="_blank" rel="noopener">ما اشتغل؟ افتحه بيوتيوب</a>`;return}
  if('start' in d){SES.k=0;renderStep();return}
  if('next' in d){SES.k++;renderStep();return}
  if('prev' in d){SES.k--;renderStep();return}
  if('finish' in d){if(SES)finishDay();return}
  if(d.ok!=null){const id=SES.ex[SES.k],s=SES.sets[id][+d.ok];s.ok=!s.ok;b.closest('.set').classList.toggle('done',s.ok);if(s.ok){const left=SES.sets[id].filter(x=>!x.ok).length;if(left&&EX[id].rest)rest(EX[id].rest);else if(!left)toast('خلصت هذا التمرين! روح للجاي')}return}
  if(d.mt){mealTab=d.mt;route();return}
  if(d.fv){foodView=d.fv;route();return}
  if(d.opt){const[k,j]=d.opt.split(':');const t=today();S.meals[t]=S.meals[t]||{};S.meals[t][k]=S.meals[t][k]===+j?null:+j;save();const y=scrollY;route();scrollTo(0,y);return}
  if(d.took){const t=today();S.supp[t]=S.supp[t]||{};S.supp[t][d.took]=!S.supp[t][d.took];save();const y=scrollY;route();scrollTo(0,y);return}
  if('hideinstall' in d){S.hideInstall=1;save();route();return}
  if('addw' in d){const v=+$('#wIn').value;if(!(v>25&&v<200)){toast('اكتب وزن صحيح');return}const t=today(),x=S.weights.find(z=>z.d===t);if(x)x.w=v;else S.weights.push({d:t,w:v});save();route();toast('انحفظ وزنك');return}
  if('saveme' in d){S.age=$('#pA').value;S.h=+$('#pH').value||168;save();toast('انحفظ');route();return}
  if('copy' in d){const t=$('#bk');try{navigator.clipboard.writeText(t.value).then(()=>toast('انسخ'),()=>{t.select();toast('محدد، انسخه')})}catch(er){t.select()}return}
  if('restore' in d){try{const o=JSON.parse($('#rs').value);if(!o||!o.done)throw 0;S=Object.assign(def(),o);save();route();toast('رجعت معلوماتك')}catch(er){toast('الكود مو صحيح')}return}
});
document.addEventListener('input',e=>{const t=e.target;if(!SES)return;const id=SES.ex[SES.k];if(t.dataset.w!=null)SES.sets[id][+t.dataset.w].w=t.value;if(t.dataset.r!=null)SES.sets[id][+t.dataset.r].r=t.value});
/* نقل التقدم من النسخة القديمة */
try{const old=JSON.parse(localStorage.getItem('coach-v2')||'null');if(old&&!localStorage.getItem(KEY)){S.age=old.age||'';S.h=old.h||168;S.weights=old.weights||[];S.hideInstall=old.hideInstall;save()}}catch(e){}
route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
