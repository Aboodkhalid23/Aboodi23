<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Noto</title>
<style>body{margin:0;background:#121316}</style>

<body>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-title" content="Noto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&family=Cairo:wght@600..900&family=Noto+Kufi+Arabic:wght@600..900&family=Almarai:wght@700;800&family=Noto+Naskh+Arabic:wght@600..700&display=swap">
<style>
/* Noto 2: ملقّن «جملة جملة». ثلاث شاشات (المكتبة، تعديل النص، القراءة) + لوحة وحدة تطلع من الجنب أو من جوه. */
:root{--bg:#121316;--s1:#1b1c20;--s2:#26272c;--s3:#33343a;--line:#2e2f35;--fg:#f3f1ec;--mut:#9c9da4;--red:#e5383b;--amber:#f5a524;
  --ui:"Vazirmatn",system-ui,-apple-system,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --tbg:#000;--tfg:#fff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.45}
[hidden]{display:none!important}
svg{flex:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(18px,var(--sar));padding-right:max(18px,var(--sal))}
.btn{height:50px;border-radius:14px;padding:0 18px;background:var(--s2);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--red);color:#fff}
.btn.w{width:100%}
.ib{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--s2);transition:transform .12s}
.ib:active{transform:scale(.94)}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 120px);transform:translate(-50%,20px);background:#f3f1ec;color:#111;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:300;max-width:88vw;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== القفل ===== */
#lock{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#lock .lt{font-size:1.05rem;color:var(--mut)}
.dots{display:flex;gap:14px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #555}
.dots i.on{background:#fff;border-color:#fff}
.dots.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,74px);gap:14px;direction:ltr;margin-top:6px}
.keys button{width:74px;height:74px;border-radius:50%;background:var(--s2);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--s3)}
.keys button.ghost{background:none;font-size:1rem}

/* ===== المكتبة ===== */
#lib{background:var(--bg)}
.libHead{padding-top:calc(var(--sat) + 14px);padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:24px;font-weight:900;letter-spacing:.01em;flex:1}
.libBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 24px)}
.libBody h1{font-size:30px;font-weight:900;margin:22px 0 4px}
.libBody .sub{color:var(--mut);margin:0 0 18px;font-size:15px;line-height:1.7}
.newRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.newRow .btn{height:64px;font-size:16px;border-radius:18px}
.newRow .btn.p{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:stretch;background:var(--s1);border-radius:18px;overflow:hidden}
.it .go{flex:1;min-width:0;text-align:start;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.it .t{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{color:var(--mut);font-size:14px}
.it .pr{height:4px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:2px}
.it .pr i{display:block;height:100%;background:var(--red);margin-inline-start:0}
.it .more{width:54px;display:grid;place-items:center;color:var(--mut)}
.empty{background:var(--s1);border-radius:18px;padding:22px;color:var(--mut);line-height:1.8;font-size:15px}

/* ===== التعديل ===== */
#edit{background:var(--bg)}
.edHead{padding-top:calc(var(--sat) + 10px);display:flex;align-items:center;gap:10px;padding-bottom:10px}
.edHead input{flex:1;min-width:0;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--s1);padding:0 14px;font-weight:800;font-size:17px}
.edBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(var(--sab) + 14px)}
.edBody textarea{flex:1;min-height:0;resize:none;border-radius:16px;border:1px solid var(--line);background:var(--s1);padding:14px 16px;font-size:18px;line-height:1.9;direction:rtl;font-family:var(--ui);font-weight:500}
.edInfo{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--s1);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--mut)}
.pill b{color:var(--fg)}
.pill.warn b{color:var(--amber)}

/* ===== القراءة ===== */
#read{background:var(--tbg);color:var(--tfg);transition:padding .25s}
#read .rTop{position:relative;z-index:2;padding:calc(var(--sat) + 8px) max(12px,var(--sar)) 6px max(12px,var(--sal));display:flex;align-items:center;gap:8px;font-family:var(--ui);transition:opacity .4s}
#read .rb{height:44px;min-width:44px;border-radius:13px;background:rgba(128,128,128,.2);display:grid;place-items:center;padding:0 10px;font-weight:700;font-size:15px}
#read .rb .lb{font-size:14px;font-weight:700}
#read .rb.l{display:flex;gap:6px;align-items:center}
@media (max-width:760px){#read .rb .lb{display:none}}
#read .rTitle{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.3}
#read .rTitle b{font-size:15px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
#read .rTitle span{font-size:13px;opacity:.6;font-variant-numeric:tabular-nums}
#tally{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(128,128,128,.18);z-index:3}
#tally i{display:block;height:100%;width:0;background:var(--red);margin-inline-start:0}
#tally.warn i{background:var(--amber)}
.rStage{flex:1;min-height:0;position:relative;padding:4px max(4%,var(--sal)) 4px max(4%,var(--sar))}
#sWrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
#sWrap.mir{transform:scaleX(-1)}
.sCue{font-family:var(--ui);font-size:15px;font-weight:700;color:var(--amber);min-height:0}
#sBox{flex:1 1 auto;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden;cursor:pointer}
#sBox>*{grid-area:1/1}
#read.top #sBox{place-items:start center;padding-top:2vh}
#sTxt{margin:0;text-align:center;text-wrap:balance;word-break:keep-all;overflow-wrap:normal;white-space:normal;transition:opacity .35s}
#sTxt .hw{text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:.06em;text-underline-offset:.2em}
#memoCue{opacity:0;transition:opacity .35s;pointer-events:none;text-align:center;font-family:inherit}
#read.memo #sTxt{opacity:0}
#read.memo #memoCue{opacity:.6}
#read.blank #sTxt,#read.blank #memoCue,#read.blank .sNext{opacity:0}
.sHint{font-family:var(--ui);font-size:16px;opacity:.75;text-align:center;line-height:1.6}
.sNext{opacity:.3;font-size:clamp(15px,2.4vh,24px);max-width:92%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
#cdown{position:absolute;inset:0;display:grid;place-items:center;font:900 min(38vh,220px)/1 var(--ui);color:var(--red);z-index:5;pointer-events:none}
.rDock{position:relative;z-index:2;padding:6px max(12px,var(--sar)) calc(var(--sab) + 12px) max(12px,var(--sal));display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--ui);transition:opacity .4s}
.dRow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dBtn{height:56px;min-width:56px;padding:0 16px;border-radius:17px;background:rgba(128,128,128,.22);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;transition:transform .12s}
.dBtn:active{transform:scale(.95)}
.dBtn.sm{height:40px;min-width:40px;border-radius:12px;font-size:15px;padding:0 12px}
.dPlay{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;padding:0}
.secCtl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;opacity:.85}
.secCtl button{width:40px;height:40px;border-radius:12px;background:rgba(128,128,128,.22);font-size:20px;font-weight:700}
.secCtl span{min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
#read.calm .rTop{opacity:0;pointer-events:none}
#read.calm .rDock{opacity:.22}
#read.bare .rDock,#read.bare .rTop{display:none}
@media (max-height:520px){.dBtn{height:46px;min-width:46px;border-radius:14px}.dPlay{width:58px;height:58px}.secCtl button{width:36px;height:36px}#read .rb{height:38px;min-width:38px}.dBtn .lb{display:none}}
@media (max-width:420px){.dBtn .lb{display:none}}

/* ===== اللوحة ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:min(80%,720px);background:var(--s1);color:var(--fg);border-radius:24px 24px 0 0;z-index:61;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);font-family:var(--ui);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#sheet.open{transform:none}
body.reading #sheet{max-height:58%}
@media (orientation:landscape) and (min-width:700px){
  #sheet{top:0;bottom:0;left:0;right:auto;width:min(420px,46%);max-height:none;border-radius:0 24px 24px 0;transform:translateX(-105%)}
  #sheet.open{transform:none}
  body.reading #sheet{max-height:none}}
.shH{display:flex;align-items:center;gap:10px;padding:calc(14px) 16px 8px}
@media (orientation:landscape) and (min-width:700px){.shH{padding-top:calc(var(--sat) + 14px)}}
.shH b{flex:1;font-size:19px;font-weight:900}
.shB{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px calc(var(--sab) + 20px);overscroll-behavior:contain}
.grp{margin:16px 0 0}
.grp>h3{font-size:14px;color:var(--mut);font-weight:700;margin:0 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:13px;background:var(--s2);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:#111}
.row{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0;line-height:1.5}
.row .tx b{display:block;font-size:16px}
.row .tx small{color:var(--mut);font-size:13px}
.sw{width:52px;height:32px;border-radius:999px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(-20px)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:13px;background:var(--s2);font-size:22px;font-weight:700}
.step span{min-width:70px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.swc{display:flex;flex-wrap:wrap;gap:10px}
.swt{width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--mut);text-align:center;line-height:1.3}
.swt i{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:24px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.swt.on i{border-color:var(--fg)}
.note{color:var(--mut);font-size:14px;line-height:1.8;margin:8px 0 0}
.card{background:var(--s2);border-radius:16px;padding:14px;margin-top:10px;line-height:1.8}
.card .big{font-size:20px;font-weight:800;line-height:1.7}
.opt{display:block;width:100%;text-align:start;background:var(--s2);border-radius:16px;padding:14px 16px;margin-top:8px;font-size:17px;font-weight:700;line-height:1.7}
.opt:active{background:var(--s3)}
.opt small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.field{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:10px 14px;font-size:16px}
textarea.field{min-height:96px;line-height:1.8;resize:vertical}
.colp{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:13px;padding:6px 12px 6px 6px;font-weight:700}
.colp input{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--fg);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.flPrev{width:100%;border-radius:12px;background:#000;aspect-ratio:960/400;margin-top:10px}
.res{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}

/* ===== صوّر وانت تقرا ===== */
#selfie{position:fixed;inset:0;z-index:200;background:#000;color:#fff;font-family:var(--ui)}
#selfie video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#selfie .sfTop{position:absolute;top:calc(var(--sat) + 6px);left:8px;right:8px;border-radius:18px;padding:10px 14px 12px;text-align:center;direction:rtl}
#sfTxt{line-height:1.4;cursor:pointer;text-wrap:balance}
#selfie .sfBar{height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}
#selfie .sfBar i{display:block;height:100%;width:0;background:var(--red)}
#sfMsg{position:absolute;left:16px;right:16px;top:45%;text-align:center;font-size:20px;font-weight:800;text-shadow:0 2px 8px #000;line-height:1.6}
#sfMsg:empty{display:none}
#selfie .sfBot{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 12px);display:flex;flex-direction:column;align-items:center;gap:10px}
#selfie .sfRow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#selfie button{height:46px;min-width:50px;border-radius:14px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:16px;padding:0 12px}
#selfie .sfRec{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.25);border:4px solid #fff;display:grid;place-items:center;padding:0}
#selfie .sfRec i{width:56px;height:56px;border-radius:50%;background:var(--red);transition:all .2s}
#selfie .sfRec.on i{width:28px;height:28px;border-radius:7px}
#selfie .sfSave{background:var(--red)}
#sfClock{min-width:60px;font-weight:800;text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d52"/><stop offset="1" stop-color="#b3171b"/></linearGradient></defs>
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="url(#gA)"/><rect x="10" y="29" width="44" height="6" rx="3" fill="#fff" opacity=".28"/><path d="M20 46V18l24 28V18" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="lock" hidden>
  <svg width="72" height="72"><use href="#logo"/></svg>
  <div class="lt" id="lockMsg">اكتب الرمز حتى تفتح Noto</div>
  <div class="dots" id="lockDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="keys" id="lockKeys"></div>
</div>

<section id="lib" class="scr">
  <div class="libHead wrap"><div class="brand"><svg width="36" height="36"><use href="#logo"/></svg><b>Noto</b>
    <button class="ib" id="libSet" aria-label="الإعدادات"></button></div></div>
  <div class="libBody"><div class="wrap">
    <h1>سكربتاتك</h1>
    <p class="sub">اختار سكربت، وNoto يطلعلك جملة جملة بالوقت الي تختاره.</p>
    <div class="newRow">
      <button class="btn p" id="newDrive"></button>
      <button class="btn" id="newPaste"></button>
      <button class="btn" id="newFile"></button>
    </div>
    <div class="list" id="libList"></div>
  </div></div>
</section>

<section id="edit" class="scr" hidden>
  <div class="edHead wrap"><button class="ib" id="edBack" aria-label="رجوع للمكتبة"></button><input id="edTitle" placeholder="اسم السكربت" aria-label="اسم السكربت"></div>
  <div class="edBody wrap">
    <textarea id="edText" placeholder="الصق السكربت هنا. كل سطر أو جملة تطلعلك بروحها." aria-label="نص السكربت"></textarea>
    <div class="edInfo" id="edInfo"></div>
    <button class="btn p w" id="edGo"></button>
  </div>
</section>

<section id="read" class="scr" hidden>
  <div id="tally"><i></i></div>
  <div class="rTop">
    <button class="rb" id="rClose" aria-label="رجوع للمكتبة"></button>
    <div class="rTitle"><b id="rName"></b><span id="rCount"></span></div>
    <button class="rb l" id="rEasy" aria-label="سهّل هذي الجملة"></button>
    <button class="rb l" id="rSay" aria-label="اسمع الجملة"></button>
    <button class="rb l" id="rLook" aria-label="شكل الكتابة">Aa<span class="lb">&nbsp;الشكل</span></button>
    <button class="rb l" id="rCam" aria-label="صوّر وانت تقرا"></button>
    <button class="rb" id="rSet" aria-label="الإعدادات"></button>
  </div>
  <div class="rStage" id="rStage">
    <div id="sWrap">
      <div class="sCue" id="sCue"></div>
      <div id="sBox"><p id="sTxt"></p><div id="memoCue"></div></div>
      <div class="sHint" id="sHint"></div>
      <div class="sNext" id="sNext"></div>
    </div>
    <div id="cdown" hidden></div>
  </div>
  <div class="rDock" id="rDock">
    <div class="dRow">
      <button class="dBtn" id="dPrev" aria-label="الجملة الي قبلها"></button>
      <button class="dBtn dPlay" id="dPlay" aria-label="تشغيل"></button>

}

const HEAD_RE=/^(العنوان|الهوك|هوك بديل|السكربت|المقدمة|الخاتمة|النهاية|البداية|الفصل\s*\S*)\s*[:：]?\s*(.*)$/;

function splitLong(p,M){
  const w=p.split(/\s+/);if(w.length<=M)return [p];
  const c=p.split(/(?<=[،,؛:])\s+/);
  if(c.length>1){const out=[];let cur="";for(const x of c){const t=cur?cur+" "+x:x;if(!cur||wc(t)<=M)cur=t;else{out.push(cur);cur=x;}}if(cur)out.push(cur);
    if(out.length>1)return out.flatMap(o=>splitLong(o,M));}
  const mid=Math.round(w.length/2);let best=-1;
  for(let d=0;d<=Math.floor(w.length/2)-2&&best<0;d++)for(const k of [mid-d,mid+d])if(k>=3&&k<=w.length-3&&JOIN.test(w[k]+" ")){best=k;break;}
  if(best<0)best=mid;

function parse(text){
  const lines=cleanText(text).split("\n"),out=[];let sec="",cue="";const M=SLEN[S.slen]||12;
  lines.forEach((line,li)=>{

    if(hm&&(hm[1]==="العنوان"||!hm[2]||hm[2].length<2)){if(hm[1]!=="العنوان")sec=hm[1];return;}
    if(/^\[.*\]$/.test(line)){cue=line.slice(1,-1).trim();return;}
    let body=line,ls=sec;if(hm&&hm[2]){ls=hm[1];body=hm[2];}
    body.split(/(?<=[.!؟?…])\s+|\s*\/\/\s*/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
      p=p.replace(/\[([^\]]*)\]/g,(m,c)=>{cue=c.trim();return "";}).replace(/\s+/g," ").trim();if(!p)return;

async function inflateRaw(u8){if(window.DecompressionStream){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return new Uint8Array(await new Response(st).arrayBuffer());}throw new Error("no-inflate");}
async function readDocx(buf){

  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error("not-zip");
  let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    if(name==="word/document.xml"){
      const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);const raw=u8.subarray(start,start+csize);
      const xml=td.decode(method===0?raw:await inflateRaw(raw));
      const d=new DOMParser().parseFromString(xml,"application/xml");const out=[];
      for(const para of Array.from(d.getElementsByTagName("w:p"))){let t="";
        for(const node of Array.from(para.getElementsByTagName("*"))){if(node.nodeName==="w:t")t+=node.textContent;else if(node.nodeName==="w:tab")t+=" ";else if(node.nodeName==="w:br")t+="\n";}
        out.push(t);}
      return out.join("\n");}
    p+=46+nl+xl+cl;}
  throw new Error("no-document");
}

    const q=el("input","field");q.placeholder="دوّر باسم السكربت";q.setAttribute("aria-label","دوّر");B.append(q);
    const L=el("div");B.append(L);let t=0;
    const msg=(m,btn,fn)=>{L.innerHTML="";L.append(el("p","note",m));if(btn){const b=el("button","btn p w",btn);b.style.marginTop="10px";b.addEventListener("click",fn);L.append(b);}};
    const run=async(s)=>{const my=++driveSeq;L.innerHTML='<p class="note"><span class="spin"></span> دا أدوّر…</p>';
      if(!mcp)mcp=await mcpP;if(!mcp){msg("الدرايف يشتغل لما تفتح Noto من رابطه بحساب Claude.");return;}
      const types="(mimeType = 'application/vnd.google-apps.document' or mimeType = 'text/plain' or mimeType = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document')";
      try{const r=await mcp.callTool(DRIVE,"search_files",{query:(s?"title contains '"+escQ(s)+"' and ":"")+types+" and trashed = false",pageSize:40,excludeContentSnippets:true,orderBy:"modifiedTime desc"});
        if(my!==driveSeq)return;const files=(r&&r.payload&&r.payload.files)||[];L.innerHTML="";
        if(!files.length){msg(s?"ما لگيت سكربت بهذا الاسم.":"ما لگيت ملفات نصية بالدرايف.");return;}
        files.forEach(f=>{const b=el("button","opt",f.title||"بدون عنوان");try{b.append(el("small",null,new Date(f.modifiedTime).toLocaleDateString("ar-IQ",{day:"numeric",month:"long"})));}catch(e){}
          b.addEventListener("click",()=>{closeSheet();openDrive(f.id,f.title);});L.append(b);});
      }catch(e){if(my!==driveSeq)return;const c=e&&e.code;
        if(c==="server_not_connected"||c==="server_not_found"||c==="selection_required")msg("Google Drive مو مربوط بحسابك. اربطه من إعدادات Claude ← الموصلات، وارجع.","جرّب مرة ثانية",()=>run(s));
        else if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")msg("Noto يحتاج إذنك حتى يشوف سكربتات الدرايف.","اسمح وافتح الدرايف",()=>run(s));
        else msg("الدرايف ما جاوب. تأكد من النت.","جرّب مرة ثانية",()=>run(s));}};
    q.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>run(q.value.trim()),450);});
    run("");
  });
}
async function openDrive(id,title){
  const old=docs.find(r=>r.id===id);toast("دا أجيب السكربت من الدرايف…");
  try{if(!mcp)mcp=await mcpP;const r=await mcp.callTool(DRIVE,"read_file_content",{fileId:id},{cache:false});const p=r&&r.payload;
    const text=cleanText(typeof p==="string"?p:(p&&p.fileContent)||"");if(!wc(text))throw 0;
    openEdit({id,title:title||"سكربت",text,src:"drive"},true);
  }catch(e){if(old){openEdit(old,true);toast("الدرايف ما جاوب، فتحت النسخة المحفوظة");}else toast("ما گدرت أجيب الملف. جرّب مرة ثانية.");}
}

const R={idx:0,t:0,playing:false,peek:false,clock0:0,marks:[],lastMark:-1e9,counting:false,cdT:0};

  $("rName").textContent=doc.title||"";show("read");applyLook();showSent();setPlayUi();cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(loop);

function applyLook(){const f=font(),th=theme(),rd=$("read");
  rd.style.setProperty("--tbg",th.bg);rd.style.setProperty("--tfg",th.fg);
  const tx=$("sTxt"),mc=$("memoCue");tx.style.fontFamily=mc.style.fontFamily='"'+f.css+'","Vazirmatn",system-ui,sans-serif';tx.style.fontWeight=mc.style.fontWeight=f.w[S.weight]||800;
  $("sWrap").classList.toggle("mir",!!S.mirror);rd.classList.toggle("top",S.pos==="top");
  document.querySelector('meta[name="theme-color"]')&&document.querySelector('meta[name="theme-color"]').setAttribute("content",cur==="read"?th.bg:"#121316");
  if(document.fonts&&document.fonts.load)document.fonts.load((f.w[S.weight]||800)+' 40px "'+f.css+'"',"اگچ").then(()=>fit()).catch(()=>{});

function showSent(){
  const s=SENT[R.idx];if(!s)return;const tx=$("sTxt");tx.innerHTML="";
  if(S.hardMark){const {tok,hit}=hardSpans(s.t);const mark=new Set();hit.forEach(h=>{for(let k=0;k<h.n;k++)mark.add(h.i+k);});
    tok.forEach((w,i)=>{if(i)tx.append(" ");if(mark.has(i)){const sp=el("span","hw",w);tx.append(sp);}else tx.append(w);});}
  else tx.textContent=s.t;
  const w=s.t.split(/\s+/);$("memoCue").textContent=w.slice(0,2).join(" ")+(w.length>2?" …":"");
  $("sCue").textContent=s.cue?"[ "+s.cue+" ]":"";$("sCue").hidden=!s.cue;
  const P=N.get("pron_"+doc.id,{});const hints=[];s.t.split(/\s+/).forEach(x=>{const k=norm(x);if(P[k])hints.push(x+" = "+P[k]);});
  $("sHint").textContent=hints.join("   ");$("sHint").hidden=!hints.length;
  const nx=SENT[R.idx+1];$("sNext").textContent=nx&&S.next?nx.t:"";$("sNext").hidden=!(nx&&S.next);
  $("rCount").textContent=(s.sec?s.sec+" · ":"")+(R.idx+1)+" من "+SENT.length;

function lh(f){if(S.lead==="comfy")return 1.6;if(S.lead==="wide")return 1.8;return f>=120?1.22:f>=80?1.3:f>=50?1.4:1.5;}
function fit(){
  if(cur!=="read")return;const box=$("sBox"),tx=$("sTxt"),mc=$("memoCue");const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
  const MW=Math.floor(W*(MEAS[S.measure]||.8));tx.style.maxWidth=mc.style.maxWidth=MW+"px";
  const hi0=Math.max(30,Math.min(H*.36,W*.3,230)*S.scale);let lo=18,hi=hi0;
  const ok=f=>{tx.style.fontSize=f+"px";tx.style.lineHeight=lh(f);return tx.scrollHeight<=H*.94&&tx.scrollWidth<=MW+1;};
  tx.style.width="";
  let best=lo;if(ok(hi)){best=hi;}else{for(let k=0;k<14;k++){const m=(lo+hi)/2;if(ok(m)){best=m;lo=m;}else hi=m;}}
  best=Math.floor(best);ok(best);mc.style.fontSize=Math.round(best*.6)+"px";
}
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe($("sBox"));else addEventListener("resize",fit);
function tick(){
  const du=dur(R.idx),fr=Math.min(1,R.t/du);$("tally").querySelector("i").style.width=(fr*100)+"%";
  $("tally").classList.toggle("warn",R.playing&&du-R.t<=2&&R.t<du);
  $("secV").textContent=R.playing?"باقي "+Math.max(0,Math.ceil(du-R.t))+" ث":(S.longMore?"معدّل "+S.sec+" ث":S.sec+" ثانية");
  const rd=$("read");rd.classList.toggle("memo",R.playing&&S.memo&&!R.peek&&R.t>=du*.45&&R.t<du);rd.classList.toggle("blank",R.playing&&S.gap&&R.t>=du);
  if(sf.on)selfieTick();
}
function loop(ts){
  raf=requestAnimationFrame(loop);const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
  if(!R.playing||R.counting)return;R.t+=dt;const du=dur(R.idx),gp=S.gap?.8:0;
  if(R.t>=du+gp){if(R.idx<SENT.length-1)go(R.idx+1,true);else{R.t=du;pause();finish();return;}}
  tick();
}
function savePos(){if(doc)N.set("pos_"+doc.id,R.idx);N.set("sess",{v:cur,id:doc&&doc.id,idx:R.idx});}
function go(i,auto){i=Math.max(0,Math.min(SENT.length-1,i));if(i===R.idx&&!auto){R.t=0;}R.idx=i;R.t=0;R.peek=false;showSent();savePos();if(!auto)wakeUi();}
function mark(){if(!R.clock0)return;const now=performance.now();if(now-R.lastMark>3000)R.marks.push({at:(now-R.clock0)/1000,i:R.idx});R.lastMark=now;}
function prev(){mark();go(R.idx-1);}
function next(){go(R.idx+1);}
function again(){mark();R.t=0;R.peek=false;showSent();wakeUi();toast("عيدها على راحتك");}
function setPlayUi(){$("dPlay").innerHTML=R.playing?PAUSE:PLAY;$("dPlay").setAttribute("aria-label",R.playing?"وگّف":"مشّي");tick();}
async function wakeOn(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){}}
function play(){
  if(R.playing||R.counting)return;
  const start=()=>{R.counting=false;$("cdown").hidden=true;R.playing=true;if(!R.clock0)R.clock0=performance.now();setPlayUi();calmSoon();wakeOn();};
  if(S.cd&&!R.clock0){R.counting=true;let n=3;const c=$("cdown");c.hidden=false;c.textContent=AR(n);setPlayUi();
    clearInterval(R.cdT);R.cdT=setInterval(()=>{n--;if(n<=0){clearInterval(R.cdT);start();}else c.textContent=AR(n);},850);}
  else start();
}
function pause(){if(R.counting){clearInterval(R.cdT);R.counting=false;$("cdown").hidden=true;}R.playing=false;setPlayUi();wakeUi();}
function toggle(){if(R.playing||R.counting)pause();else play();}
function wakeUi(){clearTimeout(calmT);$("read").classList.remove("calm");if(R.playing)calmSoon();}
function calmSoon(){clearTimeout(calmT);calmT=setTimeout(()=>{if(R.playing&&!$("sheet").classList.contains("open"))$("read").classList.add("calm");},2600);}
function finish(){
  const total=R.clock0?(performance.now()-R.clock0)/1000:0;if(doc&&R.clock0)N.set("take_"+doc.id,{total,marks:R.marks,at:Date.now()});
  openSheet("خلص السكربت 👏",B=>{
    const r=(a,b)=>{const d=el("div","res");d.append(el("span",null,a),el("b",null,b));B.append(d);};
    r("الوقت",fmt(total));r("الجمل",String(SENT.length));r("رجعت أو عدت",R.marks.length+" مرة");
    if(R.marks.length){B.append(el("p","note","وين رجعت (حتى المونتير يقص):"));R.marks.forEach(m=>{const b=el("button","opt",fmt(m.at)+" · الجملة "+(m.i+1));b.append(el("small",null,(SENT[m.i]||{}).t||""));
      b.addEventListener("click",()=>{closeSheet();go(m.i);});B.append(b);});}
    const a=el("button","btn p w","عيد من الأول");a.style.marginTop="14px";a.addEventListener("click",()=>{closeSheet();R.clock0=0;R.marks=[];go(0);});B.append(a);
    const b2=el("button","btn w","ارجع للمكتبة");b2.style.marginTop="8px";b2.addEventListener("click",()=>{closeSheet();closeRead();});B.append(b2);
  });
}

let px=null,py=0,pt=0;
$("rStage").addEventListener("pointerdown",e=>{px=e.clientX;py=e.clientY;pt=performance.now();});
$("rStage").addEventListener("pointerup",e=>{if(px===null)return;const dx=e.clientX-px,dy=e.clientY-py;px=null;wakeUi();
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){if(dx<0)next();else prev();return;}
  if(Math.abs(dx)<12&&Math.abs(dy)<12&&performance.now()-pt<600){if($("read").classList.contains("memo")){R.peek=true;tick();return;}toggle();}});

  if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle();}else if(e.key==="ArrowLeft"||e.key==="PageDown"){e.preventDefault();next();}
  else if(e.key==="ArrowRight"||e.key==="PageUp"){e.preventDefault();prev();}else if(e.key==="r"||e.key==="R"){again();}else if(e.key==="Escape"){closeSheet();}});

function say(t){
  if(!window.speechSynthesis){toast("الجهاز ما يدعم القراءة بالصوت");return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.82;
  const v=(speechSynthesis.getVoices()||[]).find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;
  u.onerror=()=>toast("ما گدرت أقراها. من إعدادات الجهاز ← تسهيلات الاستخدام ← المحتوى المنطوق، نزّل صوت عربي.");
  speechSynthesis.speak(u);toast("🔊 اسمعها، وبعدين گولها بطريقتك");
}

/* السكربت العائم: نصنع فيديو صغير بيه الجمل بالتوقيت، ويطفو فوگ أي تطبيق (صورة داخل صورة) */
const fl={url:null,v:null,starts:[],total:0,busy:false};
function flWrap(ctx,text,maxW){const w=text.split(" "),L=[];let c="";for(const x of w){const t=c?c+" "+x:x;if(ctx.measureText(t).width>maxW&&c){L.push(c);c=x;}else c=t;}if(c)L.push(c);return L;}
function flDraw(ctx,W0,H0,text,frac,th,f,idx,n){ctx.fillStyle=th.bg;ctx.fillRect(0,0,W0,H0);ctx.direction="rtl";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=th.fg;
  let fs=Math.round(H0*.24),L;for(;;){ctx.font=(f.w[S.weight]||800)+" "+fs+'px "'+f.css+'",system-ui';L=flWrap(ctx,text,W0*.92);if(L.length*fs*1.35<=H0*.8||fs<=18)break;fs-=2;}
  const lhh=fs*1.35,y0=H0*.45-(L.length-1)*lhh/2;L.forEach((l,k)=>ctx.fillText(l,W0/2,y0+k*lhh));
  ctx.fillStyle="rgba(128,128,128,.35)";ctx.fillRect(W0*.1,H0-18,W0*.8,6);ctx.fillStyle=frac>.8?"#f5a524":"#e5383b";ctx.fillRect(W0*.9-W0*.8*frac,H0-18,W0*.8*frac,6);
  if(idx>=0){ctx.font="600 16px system-ui";ctx.globalAlpha=.5;ctx.textAlign="left";ctx.fillText((idx+1)+"/"+n,14,22);ctx.globalAlpha=1;}}
async function flBuild(onPct){
  if(!window.VideoEncoder||!window.VideoFrame)throw new Error("نسخة الجهاز قديمة وما تدعم هذا. حدّث النظام، أو استعمل «صوّر هنا».");
  if(!window.Mp4Muxer)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js";s.onload=ok;s.onerror=()=>no(new Error("ما گدرت أنزّل أداة الفيديو. تأكد من النت."));document.head.append(s);});
  const W0=960,H0=400,f=font(),th=theme();try{await document.fonts.load((f.w[S.weight]||800)+' 40px "'+f.css+'"',"اگچ");}catch(e){}
  let cfg=null,mux="avc";for(const [c,m] of [["avc1.42001f","avc"],["avc1.4d0028","avc"],["vp09.00.10.08","vp9"]]){const k={codec:c,width:W0,height:H0,bitrate:600000,framerate:4};if(m==="avc")k.avc={format:"avc"};
    try{if((await VideoEncoder.isConfigSupported(k)).supported){cfg=k;mux=m;break;}}catch(e){}}
  if(!cfg)throw new Error("الجهاز ما يدعم صنع الفيديو.");
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:mux,width:W0,height:H0},fastStart:"in-memory"});
  let err=null;const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{err=e;}});enc.configure(cfg);
  const cv=document.createElement("canvas");cv.width=W0;cv.height=H0;const ctx=cv.getContext("2d");
  const step=.25,n=SENT.length,gap=S.gap?.8:0;let t=0;fl.starts=[];
  const put=async(du,draw)=>{for(let k=0;k*step<du-1e-6;k++){const d=Math.min(step,du-k*step);draw(k*step/du);const fr=new VideoFrame(cv,{timestamp:Math.round(t*1e6),duration:Math.round(d*1e6)});
      enc.encode(fr,{keyFrame:k===0||k%40===0});fr.close();t+=d;if(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));if(err)throw err;}};
  for(let c=3;c>=1;c--)await put(1,()=>flDraw(ctx,W0,H0,"جاهز؟ "+c,0,th,f,-1,n));
  for(let i=0;i<n;i++){fl.starts.push(t);await put(dur(i),fr=>flDraw(ctx,W0,H0,SENT[i].t,fr,th,f,i,n));if(gap)await put(gap,()=>{ctx.fillStyle=th.bg;ctx.fillRect(0,0,W0,H0);});onPct&&onPct(Math.round((i+1)/n*100));}
  await put(2,()=>flDraw(ctx,W0,H0,"خلص السكربت",1,th,f,n-1,n));
  await enc.flush();enc.close();muxer.finalize();fl.total=t;if(fl.url)URL.revokeObjectURL(fl.url);fl.url=URL.createObjectURL(new Blob([muxer.target.buffer],{type:"video/mp4"}));return fl.url;}
async function flFloat(){const v=fl.v;if(!v||!fl.url)return;try{v.currentTime=Math.max(0,(fl.starts[R.idx]||3)-3);}catch(e){}
  try{await v.play();}catch(e){}
  try{if(document.pictureInPictureEnabled&&v.requestPictureInPicture){await v.requestPictureInPicture();return;}}catch(e){}
  try{if(v.webkitSupportsPresentationMode&&v.webkitSupportsPresentationMode("picture-in-picture")){v.webkitSetPresentationMode("picture-in-picture");return;}}catch(e){}
  toast("الجهاز ما خلّاني أطلّعه عائم. اطلع للشاشة الرئيسية وهو شغّال، يطلع وحده.");}

(function boot(){
  renderLib();const ss=N.get("sess",null);
  if(ss&&ss.id){const d=docs.find(x=>x.id===ss.id);if(d){if(ss.v==="read"){openRead(d,ss.idx);return;}if(ss.v==="edit"){openEdit(d);return;}}}
  show("lib");
})();
})();
