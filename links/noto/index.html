<style>
/* Noto 3: ملقّن بطريقتين (جملة جملة أو تمرير تلقائي). ثلاث شاشات (سكريبتاتك، التعديل، القراءة) + لوحة وحدة. */
:root{--bg:#0e0f12;--s1:#1a1b1f;--s2:#24252a;--s3:#303137;--line:#2a2b31;--fg:#f4f3f0;--mut:#9a9ba3;--acc:#2160ff;--acc2:#4d82ff;--rec:#ff3b30;--amber:#f5a524;--ok:#34c759;
  --ui:"Vazirmatn",system-ui,-apple-system,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --tbg:#000;--tfg:#fff;color-scheme:dark}
html[lang=en]{--ui:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
button:disabled{opacity:.45}
[hidden]{display:none!important}
svg{flex:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:max(20px,var(--sar));padding-right:max(20px,var(--sal))}
.btn{height:52px;border-radius:16px;padding:0 20px;background:var(--s2);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
a.btn{color:var(--fg)}
.btn.p{background:var(--acc);color:#fff;box-shadow:0 10px 28px -8px rgba(33,96,255,.75)}
.btn.w{width:100%}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);transition:transform .12s}
.ib:active{transform:scale(.93)}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:.01em}
.brand img{width:30px;height:30px;border-radius:8px}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding-top:calc(var(--sat) + 10px);padding-bottom:6px}
.topbar .sp{width:44px}
.pillBtn{height:40px;border-radius:999px;padding:0 16px;background:var(--s2);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.pillBtn.hot{background:#ff5a36;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 140px);transform:translate(-50%,20px);background:#f4f3f0;color:#111;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:300;max-width:88vw;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lock{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#lock img{width:84px;height:84px;border-radius:20px}
#lock .lt{font-size:1.05rem;color:var(--mut)}
.dots{display:flex;gap:14px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #555}
.dots i.on{background:#fff;border-color:#fff}
.dots.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,74px);gap:14px;direction:ltr;margin-top:6px}
.keys button{width:74px;height:74px;border-radius:50%;background:var(--s2);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--s3)}
.keys button.ghost{background:none;font-size:1rem}
.libBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 28px)}
.hero{font-size:clamp(40px,11vw,58px);font-weight:900;margin:26px 0 4px;line-height:1.15}
.heroSub{color:var(--mut);margin:0 0 22px;font-size:16px;line-height:1.7}
.newBtn{height:68px;font-size:19px;border-radius:20px;width:100%}
.h2{font-size:21px;font-weight:800;margin:30px 0 12px}
.list{display:flex;flex-direction:column;gap:12px}
.it{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.it .t{font-weight:800;font-size:19px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .m{color:var(--mut);font-size:14px;line-height:1.6}
.it .acts{display:flex;gap:8px;align-items:center;margin-top:6px}
.it .acts .sp{flex:1}
.chipBtn{height:38px;border-radius:999px;padding:0 18px;font-weight:700;font-size:15px;border:1px solid var(--s3)}
.chipBtn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.it .more{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.it .pr{height:3px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:4px}
.it .pr i{display:block;height:100%;background:var(--acc)}
.empty{background:var(--s1);border:1px dashed var(--s3);border-radius:22px;padding:22px;color:var(--mut);line-height:1.8;font-size:15px}
.edBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(var(--sab) + 14px)}
.edBody h2{font-size:22px;font-weight:800;margin:10px 0 0}
#edTitle{height:58px;border-radius:18px;border:1px solid var(--line);background:var(--s1);padding:0 18px;font-weight:800;font-size:20px;width:100%}
.edCard{flex:1;min-height:0;border-radius:22px;border:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;overflow:hidden}
#edText{flex:1;min-height:0;resize:none;border:0;background:none;padding:16px 18px;font-size:18px;line-height:1.85;font-family:var(--ui);font-weight:500;outline:none}
.edFoot{display:flex;justify-content:space-between;gap:10px;padding:10px 18px 12px;color:var(--mut);font-size:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.edFoot b{color:var(--fg)}
.edFoot .warn{color:var(--amber)}
#edGo{height:62px;font-size:18px;border-radius:20px}
#read{background:var(--tbg);color:var(--tfg);transition:padding .25s}
.rTop{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) max(14px,var(--sar)) 4px max(14px,var(--sal));font-family:var(--ui);transition:opacity .4s}
.rTop .side{display:flex;gap:8px}
.rTop .side.e{justify-content:flex-end}
.rb{height:44px;min-width:44px;border-radius:50%;background:rgba(128,128,128,.2);display:grid;place-items:center}
.clock{height:44px;border-radius:14px;background:rgba(128,128,128,.2);padding:0 16px;display:flex;align-items:center;gap:10px;font:700 18px var(--ui);font-variant-numeric:tabular-nums;direction:ltr}
.clock .n{font-size:13px;opacity:.65;font-weight:600}
.clock .n:empty{display:none}
.clock .dot{width:8px;height:8px;border-radius:50%;background:var(--rec);opacity:0}
.clock.rec .dot{opacity:1}
#tally{position:absolute;top:0;left:0;right:0;height:3px;z-index:4}
#tally i{display:block;height:100%;width:0;background:var(--acc2);margin-inline-start:0}
#tally.warn i{background:var(--amber)}
.rStage{flex:1;min-height:0;position:relative;overflow:hidden}
#cardV{position:absolute;inset:0;padding:4px max(4%,var(--sal)) 4px max(4%,var(--sar));display:flex;flex-direction:column;align-items:center;gap:8px}
#cardV.mir,#scrollV.mir{transform:scaleX(-1)}
.sCue{font-family:var(--ui);font-size:clamp(15px,2.2vh,22px);font-weight:700;color:var(--amber);text-align:center;line-height:1.5}
#sBox{flex:1 1 auto;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden}
#sBox>*{grid-area:1/1}
#read.top #sBox{place-items:start center;padding-top:2vh}
#sTxt{margin:0;text-align:center;text-wrap:balance;word-break:keep-all;overflow-wrap:normal;transition:opacity .35s}
#sTxt .br{opacity:.35;font-weight:300;font-size:.7em;margin:0 .12em;color:var(--amber)}
#sTxt.pg .w{opacity:.42;transition:opacity .22s}
#sTxt.pg .w.on{opacity:1}
.rStage{box-shadow:inset 0 0 min(18vw,160px) -10px var(--mood,transparent);transition:box-shadow .8s}
#mood{position:absolute;inset:0;z-index:6;display:grid;place-items:center;text-align:center;background:var(--tbg);font-family:var(--ui);padding:0 8%;animation:moodIn .5s ease}
#mood b{display:block;font-size:clamp(54px,12vh,110px);line-height:1.1}
#mood strong{display:block;font-size:clamp(28px,5vh,46px);margin:6px 0 10px}
#mood span{display:block;font-size:clamp(18px,3vh,28px);opacity:.8;line-height:1.6;max-width:22em;margin:0 auto}
@keyframes moodIn{from{opacity:0;transform:scale(.96)}}
.breathC{width:160px;height:160px;border-radius:50%;margin:18px auto 8px;background:radial-gradient(circle,#4d82ff 0%,#2160ff 55%,rgba(33,96,255,.15) 70%);transform:scale(.6);transition:transform 4s ease-in-out}
.breathC.in{transform:scale(1)}
.st{color:#8fb4ff;text-decoration:underline;text-decoration-color:#4d82ff;text-decoration-thickness:.07em;text-underline-offset:.22em}
.hw{text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:.06em;text-underline-offset:.2em}
#memoCue{opacity:0;transition:opacity .35s;pointer-events:none;text-align:center}
#read.memo #sTxt{opacity:0}
#read.memo #memoCue{opacity:.6}
#read.blank #sTxt,#read.blank #memoCue,#read.blank .sNext{opacity:0}
.sHint{font-family:var(--ui);font-size:16px;opacity:.75;text-align:center;line-height:1.6}
.sNext{opacity:.3;font-size:clamp(15px,2.4vh,24px);max-width:92%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
#scrollV{position:absolute;inset:0;overflow:hidden;--gy:36%;-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 10%,#000 calc(var(--gy) - 4%),#000 calc(var(--gy) + 14%),rgba(0,0,0,.4) 84%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 10%,#000 calc(var(--gy) - 4%),#000 calc(var(--gy) + 14%),rgba(0,0,0,.4) 84%,transparent 100%)}
#scrollTxt{position:absolute;left:0;right:0;top:0;margin:0 auto;will-change:transform;padding:0 5% 75vh}
#scrollTxt p{margin:0 0 .5em}
#scrollTxt .sec{font-family:var(--ui);font-size:.36em;color:var(--amber);font-weight:700;margin:.6em 0 .2em}
#gBox{position:absolute;left:max(3%,var(--sal));right:max(3%,var(--sar));border:2px solid var(--acc2);border-radius:18px;pointer-events:none;z-index:2}
#cdown{position:absolute;inset:0;display:grid;place-items:center;font:900 min(38vh,220px)/1 var(--ui);color:var(--acc2);z-index:5;pointer-events:none}
.rPanel{position:relative;z-index:3;margin:6px auto calc(var(--sab) + 10px);width:min(560px,calc(100% - 24px));background:rgba(40,41,46,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:10px 12px 12px;font-family:var(--ui);color:#f4f3f0;transition:opacity .4s}
.rPanel .grab{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 8px}
.pRow{display:flex;align-items:center;justify-content:space-between;gap:6px;direction:ltr}
.pb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;transition:transform .12s;position:relative}
.pb:active{transform:scale(.92)}
.pb small{position:absolute;font-size:9px;font-weight:800;top:50%;left:50%;transform:translate(-50%,-40%)}
.pb.big{width:70px;height:70px;background:var(--acc);box-shadow:0 8px 26px -6px rgba(33,96,255,.8)}
.pRow2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.pChips{display:flex;gap:6px;flex-wrap:wrap}
.pChip{height:38px;border-radius:999px;padding:0 13px;background:rgba(255,255,255,.1);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pStep{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.pStep button{width:34px;height:34px;border-radius:50%;font-size:19px;font-weight:700}
.pStep span{min-width:84px;text-align:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
#read.calm .rTop{opacity:0;pointer-events:none}
#read.calm .rPanel{opacity:.2}
#read.shB .rPanel{display:none}
#read.calm.hid .rPanel,#read.calm.hid .rTop{opacity:0;pointer-events:none}
@media (max-height:540px){.pb{width:42px;height:42px}.pb.big{width:54px;height:54px}.pChip{height:32px}.pStep button{width:30px;height:30px}.rPanel{padding:6px 10px 8px;border-radius:22px}.rPanel .grab{display:none}.pRow2{margin-top:6px}.rb,.clock{height:38px}.rb{min-width:38px}}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:min(84%,760px);background:var(--s1);color:var(--fg);border-radius:26px 26px 0 0;z-index:61;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);font-family:var(--ui);box-shadow:0 -10px 40px rgba(0,0,0,.4)}

  #sheet.open,html[dir=ltr] #sheet.open{transform:none}
  body.reading #sheet{max-height:none}}
.shH{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}

.shH b{flex:1;font-size:20px;font-weight:900}
.shB{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 18px calc(var(--sab) + 22px);overscroll-behavior:contain}
.grp{margin:18px 0 0}
.grp>h3{font-size:14px;color:var(--mut);font-weight:700;margin:0 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:13px;background:var(--s2);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:#111}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:18px;background:var(--s2);padding:14px;text-align:start;border:2px solid transparent;line-height:1.5}
.mode b{display:block;font-size:17px}
.mode small{color:var(--mut);font-size:13px}
.mode.on{border-color:var(--acc2);background:rgba(33,96,255,.14)}
.row{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0;line-height:1.5}
.row .tx b{display:block;font-size:16px}
.row .tx small{color:var(--mut);font-size:13px}
.sw{width:52px;height:32px;border-radius:999px;background:var(--s3);position:relative;flex:none;transition:background .2s}

.sw.on{background:var(--ok)}
html[dir=rtl] .sw.on::after{transform:translateX(-20px)}
html[dir=ltr] .sw.on::after{transform:translateX(20px)}
.step{display:flex;align-items:center;gap:6px}

.step span{min-width:76px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.conn{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line)}
.conn .lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;flex:none}
.conn .tx{flex:1;min-width:0;line-height:1.45}
.conn .tx b{display:block;font-size:16px}
.conn .tx small{color:var(--mut);font-size:13px}
.conn .tx small.ok{color:var(--ok)}
.swc{display:flex;flex-wrap:wrap;gap:10px}
.swt{width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--mut);text-align:center;line-height:1.3}
.swt i{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:24px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.swt.on i{border-color:var(--fg)}
.note{color:var(--mut);font-size:14px;line-height:1.8;margin:8px 0 0}
.card{background:var(--s2);border-radius:16px;padding:14px;margin-top:10px;line-height:1.8}
.card .big{font-size:20px;font-weight:800;line-height:1.7}
.opt{display:block;width:100%;text-align:start;background:var(--s2);border-radius:16px;padding:14px 16px;margin-top:8px;font-size:17px;font-weight:700;line-height:1.7}
.opt:active{background:var(--s3)}
.opt small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.field{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:10px 14px;font-size:16px}
textarea.field{min-height:96px;line-height:1.8;resize:vertical}
.stepN{display:flex;gap:10px;align-items:flex-start;margin-top:16px}
.stepN>i{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.stepN>div{flex:1;min-width:0}
.colp{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:13px;padding:6px 12px 6px 6px;font-weight:700}
.colp input{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--fg);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.flPrev{width:100%;border-radius:12px;background:#000;aspect-ratio:960/400;margin-top:10px}
.res{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
#selfie{position:fixed;inset:0;z-index:200;background:#000;color:#fff;font-family:var(--ui)}
#selfie video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

/* شاشة البداية: شريط N ينرسم، وبعدها الشعار و«Noto» */
#splash{position:fixed;inset:0;z-index:900;background:radial-gradient(120% 80% at 50% 40%,#18213a 0%,#0e0f12 60%);display:grid;place-items:center;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .stage{position:relative;width:min(46vmin,230px);aspect-ratio:1;display:grid;place-items:center}
#splash .tile{position:absolute;inset:0;border-radius:23%;background:linear-gradient(160deg,#fbf8f2,#ece5d8);box-shadow:0 30px 60px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);transform:scale(.55) rotate(-8deg);opacity:0;animation:spTile 1s cubic-bezier(.2,.9,.25,1.15) .2s forwards}
#splash svg{position:absolute;inset:0;width:100%;height:100%}
#splash .rib{fill:none;stroke:url(#spG);stroke-width:26;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:spDraw var(--rl,2.6s) cubic-bezier(.5,.05,.3,1) var(--rd,1.1s) forwards}
#splash .ribHi{fill:none;stroke:rgba(255,255,255,.35);stroke-width:3;stroke-dasharray:520;stroke-dashoffset:520;animation:spDraw var(--rl,2.6s) cubic-bezier(.5,.05,.3,1) calc(var(--rd,1.1s) + .15s) forwards}
#splash .line{fill:none;stroke:#9ee7ff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;opacity:.9;animation:spDraw 1s ease-out 3.3s forwards}
#splash img{position:absolute;inset:0;width:100%;height:100%;border-radius:23%;opacity:0;transform:scale(.96);animation:spReal .9s ease 4.1s forwards}
#splash .glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(closest-side,rgba(33,96,255,.45),transparent 70%);opacity:0;animation:spGlow 1.8s ease 3.4s forwards}
#splash .word{position:absolute;top:calc(100% + 28px);left:50%;transform:translateX(-50%);display:flex;gap:2px;font:800 34px/1 -apple-system,"SF Pro Display","Inter",system-ui,sans-serif;color:#f4f3f0;letter-spacing:.02em;direction:ltr}
#splash .word span{opacity:0;transform:translateY(10px);animation:spChar .45s ease forwards}
#splash .word span:nth-child(1){animation-delay:5s}#splash .word span:nth-child(2){animation-delay:5.15s}#splash .word span:nth-child(3){animation-delay:5.3s}#splash .word span:nth-child(4){animation-delay:5.45s}
@keyframes spTile{to{transform:none;opacity:1}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spReal{to{opacity:1;transform:none}}
@keyframes spGlow{0%{opacity:0}40%{opacity:1}100%{opacity:.35}}
@keyframes spChar{to{opacity:1;transform:none}}
#splash:not(.go) *{animation-play-state:paused!important}

#splash .fx{position:absolute;inset:0;pointer-events:none}
#splash .ribG{transform-box:view-box;transform-origin:100px 100px}
#splash.v-write{--rd:3s;--rl:1s}#splash.v-wave{--rd:2.8s;--rl:1.1s}#splash.v-lines{--rd:2.8s;--rl:1.1s}#splash.v-lens{--rd:2.6s;--rl:1.3s}
#splash.v-count{--rd:2.9s;--rl:1s}#splash.v-fly{--rd:.5s;--rl:2.8s}#splash.v-ink{--rd:2s;--rl:1.6s}
@keyframes fxOut{to{opacity:0}}
@keyframes spFill{to{fill:#2452d6}}
#splash .fxW text{font:900 64px "Vazirmatn","Noto Kufi Arabic",system-ui;fill:transparent;stroke:#2452d6;stroke-width:1.4;stroke-dasharray:420;stroke-dashoffset:420;animation:spDraw 2s ease .5s forwards,spFill .5s ease 2.4s forwards}
#splash .fxW{animation:fxOut .4s ease 2.9s forwards}
#splash .fxB{inset:24% 20%;display:flex;align-items:center;justify-content:space-between;animation:fxOut .4s ease 2.7s forwards}
#splash .fxB i{width:5.5%;height:76%;border-radius:9px;background:linear-gradient(#4d82ff,#1b3fb3);transform:scaleY(.12);animation:fxBar .42s ease-in-out calc(.35s + var(--k)*.05s) infinite alternate}
@keyframes fxBar{to{transform:scaleY(var(--h,1))}}
#splash .fxL{inset:17% 19%;overflow:hidden;animation:fxOut .4s ease 2.8s forwards}

@keyframes fxScroll{to{transform:translateY(-52%)}}@keyframes fxOn{to{opacity:1}}
#splash .fxO{animation:fxOut .4s ease 2.6s forwards}
#splash .fxO i{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid #2452d6;transform:translate(-50%,-50%) scale(0);animation:fxRing .6s cubic-bezier(.2,.9,.3,1.3) forwards}

#splash .fxO u{position:absolute;right:16%;top:16%;width:9%;height:9%;border-radius:50%;background:#ff3b30;opacity:0;animation:fxBlink .5s steps(1) 1.4s 3 forwards}
@keyframes fxRing{to{transform:translate(-50%,-50%) scale(1)}}@keyframes fxBlink{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
#splash .fxC i{position:absolute;inset:0;display:grid;place-items:center;font:900 calc(min(46vmin,230px)*.55)/1 -apple-system,system-ui,sans-serif;color:#2452d6;font-style:normal;opacity:0;animation:fxNum .8s ease forwards}
#splash .fxC i:nth-child(1){animation-delay:.5s}#splash .fxC i:nth-child(2){animation-delay:1.3s}#splash .fxC i:nth-child(3){animation-delay:2.1s}
@keyframes fxNum{0%{opacity:0;transform:scale(1.7)}22%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}

@keyframes spFly{0%{transform:translate(-170px,-70px) rotate(-40deg) scale(1.6);opacity:0}15%{opacity:1}100%{transform:none;opacity:1}}
#splash .fxI b{position:absolute;left:43%;top:43%;width:14%;height:14%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#1a2f8f;transform:translateY(-330%);opacity:0;animation:fxDrop .75s cubic-bezier(.55,0,1,.45) .4s forwards,fxOut .3s ease 1.25s forwards}
#splash .fxI i{position:absolute;left:43%;top:43%;width:14%;height:14%;border-radius:50%;border:2px solid #1a2f8f;opacity:0;animation:fxRip 1.1s ease-out 1.15s forwards}
#splash .fxI i:nth-child(3){animation-delay:1.45s}
@keyframes fxDrop{0%{opacity:1}100%{transform:none;opacity:1}}@keyframes fxRip{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(5)}}

/* ---------- القفل (التطبيق المستقل بس). الرمز ما مكتوب بأي مكان، بس بصمته المشفّرة ---------- */
const LOCK={salt:"d486abe166c1528c467755f302e4b9ec",hash:"7afe1d6ea9ece7412d373e6e0e5317cd208efbe685a4faee79650e3e43123e29",iter:300000,days:30};
async function pinHash(pin){
  const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:hex(LOCK.salt),iterations:LOCK.iter,hash:"SHA-256"},key,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
(function(){
  if(!STANDALONE)return;
  const ok=(()=>{try{const u=JSON.parse(localStorage.getItem("noto_unlock")||"null");return u&&u.h===LOCK.hash&&u.until>Date.now();}catch(e){return false;}})();
  if(ok)return;
  const L=$("lock");L.hidden=false;let pin="",busy=false,fails=0,waitUntil=0;
  const dots=[...document.querySelectorAll("#lockDots i")],msg=$("lockMsg");
  const paint=()=>dots.forEach((d,i)=>d.classList.toggle("on",i<pin.length));
  async function check(){
    busy=true;msg.textContent=t("lockWait");let h="";try{h=await pinHash(pin);}catch(e){msg.textContent=t("lockNo");busy=false;return;}
    if(h===LOCK.hash){try{localStorage.setItem("noto_unlock",JSON.stringify({h,until:Date.now()+LOCK.days*864e5}));}catch(e){}L.remove();return;}
    fails++;pin="";paint();const D=$("lockDots");D.classList.remove("bad");void D.offsetWidth;D.classList.add("bad");
    if(fails>=5){waitUntil=Date.now()+30000;msg.textContent=t("lockMany");setTimeout(()=>{msg.textContent=t("lockMsg");},30000);}
    else msg.textContent=t("lockBad");
    busy=false;try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
  }
  function press(k){if(busy||Date.now()<waitUntil)return;if(k==="del"){pin=pin.slice(0,-1);paint();return;}if(pin.length>=6)return;pin+=k;paint();if(pin.length===6)check();}
  const K=$("lockKeys");["1","2","3","4","5","6","7","8","9","","0","del"].forEach(k=>{const b=document.createElement("button");
    if(!k){b.className="ghost";b.disabled=true;}else if(k==="del"){b.className="ghost";b.textContent=t("del");b.setAttribute("aria-label",t("del"));}else b.textContent=k;
    b.addEventListener("click",()=>press(k));K.append(b);});
  document.addEventListener("keydown",e=>{if(!$("lock"))return;e.stopPropagation();if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");},true);
})();

function norm(s){return String(s).replace(/[ً-ٰٟـ‌‍]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/گ/g,"ك").replace(/چ/g,"ج").replace(/پ/g,"ب").replace(/ڤ/g,"ف")
  .replace(/[^؀-ۿa-zA-Z0-9\s]/g," ").replace(/[،؛؟]/g," ").toLowerCase().replace(/\s+/g," ").trim();}
const HARDN=HARD.map(([h,a])=>({w:norm(h).split(" "),h,alt:a,swap:!/^گولها|\.\.\.$/.test(a)}));
function hardSpans(s){const tok=s.split(/\s+/),nt=tok.map(norm),hit=[];
  HARDN.forEach(h=>{for(let i=0;i+h.w.length<=nt.length;i++){let ok=true;for(let k=0;k<h.w.length;k++)if(nt[i+k]!==h.w[k]){ok=false;break;}if(ok)hit.push({i,n:h.w.length,h});}});return {tok,hit};}

const HEAD_RE=/^(العنوان|الهوك|هوك بديل|السكربت|السكريبت|المقدمة|الخاتمة|النهاية|البداية|الفصل\s*\S*)\s*[:：]?\s*(.*)$/;
const JOIN=/^(و[^ا]|بس |لأن|لان|حتى|يعني|بعدين|لكن|اللي|الي|بعد|قبل|علمود)/;
function cleanText(x){return String(x||"").replace(/\r/g,"").replace(/[   ]/g," ").replace(/^[ \t]*(#{1,6}|[*>•-])[ \t]+/gm,"").replace(/\*\*/g,"").split("\n").map(l=>l.replace(/[ \t]+/g," ").trim()).join("\n").replace(/\n{3,}/g,"\n\n").trim();}
const wc=s=>(String(s).match(/\S+/g)||[]).length;
function splitLong(p,M){
  const w=p.split(/\s+/);if(w.length<=M)return [p];
  const c=p.split(/(?<=[،,؛:])\s+/);
  if(c.length>1){const out=[];let cu="";for(const x of c){const y=cu?cu+" "+x:x;if(!cu||wc(y)<=M)cu=y;else{out.push(cu);cu=x;}}if(cu)out.push(cu);if(out.length>1)return out.flatMap(o=>splitLong(o,M));}
  const mid=Math.round(w.length/2);let best=-1;
  for(let d=0;d<=Math.floor(w.length/2)-2&&best<0;d++)for(const k of [mid-d,mid+d])if(k>=3&&k<=w.length-3&&JOIN.test(w[k]+" ")){best=k;break;}
  if(best<0)best=mid;
  return [...splitLong(w.slice(0,best).join(" "),M),...splitLong(w.slice(best).join(" "),M)];
}
function parse(text,noMerge){
  const lines=cleanText(text).split("\n"),out=[];let sec="",cue="";const M=SLEN[S.slen]||12;
  lines.forEach((line,li)=>{
    if(!line)return;const hm=line.match(HEAD_RE);
    if(hm&&(hm[1]==="العنوان"||!hm[2]||hm[2].length<2)){if(hm[1]!=="العنوان")sec=hm[1];return;}
    if(/^\[.*\]$/.test(line)){cue=line.slice(1,-1).trim();return;}
    let body=line,ls=sec;if(hm&&hm[2]){ls=hm[1];body=hm[2];}
    body.split(/(?<=[.!؟?…])\s+|\s*\/\/\s*/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
      p=p.replace(/\[([^\]]*)\]/g,(m,c)=>{cue=c.trim();return "";}).replace(/\s+/g," ").trim();if(!p)return;
      splitLong(p,M).forEach(x=>{out.push({t:x,li,sec:ls,cue,w:wc(x),parts:[{li,t:x}]});cue="";});});
  });

async function readDocx(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error("not-zip");let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    if(name==="word/document.xml"){const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);const raw=u8.subarray(start,start+csize);
      const xml=td.decode(method===0?raw:await inflateRaw(raw));const d=new DOMParser().parseFromString(xml,"application/xml");const out=[];
      for(const para of Array.from(d.getElementsByTagName("w:p"))){let x="";for(const node of Array.from(para.getElementsByTagName("*"))){if(node.nodeName==="w:t")x+=node.textContent;else if(node.nodeName==="w:tab")x+=" ";else if(node.nodeName==="w:br")x+="\n";}out.push(x);}
      return out.join("\n");}
    p+=46+nl+xl+cl;}

    tok.forEach((w,i)=>{if(i)x.append(" ");const isSt=!stDone&&stw&&norm(w)===stw;if(isSt)stDone=true;x.append(el("span","w"+(isSt?" st":mk.has(i)?" hw":""),w));

  {const bits=[];if(A){if(A.tone)bits.push(TN[A.tone]+" "+t("tn_"+A.tone));if(A.pace==="fast")bits.push("↑ "+t("pc_fast"));if(A.pace==="slow")bits.push("↓ "+t("pc_slow"));if(A.note)bits.push(A.note);}
   if(s.cue)bits.push("[ "+s.cue+" ]");$("sCue").textContent=bits.join("  ·  ");$("sCue").hidden=!bits.length;}

function lhv(f){if(S.lead==="comfy")return 1.6;if(S.lead==="wide")return 1.8;return f>=120?1.22:f>=80?1.3:f>=50?1.4:1.5;}
function fit(){
  if(cur!=="read"||!CARD())return;const box=$("sBox"),x=$("sTxt"),mc=$("memoCue");const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
  const MW=Math.floor(W*(MEAS[S.measure]||.8));x.style.maxWidth=mc.style.maxWidth=MW+"px";
  const hi0=Math.max(30,Math.min(H*.36,W*.3,230)*S.scale);let lo=18,hi=hi0;
  const ok=f=>{x.style.fontSize=f+"px";x.style.lineHeight=lhv(f);return x.scrollHeight<=H*.94&&x.scrollWidth<=MW+1;};
  let best=lo;if(ok(hi))best=hi;else for(let k=0;k<14;k++){const m=(lo+hi)/2;if(ok(m)){best=m;lo=m;}else hi=m;}
  best=Math.floor(best);ok(best);mc.style.fontSize=Math.round(best*.6)+"px";
}
function tick(){if(!CARD())return;$("rCount").textContent=AR(R.idx+1)+"/"+AR(SENT.length)+(S.showLeft?" · "+t("left2",mmss(leftTime())):"");const du=dur(R.idx),fr=Math.min(1,R.t/du);$("tally").querySelector("i").style.width=(fr*100)+"%";$("tally").classList.toggle("warn",R.playing&&du-R.t<=2&&R.t<du);stepUi();
  if(S.paceGuide){const x=$("sTxt"),ws=x.querySelectorAll(".w");const on=R.playing&&!R.moodT;x.classList.toggle("pg",on);
    if(on){const k=Math.min(ws.length,Math.ceil(Math.max(0,R.t-.25)/(du*.82)*ws.length+.001));if(k!==R.pk){R.pk=k;ws.forEach((w,i)=>w.classList.toggle("on",i<k));}}}
  const rd=$("read");rd.classList.toggle("memo",R.playing&&S.memo&&!R.peek&&R.t>=du*.45&&R.t<du);rd.classList.toggle("blank",R.playing&&S.gap&&R.t>=du);if(sf.on)selfieTick();}

/* ---------- التمرير التلقائي ---------- */
function buildScroll(){
  const B=$("scrollTxt");B.innerHTML="";B.dir="auto";const st=$("rStage").clientHeight||600,sw=$("rStage").clientWidth||800;
  const fs=Math.round(Math.max(30,Math.min(86,sw*.095,st*.12))*S.scale);const lh=S.lead==="comfy"?1.6:S.lead==="wide"?1.8:1.42;
  B.style.fontSize=fs+"px";B.style.lineHeight=lh;B.style.maxWidth=Math.round(sw*(MEAS[S.measure]||.8)+sw*.1)+"px";
  const gy=Math.round(st*S.guide);B.style.paddingTop=gy+"px";$("scrollV").style.setProperty("--gy",Math.round(S.guide*100)+"%");
  let lastLi=-1,p=null,lastSec="";
  SENT.forEach(s=>{if(s.sec&&s.sec!==lastSec){B.append(el("div","sec",s.sec));lastSec=s.sec;}if(s.li!==lastLi){p=el("p");B.append(p);lastLi=s.li;}else p.append(" ");const sp=el("span",null,s.t);sp.dataset.i=SENT.indexOf(s);p.append(sp);});
  R.lineH=fs*lh;const total=wc(SENT.map(x=>x.t).join(" "))||1;
  const ps=B.querySelectorAll("p"),fp=ps[0],lp=ps[ps.length-1];R.min=fp?fp.offsetTop-gy:0;R.max=Math.max(R.min+1,(lp?lp.offsetTop+lp.offsetHeight:gy)-gy-R.lineH);R.pxw=Math.max(.5,(R.max-R.min+R.lineH)/total);
  const stops=[];if(S.endPause)B.querySelectorAll("p span").forEach(sp=>{if(/[.!؟?…]$/.test(sp.textContent.trim()))stops.push({y:sp.offsetTop+sp.offsetHeight-R.lineH-gy,k:"end"});});
  if(S.secPause)B.querySelectorAll(".sec").forEach(d=>{const n=d.nextElementSibling;if(n&&n.offsetTop-gy>R.min+1)stops.push({y:n.offsetTop-gy,k:"sec",name:d.textContent});});
  R.stops=stops.sort((a,b)=>a.y-b.y);syncStops();
  const g=$("gBox");g.hidden=!S.box;g.style.top=(gy-R.lineH*.08)+"px";g.style.height=(R.lineH*1.08)+"px";
}
function renderScroll(){$("rCount").textContent=S.showLeft?t("left2",mmss(leftTime())):"";$("scrollTxt").style.transform="translate3d(0,"+(-R.pos).toFixed(1)+"px,0)";$("tally").querySelector("i").style.width=(frac()*100)+"%";if(sf.on)selfieTick();}
function syncStops(){if(!R.stops)return;const i=R.stops.findIndex(x=>x.y>R.pos+1);R.si=i<0?R.stops.length:i;}
function glide(y){y=Math.max(R.min,Math.min(R.max,y));if(R.playing){R.pos=y;R.anim=null;R.hold=0;syncStops();renderScroll();}else R.anim={a:R.pos,b:y,t0:performance.now()};wakeUi();}
function paraJump(d){const B=$("scrollTxt"),gy=parseFloat(B.style.paddingTop)||0;const ps=[...B.querySelectorAll("p")].map(c=>c.offsetTop-gy);
  let tg;if(d<0){mark();const b=ps.filter(y=>y<R.pos-5);tg=b.length?b[b.length-1]:R.min;}else{tg=ps.find(y=>y>R.pos+5);if(tg==null)tg=R.max;}glide(tg);}

function parseOpts(x){try{const a=x.indexOf("{"),b=x.lastIndexOf("}");if(a>=0&&b>a){const j=JSON.parse(x.slice(a,b+1));if(Array.isArray(j.options))return {options:j.options,names:j.names||[]};}}catch(e){}

    goB.addEventListener("click",async()=>{if(!isDirect(who)&&aiList().length)who=aiList()[0];
      const prompt="انت تساعد مقدّم يوتيوب عراقي عنده صعوبة بالنطق، يقرا من الملقّن جملة جملة.\nالجملة: «"+s.t+"»\n"+(SENT[i-1]?"الي قبلها: «"+SENT[i-1].t+"»\n":"")+(SENT[i+1]?"الي بعدها: «"+SENT[i+1].t+"»\n":"")+
        "اكتب 3 طرق أسهل للنطق لنفس الجملة، بنفس لغة ولهجة الجملة، بنفس المعنى والمعلومة والأرقام:\n1) نفس الجملة بكلمات أسهل وأقصر.\n2) أقصر ما يمكن.\n3) إذا بيها اسم أو كلمة أجنبية صعبة، عوّضها بوصف بسيط (مثل: هذا الرسام، الشركة). إذا ماكو، خليها طريقة ثالثة سهلة.\n"+
        "تجنب الكلمات الطويلة والحروف المتلاصقة. لا تستعمل: "+HARD.map(h=>h[0]).join("، ")+"\nوطلّع الأسماء أو الكلمات الصعبة بالجملة نفسها، لكل وحدة: w = الكلمة مثل ما مكتوبة بالضبط، s = نطقها مقطّع بالحروف العربية ومفصول بـ · (مثل: ليو·نار·دو).\n"+

      if(!isDirect(who)){setupSheet(who,prompt,x=>{const r=parseOpts(x);if(!r.options.length)return false;pendingEasy=r;easySheet();return true;});return;}

  const g2=grp(B,t("selfWrite"));const ta=el("textarea","field");ta.value=s.t;ta.dir="auto";g2.append(ta);

const sf={on:false,stream:null,rec:null,chunks:[],t0:0,file:null,timer:0,mime:""};
const fl={url:null,v:null,starts:[],total:0,busy:false};
function camSheet(){openSheet(t("camTitle"),B=>{
  let g=grp(B,t("camHere"));g.append(el("p","note",t("camHereS")));const o=el("button","btn p w",t("openCam"));o.style.marginTop="8px";o.addEventListener("click",()=>{closeSheet();selfieOpen();});g.append(o);
  if(!CARD())return;

  const st=el("p","note"),v=fl.v||document.createElement("video");fl.v=v;v.playsInline=true;v.muted=true;v.setAttribute("playsinline","");v.setAttribute("autopictureinpicture","");v.controls=true;v.className="flPrev";v.hidden=!fl.url;if(fl.url&&v.src!==fl.url)v.src=fl.url;
  const row=el("div","chips");row.style.marginTop="8px";const mk=el("button","chip on",fl.url?t("reprep"):t("prep")),fly=el("button","chip",t("flyIt"));fly.hidden=!fl.url;row.append(mk,fly);g.append(row,v,st);
  mk.addEventListener("click",async()=>{if(fl.busy)return;fl.busy=true;mk.disabled=true;st.textContent=t("preparing",AR(0));
    try{await flBuild(p=>st.textContent=t("preparing",AR(p)));v.src=fl.url;v.hidden=false;fly.hidden=false;st.textContent=t("ready",mmss(fl.total));}catch(e){st.textContent=(e&&e.message)||"!";}fl.busy=false;mk.disabled=false;mk.textContent=t("reprep");});
  fly.addEventListener("click",flFloat);g.append(el("p","note",t("floatNote")));});}
function sfEl(){let o=$("selfie");if(o)o.remove();o=el("div");o.id="selfie";o.hidden=true;
  o.innerHTML='<video id="sfV" playsinline muted autoplay></video><div class="sfTop"><div id="sfTxt" dir="auto"></div><div class="sfBar"><i id="sfBarI"></i></div></div><div id="sfMsg"></div><div class="sfBot"><div class="sfRow"><button id="sfPrev"></button><button id="sfPause"></button><button id="sfNext"></button><button id="sfSm">A−</button><button id="sfBg">A+</button></div><div class="sfRow"><button id="sfClose"></button><button id="sfRec" class="sfRec"><i></i></button><span id="sfClock">00:00</span></div><div class="sfRow" id="sfSaveRow" hidden><button id="sfSave" class="sfSave"></button><button id="sfAgain"></button></div></div>';
  document.body.append(o);$("sfPrev").textContent=t("sfPrev");$("sfNext").textContent=t("sfNext");$("sfClose").textContent=t("sfClose");$("sfSave").textContent=t("sfSave");$("sfAgain").textContent=t("sfAgain");$("sfRec").setAttribute("aria-label","REC");
  $("sfClose").onclick=()=>selfieClose();$("sfRec").onclick=()=>sf.rec&&sf.rec.state==="recording"?selfieStop():selfieStart();
  $("sfPrev").onclick=()=>{if(CARD())prev();else glide(R.pos-R.lineH*2);selfieTick();};$("sfNext").onclick=()=>{if(CARD())next();else glide(R.pos+R.lineH*2);selfieTick();};
  $("sfPause").onclick=()=>{if(R.playing)pause();else{R.playing=true;setPlayUi();}selfieTick();};$("sfTxt").onclick=$("sfPause").onclick;
  $("sfSm").onclick=()=>{S.selfSize=Math.max(16,S.selfSize-2);save();selfieTick();};$("sfBg").onclick=()=>{S.selfSize=Math.min(72,S.selfSize+2);save();selfieTick();};
  $("sfSave").onclick=selfieSave;$("sfAgain").onclick=()=>{$("sfSaveRow").hidden=true;sf.file=null;sfMsg("");if(CARD())go(0,true);else{R.pos=R.min;renderScroll();}selfieTick();};return o;}
function sfMsg(x){const m=$("sfMsg");if(m)m.textContent=x||"";}
function curLine(){if(CARD())return (SENT[R.idx]||{}).t||"";const y=R.pos+(parseFloat($("scrollTxt").style.paddingTop)||0)+R.lineH*.5;
  for(const p of $("scrollTxt").querySelectorAll("p"))if(p.offsetTop+p.offsetHeight>=y)return p.textContent;return "";}
async function selfieOpen(){pause();const o=sfEl();o.hidden=false;sf.on=true;selfieTick();sfMsg(t("camOpening"));
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nocam");
    sf.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:1280},frameRate:{ideal:30}},audio:true});
    const v=$("sfV");v.srcObject=sf.stream;await v.play().catch(()=>{});sfMsg("");wakeOn();
  }catch(e){sfMsg(e&&e.name==="NotAllowedError"?t("camDenied"):t("camFail"));}}
function selfieTick(){if(!sf.on)return;const x=$("sfTxt");if(!x)return;const th=theme(),f=font(),tx=curLine();if(x.textContent!==tx)x.textContent=tx;
  x.style.fontSize=S.selfSize+"px";x.style.fontFamily='"'+f.css+'",system-ui';x.style.fontWeight=f.w[S.weight]||800;x.style.color=th.fg;x.parentNode.style.background=th.bg+"cc";
  $("sfBarI").style.width=(CARD()?Math.min(100,R.t/dur(R.idx)*100):frac()*100)+"%";$("sfPause").textContent=R.playing?t("sfPause"):t("sfPlay");}
function sfMime(){if(!window.MediaRecorder)return "";for(const m of ["video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm"])if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return "";}
function selfieStart(){if(!sf.stream){sfMsg(t("camNotOpen"));return;}if(!window.MediaRecorder){sfMsg(t("camNoRec"));return;}$("sfSaveRow").hidden=true;sf.file=null;let n=3;sfMsg(AR(n));
  const goRec=()=>{sfMsg("");sf.mime=sfMime();sf.chunks=[];try{sf.rec=new MediaRecorder(sf.stream,sf.mime?{mimeType:sf.mime,videoBitsPerSecond:8000000}:{});}catch(e){sf.rec=new MediaRecorder(sf.stream);}
    sf.rec.ondataavailable=e=>{if(e.data&&e.data.size)sf.chunks.push(e.data);};sf.rec.onstop=selfieDone;sf.rec.start(1000);sf.t0=performance.now();$("sfRec").classList.add("on");R.t=0;R.playing=true;setPlayUi();
    clearInterval(sf.timer);sf.timer=setInterval(()=>{$("sfClock").textContent=mmss((performance.now()-sf.t0)/1000);selfieTick();},400);selfieTick();};
  const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);goRec();}else sfMsg(AR(n));},800);}
function selfieStop(){if(sf.rec&&sf.rec.state!=="inactive")sf.rec.stop();pause();clearInterval(sf.timer);$("sfRec").classList.remove("on");selfieTick();}
function selfieDone(){const type=(sf.rec&&sf.rec.mimeType)||sf.mime||"video/mp4";const ext=/mp4/.test(type)?"mp4":"webm";const b=new Blob(sf.chunks,{type:type.split(";")[0]});const d=new Date(),p=n=>String(n).padStart(2,"0");
  sf.file=new File([b],"Noto-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+"."+ext,{type:b.type});sf.rec=null;$("sfSaveRow").hidden=false;sfMsg(t("camDone"));}
async function selfieSave(){if(!sf.file)return;try{if(navigator.canShare&&navigator.canShare({files:[sf.file]})){await navigator.share({files:[sf.file]});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(sf.file);a.download=sf.file.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
function selfieClose(force){if(!force&&sf.rec&&sf.rec.state==="recording"){if(!confirm(t("stillRec")))return;selfieStop();}
  if(sf.stream)sf.stream.getTracks().forEach(x=>x.stop());sf.stream=null;sf.on=false;pause();clearInterval(sf.timer);const o=$("selfie");if(o)o.hidden=true;showNow();}
function flWrap(ctx,x,maxW){const w=x.split(" "),L=[];let c="";for(const y of w){const z=c?c+" "+y:y;if(ctx.measureText(z).width>maxW&&c){L.push(c);c=y;}else c=z;}if(c)L.push(c);return L;}
function flDraw(ctx,W0,H0,x,frac,th,f,idx,n){ctx.fillStyle=th.bg;ctx.fillRect(0,0,W0,H0);ctx.direction="rtl";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=th.fg;
  let fs=Math.round(H0*.24),L;for(;;){ctx.font=(f.w[S.weight]||800)+" "+fs+'px "'+f.css+'",system-ui';L=flWrap(ctx,x,W0*.92);if(L.length*fs*1.35<=H0*.8||fs<=18)break;fs-=2;}
  const lh=fs*1.35,y0=H0*.45-(L.length-1)*lh/2;L.forEach((l,k)=>ctx.fillText(l,W0/2,y0+k*lh));
  ctx.fillStyle="rgba(128,128,128,.35)";ctx.fillRect(W0*.1,H0-18,W0*.8,6);ctx.fillStyle=frac>.8?"#f5a524":"#4d82ff";ctx.fillRect(W0*.9-W0*.8*frac,H0-18,W0*.8*frac,6);
  if(idx>=0){ctx.font="600 16px system-ui";ctx.globalAlpha=.5;ctx.textAlign="left";ctx.fillText((idx+1)+"/"+n,14,22);ctx.globalAlpha=1;}}
async function flBuild(onPct){
  if(!window.VideoEncoder||!window.VideoFrame)throw new Error(t("flNo"));
  if(!window.Mp4Muxer)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js";s.onload=ok;s.onerror=()=>no(new Error(t("flNet")));document.head.append(s);});
  const W0=960,H0=400,f=font(),th=theme();try{await document.fonts.load((f.w[S.weight]||800)+' 40px "'+f.css+'"',"اگچ");}catch(e){}
  let cfg=null,mux="avc";for(const [c,m] of [["avc1.42001f","avc"],["avc1.4d0028","avc"],["vp09.00.10.08","vp9"]]){const k={codec:c,width:W0,height:H0,bitrate:600000,framerate:4};if(m==="avc")k.avc={format:"avc"};try{if((await VideoEncoder.isConfigSupported(k)).supported){cfg=k;mux=m;break;}}catch(e){}}
  if(!cfg)throw new Error(t("flNo2"));
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:mux,width:W0,height:H0},fastStart:"in-memory"});
  let err=null;const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{err=e;}});enc.configure(cfg);
  const cv=document.createElement("canvas");cv.width=W0;cv.height=H0;const ctx=cv.getContext("2d");const step=.25,n=SENT.length,gap=S.gap?.8:0;let tt=0;fl.starts=[];
  const put=async(du,draw)=>{for(let k=0;k*step<du-1e-6;k++){const d=Math.min(step,du-k*step);draw(k*step/du);const fr=new VideoFrame(cv,{timestamp:Math.round(tt*1e6),duration:Math.round(d*1e6)});enc.encode(fr,{keyFrame:k===0||k%40===0});fr.close();tt+=d;if(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));if(err)throw err;}};
  for(let c=3;c>=1;c--)await put(1,()=>flDraw(ctx,W0,H0,t("rdy",c),0,th,f,-1,n));
  for(let i=0;i<n;i++){fl.starts.push(tt);await put(dur(i),fr=>flDraw(ctx,W0,H0,SENT[i].t,fr,th,f,i,n));if(gap)await put(gap,()=>{ctx.fillStyle=th.bg;ctx.fillRect(0,0,W0,H0);});onPct&&onPct(Math.round((i+1)/n*100));}
  await put(2,()=>flDraw(ctx,W0,H0,t("flEnd"),1,th,f,n-1,n));await enc.flush();enc.close();muxer.finalize();fl.total=tt;if(fl.url)URL.revokeObjectURL(fl.url);fl.url=URL.createObjectURL(new Blob([muxer.target.buffer],{type:"video/mp4"}));return fl.url;}
async function flFloat(){const v=fl.v;if(!v||!fl.url)return;try{v.currentTime=Math.max(0,(fl.starts[R.idx]||3)-3);}catch(e){}try{await v.play();}catch(e){}
  try{if(document.pictureInPictureEnabled&&v.requestPictureInPicture){await v.requestPictureInPicture();return;}}catch(e){}
  try{if(v.webkitSupportsPresentationMode&&v.webkitSupportsPresentationMode("picture-in-picture")){v.webkitSetPresentationMode("picture-in-picture");return;}}catch(e){}toast(t("flFly"));}
