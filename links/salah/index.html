<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مواقيت الصلاة · توركو</title>
<meta name="theme-color" content="#fbf7ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101c22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الصلاة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#2a2f2b;--mut:#7b8079;--line:#e6dfd0;--hot:#c8553d;--sun:#e9a23b;--arc:#e0d6c2}
@media(prefers-color-scheme:dark){:root{--bg:#101c22;--card:#172730;--ink:#eef1ea;--mut:#93a09c;--line:#243741;--hot:#f0a35e;--sun:#f2c14e;--arc:#2a3f4a}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;
 padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 84px);max-width:520px;margin:auto}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--mut)}
header b{color:var(--ink);font-size:17px}
section{display:none}section.on{display:block}
svg.arc{display:block;width:100%;max-width:360px;margin:14px auto 0}
.next{text-align:center;margin-top:-34%;padding-bottom:6%}
.next span{font-size:22px;font-weight:700;display:block}
.next b{font-size:44px;color:var(--hot);font-weight:700;line-height:1.1}
ul{list-style:none;padding:0;margin-top:10px}
li{display:flex;justify-content:space-between;align-items:center;font-size:23px;padding:13px 6px;border-bottom:1px solid var(--line)}
li.s{color:var(--mut);font-size:19px}
li.hot{color:var(--hot);font-weight:700}
.src{font-size:13px;color:var(--mut);text-align:center;margin-top:16px;line-height:1.7}
.mh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}
.mh b{font-size:20px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
th{color:var(--mut);font-weight:500;padding:6px 0;font-size:13px}
td{padding:7px 0;border-top:1px solid var(--line)}
tr.td td{color:var(--hot);font-weight:700}
tr.fr td:first-child{color:var(--sun);font-weight:700}
.q{text-align:center;margin-top:22px}
.q svg{width:260px;height:260px;display:block;margin:0 auto 14px}
.q p{font-size:17px;line-height:1.9}
.q small{color:var(--mut);font-size:14px;display:block;margin-top:10px;line-height:1.7}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 0 12px;font-size:16px;color:var(--mut);text-decoration:none}
nav a.on{color:var(--hot);font-weight:700}
</style>
</head>
<body>
<header><b>توركو</b><span id="date"></span></header>

<section id="today" class="on">
 <svg class="arc" viewBox="0 0 360 215" aria-hidden="true">
  <path d="M20 190A160 160 0 0 1 340 190" fill="none" stroke="var(--arc)" stroke-width="6" stroke-linecap="round"/>
  <path id="prog" fill="none" stroke="var(--sun)" stroke-width="6" stroke-linecap="round"/>
  <line x1="0" y1="190" x2="360" y2="190" stroke="var(--line)" stroke-width="2"/>
  <g id="dots"></g>
  <circle id="sun" r="15" fill="var(--sun)"/>
 </svg>
 <div class="next"><span id="nname"></span><b class="n" id="cd"></b></div>
 <ul id="list"></ul>
 <p class="src" id="src"></p>
</section>

<section id="month">
 <div class="mh"><button id="prev">السابق</button><b id="mname"></b><button id="nxt">التالي</button></div>
 <table><thead><tr><th>اليوم</th><th>الفجر</th><th>الشروق</th><th>الظهر</th><th>العصر</th><th>المغرب</th><th>العشاء</th></tr></thead><tbody id="mb"></tbody></table>
</section>

<section id="qibla">
 <div class="q">
  <svg viewBox="-130 -130 260 260">
   <g id="dial">
    <circle r="120" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text y="-96" text-anchor="middle" font-size="17" fill="var(--mut)">شمال</text>
    <text y="108" text-anchor="middle" font-size="17" fill="var(--mut)">جنوب</text>
    <text x="100" y="6" text-anchor="middle" font-size="17" fill="var(--mut)">شرق</text>
    <text x="-100" y="6" text-anchor="middle" font-size="17" fill="var(--mut)">غرب</text>
    <g id="needle"><path d="M0 -84L13 0H-13Z" fill="var(--hot)"/><rect x="-11" y="-112" width="22" height="22" rx="3" fill="var(--ink)"/><rect x="-11" y="-106" width="22" height="3" fill="var(--sun)"/></g>
    <circle r="6" fill="var(--ink)"/>
   </g>
  </svg>
  <p id="qtext"></p>
  <button id="qbtn">شغّل البوصلة</button>
  <small id="qhelp">بدون بوصلة: القبلة بتوركو باتجاه الجنوب الشرقي، يعني بين الجنوب والشرق وأقرب للجنوب.</small>
 </div>
</section>

<nav><a href="#today" class="on">اليوم</a><a href="#month">الشهر</a><a href="#qibla">القبلة</a></nav>

<script src="data.js"></script>
<script>
(function(){
var D=window.SALAH, $=function(i){return document.getElementById(i)};
var NAMES=['الفجر','الشروق','الظهر','العصر','المغرب','العشاء'];
var GM=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
var CUM=[0,31,59,90,120,151,181,212,243,273,304,334];
var TZ='Europe/Helsinki', fmt=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});

// ساعة فنلندا مهما كان توقيت الجهاز
function wall(ms){var o={};fmt.formatToParts(new Date(ms)).forEach(function(p){o[p.type]=+p.value});return o}
// كم دقيقة يزيد التوقيت الصيفي بهذا اليوم (0 أو 60)
function dst(y,m,d){var u=Date.UTC(y,m-1,d,10),w=wall(u);return (w.hour-10)*60-120}
function idx(m,d){if(m==2&&d==29)d=28;return CUM[m-1]+d-1}
// أوقات يوم معين بالدقايق من نص الليل
function times(y,m,d){var a=dst(y,m,d);return D.t[idx(m,d)].map(function(v){return v+a})}
function hm(v){v=((v%1440)+1440)%1440;var h=Math.floor(v/60),mi=v%60;return h+':'+(mi<10?'0':'')+mi}
function shift(y,m,d,n){var t=new Date(Date.UTC(y,m-1,d+n));return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()]}
function p2(n){return (n<10?'0':'')+n}

function hijri(y,m,d){
 if(y==D.y){var i=idx(m,d),mo=6,yr=1447;           // 1 كانون الثاني 2026 = 12 رجب 1447 بجدول المسجد
  for(var k=1;k<=i;k++)if(D.h[k]<D.h[k-1]){mo++;if(mo>11){mo=0;yr++}}
  return D.h[i]+' '+HM[mo]+' '+yr}
 try{var o={};new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'})
  .formatToParts(new Date(Date.UTC(y,m-1,d,12))).forEach(function(p){o[p.type]=parseInt(p.value)});
  return o.day+' '+HM[o.month-1]+' '+o.year}catch(e){return ''}
}

var q=new URLSearchParams(location.search).get('now');           // للتجربة: ?now=2026-06-21T23:30
var skew=q?Date.UTC.apply(null,q.split(/\D/).map(function(v,i){return i==1?v-1:+v}))-Date.now():0;
function now(){if(!q)return wall(Date.now());var t=new Date(Date.now()+skew);
 return {year:t.getUTCFullYear(),month:t.getUTCMonth()+1,day:t.getUTCDate(),hour:t.getUTCHours(),minute:t.getUTCMinutes(),second:t.getUTCSeconds()}}

var lastKey='';
function tick(){
 var w=now(), sec=w.hour*3600+w.minute*60+w.second, T=times(w.year,w.month,w.day);
 // أحداث أمس واليوم وباچر، حتى عشاء الصيف الي يعبر نص الليل ينحسب صح
 var ev=[];[-1,0,1].forEach(function(n){var s=shift(w.year,w.month,w.day,n);
  times(s[0],s[1],s[2]).forEach(function(v,i){if(i!=1)ev.push({i:i,s:(v+n*1440)*60,today:n==0})})});
 var nx=ev.filter(function(e){return e.s>sec})[0], left=nx.s-sec;
 $('nname').textContent=NAMES[nx.i]+' بعد';
 $('cd').textContent=Math.floor(left/3600)+':'+p2(Math.floor(left/60)%60)+':'+p2(left%60);

 // الشمس على القوس
 var f=(sec/60-T[1])/(T[4]-T[1]), day=f>=0&&f<=1;
 function pt(x){var a=Math.PI*x;return [180-160*Math.cos(a),190-160*Math.sin(a)]}
 var s=day?pt(f):[f<0?20:340,203];
 $('sun').setAttribute('cx',s[0]);$('sun').setAttribute('cy',s[1]);
 $('sun').setAttribute('fill',day?'var(--sun)':'var(--mut)');$('sun').setAttribute('r',day?15:9);
 $('prog').setAttribute('d',day?'M20 190A160 160 0 0 1 '+s[0].toFixed(1)+' '+s[1].toFixed(1):'');

 var key=[w.year,w.month,w.day,nx.i,nx.today].join();
 if(key==lastKey)return; lastKey=key;
 var wd=new Date(Date.UTC(w.year,w.month-1,w.day)).getUTCDay();
 $('date').textContent=WD[wd]+' '+w.day+' '+GM[w.month-1]+' · '+hijri(w.year,w.month,w.day);
 $('list').innerHTML=T.map(function(v,i){return '<li class="'+(i==1?'s':'')+(nx.today&&nx.i==i?' hot':'')+'"><span>'+NAMES[i]+'</span><span class="n">'+hm(v)+'</span></li>'}).join('');
 $('dots').innerHTML=[1,2,3,4].map(function(i){var p=pt((T[i]-T[1])/(T[4]-T[1]));
  return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="7" fill="'+(nx.today&&nx.i==i?'var(--hot)':'var(--mut)')+'"/>'}).join('');
 $('src').textContent='الأوقات من جدول مسجد توركو (الجمعية الإسلامية بتوركو)'+(w.year==D.y?'':'، محسوبة على جدول سنة '+D.y+' وممكن تفرق دقيقة');
}
tick();setInterval(tick,1000);

// جدول الشهر
var w0=now(), my=w0.year, mm=w0.month;
function month(){
 $('mname').textContent=GM[mm-1]+' '+my;
 var n=new Date(Date.UTC(my,mm,0)).getUTCDate(), h='', t=now();
 for(var d=1;d<=n;d++){var T=times(my,mm,d), fr=new Date(Date.UTC(my,mm-1,d)).getUTCDay()==5;
  h+='<tr class="'+(t.year==my&&t.month==mm&&t.day==d?'td':'')+(fr?' fr':'')+'"><td>'+d+'</td>'+T.map(function(v){return '<td class="n">'+hm(v)+'</td>'}).join('')+'</tr>'}
 $('mb').innerHTML=h;
}
$('prev').onclick=function(){if(--mm<1){mm=12;my--}month()};
$('nxt').onclick=function(){if(++mm>12){mm=1;my++}month()};
month();

// القبلة: الزاوية من الشمال باتجاه عقارب الساعة، من مسجد توركو للكعبة
var R=Math.PI/180, la=60.4545*R, lo=22.2725*R, kla=21.4225*R, klo=39.8262*R;
var qb=(Math.atan2(Math.sin(klo-lo),Math.cos(la)*Math.tan(kla)-Math.sin(la)*Math.cos(klo-lo))/R+360)%360;
$('needle').setAttribute('transform','rotate('+qb.toFixed(1)+')');
$('qtext').innerHTML='القبلة على <b class="n">'+Math.round(qb)+'°</b> من الشمال';
function turn(e){var hd=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?360-e.alpha:null);
 if(hd==null)return;$('dial').setAttribute('transform','rotate('+(-hd).toFixed(1)+')');
 var off=Math.abs(((qb-hd+540)%360)-180);
 $('qhelp').textContent=off<4?'تمام، هسه انت باتجاه القبلة.':'دوّر الجهاز لحد ما السهم الأحمر يصير لفوگ.'}
$('qbtn').onclick=function(){
 var go=function(){addEventListener('deviceorientationabsolute',turn);addEventListener('deviceorientation',turn);$('qbtn').style.display='none';
  $('qhelp').textContent='خلّي الجهاز مسطّح وبعيد عن المعادن، ودوّره لحد ما السهم الأحمر يصير لفوگ.'};
 var E=window.DeviceOrientationEvent;
 if(!E){$('qhelp').textContent='هذا الجهاز ما بيه بوصلة. القبلة بتوركو باتجاه الجنوب الشرقي.';return}
 if(E.requestPermission)E.requestPermission().then(function(r){if(r=='granted')go()}).catch(function(){});else go()};

// التنقل بين الصفحات الثلاث
function show(){var id=(location.hash||'#today').slice(1);if(!$(id))id='today';
 document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.id==id)});
 document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')=='#'+id)})}
addEventListener('hashchange',show);show();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
