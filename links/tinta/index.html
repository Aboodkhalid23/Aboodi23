<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tintå">

<title>Tintå Reseptit</title>

<style>
/* Layout: one dark column, list view and recipe view swap in place */
:root{
  --bg:#0E0D0C; --surface:#1C1A18; --line:#2E2A26; --line-soft:#221F1C;
  --fg:#F3EEE6; --muted:#A39B90; --accent:#D08A50; --accent-soft:#E6A774; --stripe:#24211E;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:env(safe-area-inset-top,0px) 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:20px 8px;gap:12px}
.logo{width:104px;height:auto;display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{min-width:46px;height:36px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
h1.big{margin:16px 0 0;font-family:var(--serif);font-weight:500;font-size:44px;line-height:1;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;margin-top:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);font:16px var(--sans)}
.search input::placeholder{color:#7D766C}
.chips{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.label{margin:28px 0 4px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border:0;border-bottom:1px solid var(--line-soft);background:transparent;text-align:left;width:100%}
.thumb{width:60px;height:60px;flex:none;border-radius:12px;background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--stripe) 8px 16px)}
.row .t{flex:1;min-width:0}
.row .n{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.row .m{font-size:13px;color:var(--muted);margin-top:3px}
.empty{padding:32px 0;color:var(--muted);text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;font-family:var(--sans)}
/* recipe */
.hero{position:relative;height:240px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--stripe) 10px 20px);display:flex;align-items:center;justify-content:center;color:#8C847A;font-size:13px}
.back{position:absolute;top:16px;left:max(16px, env(safe-area-inset-left, 0px));width:44px;height:44px;border-radius:999px;border:0;background:rgba(14,13,12,.8);display:flex;align-items:center;justify-content:center}
.hero .lang{position:absolute;top:16px;right:max(16px, env(safe-area-inset-right, 0px));background:rgba(14,13,12,.8);border-color:transparent}
.title{margin:24px 0 0;font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.05;text-wrap:balance}
.other{color:var(--muted);font-size:14px;margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:13px}
.pill.warn{background:transparent;border:1px solid var(--accent);color:var(--accent-soft)}
.scale{margin-top:24px;padding:14px 16px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px}
.scale .k{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.scale .h{font-size:13px;color:var(--muted);margin-top:2px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:22px;line-height:1}
.step button.plus{border:0;background:var(--accent);color:var(--bg)}
.step output{min-width:48px;text-align:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.quick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-soft)}
h2.sec{margin:30px 0 6px;font-family:var(--serif);font-weight:600;font-size:28px}
.ing{display:flex;align-items:center;gap:14px;min-height:50px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.ing input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.ing .name{flex:1;min-width:0}
.ing .qty{font-weight:600;color:var(--accent-soft);font-variant-numeric:tabular-nums;text-align:right}
.ing input:checked ~ .name,.ing input:checked ~ .qty{color:#6E675E;text-decoration:line-through}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px}
ol.steps li{display:flex;gap:14px}
ol.steps .num{flex:none;width:30px;height:30px;border-radius:999px;border:1px solid var(--accent);color:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
ol.steps .txt{line-height:1.55;color:#E4DDD3;min-width:0}
.note{margin-top:32px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5}
.ing .name{flex:1;min-width:0;cursor:pointer}
button.qty{border:1px solid var(--line);background:transparent;border-radius:10px;min-height:40px;padding:0 10px;font:600 15px var(--sans);color:var(--accent-soft)}
.gen{margin:0 0 12px;padding:8px 12px;border-left:0;border-radius:10px;background:#2A2118;color:var(--accent-soft);font-size:13px;line-height:1.45}
.tip{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.fab{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));width:58px;height:58px;border-radius:999px;border:0;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:20}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));max-width:560px;margin:0 auto}
.sheet h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:600}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:20px}
.disp{margin-top:12px;padding:12px 16px;border-radius:14px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.disp .e{min-height:18px;color:var(--muted);font-size:14px}
.disp .v{font-size:40px;font-weight:600;overflow-x:auto;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.keys button{height:58px;border-radius:14px;border:0;background:#2A2724;font-size:24px;font-weight:500}
.keys .o{background:#3A2A1C;color:var(--accent-soft)}
.keys .eq{background:var(--accent);color:var(--bg)}
.use{width:100%;height:52px;margin-top:10px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent-soft);font-weight:600;font-size:16px}
.hrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.hrow input{flex:1;min-width:0;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:600 26px var(--sans);padding:0 14px}
.hrow span{font-size:18px;color:var(--muted)}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>

 {t:['Vegaaninen risottoliemi','Vegan risotto stock'],i:[[2,'l','Kaurakerma','Oat cream'],[1,'l','Valkoviini','White wine'],[300,'g','Eleplant','Eleplant (plant butter)'],[1,'l','Kasvisliemi','Vegetable stock']],gen:1,s:[["Kiehauta kaikki aineet yhdessä.","Bring everything to the boil together."],["Pidä kuumana koko risoton keittämisen ajan.","Keep it hot while cooking the risotto."]]},

{id:'kantarellikeitto',c:'keitto',v:1,n:['Kantarellikeitto (vegaaninen)','Chanterelle soup (vegan)'],f:'18ThfibeL5wSjh-F7JhpCUcshaFydxzBX',p:[{i:[[500,'g','Keltasipuli','Yellow onion'],[1.7,'kg','Valutettu kantarelli','Drained chanterelles'],[500,'g','Eleplant','Eleplant (plant butter)'],[50,'g','Valkosipuli','Garlic'],[3,'l','Kaurakerma','Oat cream'],[1.5,'l','Vesi','Water'],[3,'dl','Kantarellifondi','Chanterelle fond'],[5,'rkl','BBQ mesquite myllystä','BBQ mesquite seasoning (grinder)'],[2,'g','Soijalesitiini','Soy lecithin']],s:[['Freesaa sipuli, kantarellit, Eleplant ja valkosipuli rauhassa noin 5 minuuttia, kunnes ne alkavat pehmetä ja ottaa hiukan väriä. HUOM: älä ruskista!','Gently sauté the onion, chanterelles, Eleplant and garlic for about 5 minutes until they soften and take a little colour. NOTE: do not brown!'],['Lisää kaurakerma, vesi, kantarellifondi ja mesquite.','Add the oat cream, water, chanterelle fond and mesquite.'],['Keitä ylös ja anna porista hetki. Ei tarvitse keittää kasaan.','Bring to the boil and let it bubble for a moment. No need to reduce.'],['Aja blenderissä sileäksi.','Blend until smooth.'],['Poraa joukkoon soijalesitiini ja jäähdytä.','Blend in the soy lecithin and cool.']]}]},

{id:'palsternakka-omenapyre',c:'lisuke',n:['Palsternakka-omenapyree','Parsnip and apple purée'],f:'1LyyeqDNaldsuQskyRHR2KCQorkXEtTwv',p:[{i:[[400,'g','Sipuli','Onion'],[2,'kg','Palsternakka','Parsnip'],[200,'g','Voi (freesaukseen)','Butter (for sautéing)'],[300,'g','Voi (loppuun)','Butter (to finish)'],[3,'dl','Valkoviini','White wine'],[400,'g','Granny Smith -omena, kuorittu','Granny Smith apple, peeled'],[1.75,'l','Kerma','Cream'],[1,'l','Kasvisliemi','Vegetable stock'],[null,'','Kuohukermaa ja suolaa','Whipping cream and salt']],s:[['Freesaa sipulit 200 g:ssa voita.','Sauté the onions in 200 g of butter.'],['Lisää kuutioidut palsternakat ja freesaa. ÄLÄ RUSKISTA!','Add the diced parsnips and sauté. DO NOT BROWN!'],['Lisää valkoviini ja jatka freesaamista, kunnes kasvikset pehmenevät hiukan.','Add the white wine and keep sautéing until the vegetables soften a little.'],['Lisää kerma ja kasvisliemi. Hauduta hiljalleen kannen alla, kunnes palsternakat ovat melkein kypsiä.','Add the cream and stock. Simmer gently with a lid until the parsnips are almost cooked.'],['Lisää omena ja jatka hauduttamista, kunnes kaikki on kypsää ja pehmeää.','Add the apple and keep simmering until everything is soft.'],['Valuta liemi pois. Aja palsternakat blenderillä tasaiseksi lisäten tuoretta kuohukermaa vähitellen (näin tulee parempi väri), kunnes pyree on silkkisen sileä.','Drain off the liquid. Blend the parsnips smooth, adding fresh whipping cream little by little (this gives a better colour), until silky smooth.'],['Lisää loput 300 g voita ja MAUSTA suolalla!','Add the remaining 300 g of butter and SEASON with salt!']]}]},
{id:'simpukkaliemi-porre',c:'liemi',n:['Simpukkaliemi & pörre','Mussel broth & pörre'],f:'1cJd_wO08iRYBfuUbrArfeZhnX5gRcHU8',p:[
 {t:['Liemi','Broth'],i:[[40,'kpl','Valkosipuli','Garlic'],[6,'kpl','Salottisipuli','Shallots'],[5,'kpl','Fenkoli (isoa, tai 7 pientä)','Fennel (large, or 7 small)'],[500,'g','Voi','Butter'],[3,'dl','Sitruunamehu','Lemon juice'],[2,'l','Valkoviini','White wine'],[2,'l','Kerma','Cream'],[5,'rkl','Suola','Salt'],[3,'rkl','Mustapippuri myllystä','Black pepper, freshly ground'],[1,'pss','Sahrami','Saffron']],s:[['Freesaa sipulit ja fenkoli voissa. ÄLÄ RUSKISTA!!!','Sauté the onions and fennel in butter. DO NOT BROWN!!!'],['Lisää valkoviini ja hiehauta. Lisää kerma ja keitä hetki, jotta kasvikset kypsyvät.','Add the wine and simmer. Add the cream and cook briefly so the vegetables cook through.'],['Anna jäähtyä hieman ja lisää sitruunamehu, suola ja pippuri.','Let it cool a little and add the lemon juice, salt and pepper.'],['KEITÄ AINA 2X OHJE JA OTA 1/2 TALTEEN PÖRREÄ VARTEN. Siivilöi pörren liemi ja säilytä erikseen. Laita sihdatut sattumat takaisin loppuliemeen.','ALWAYS MAKE A DOUBLE BATCH AND KEEP 1/2 FOR THE PÖRRE. Strain the pörre broth and store it separately. Put the strained solids back into the rest of the broth.'],['Lisää sahrami vasta, kun olet ottanut pörren liemen talteen.','Add the saffron only after you have taken out the pörre broth.']]},
 {t:['Pörre','Pörre'],i:[[4,'dl','Pörrepohja (liemi)','Pörre base (broth)'],[4,'dl','Kerma','Cream'],[100,'g','Voi','Butter'],[2,'tl','Sokeri','Sugar'],[1,'tl','Suola','Salt'],[null,'','Xantaani (määrä tarkentuu)','Xanthan (amount to be confirmed)']],s:[['Kuumenna kerma ja pörre kiehuvaksi.','Heat the cream and pörre to a boil.'],['Lisää voi ja sokeri ja poraa.','Add the butter and sugar and blend.'],['Poraa joukkoon vielä hieman xantaania: saadaan parempi rakenne ja ilmaa kastikkeeseen.','Blend in a little xanthan: better texture and more air in the sauce.']]}]},
{id:'sitruunadippi',c:'kastike',n:['Sitruunadippi','Lemon dip'],f:'1wdEvMF7xzWUoK09Xl1G10O1Jae4_dKLb',p:[{i:[[18,'kpl','Sitruunankuori (microplane)','Lemon zest (microplane)'],[3,'dl','Sitruunamehu','Lemon juice'],[20,'g','Kurkuma','Turmeric'],[2,'tl','Mustapippuri myllystä','Black pepper, freshly ground'],[2,'tl','Suola','Salt'],[90,'g','Soseutettu valkosipuli','Puréed garlic'],[3,'l','Majoneesi','Mayonnaise'],[1.5,'l','Jugurtti','Yogurt']],s:[['Sekoita kuori, mehu, kurkuma, pippuri ja suola keskenään ja anna liueta rauhassa. Näin dippiin tulee parempi väri!','Mix the zest, juice, turmeric, pepper and salt and let it dissolve. This gives the dip a better colour!'],['Lisää valkosipuli, majoneesi ja jugurtti ja sekoita.','Add the garlic, mayonnaise and yogurt and mix.']]}]},

 {t:['Porkkanat','Carrots'],i:[[null,'','Porkkanat','Carrots'],[null,'','Oliiviöljyä ronskisti','Plenty of olive oil'],[5,'rkl','Vaahterasiirappi','Maple syrup'],[null,'','Suolaa ja mustapippuria myllystä','Salt and freshly ground black pepper'],[8,'kpl','Valkosipulinkynsi, murskattu','Garlic cloves, crushed'],[0.5,'dl','Hakattu timjami','Chopped thyme']],s:[['Leikkaa porkkanat pitkiksi lohkoiksi tai puolikkaiksi koosta riippuen.','Cut the carrots lengthwise into wedges or halves depending on size.'],['Pakissa ei saa olla liikaa porkkanaa: vain yksi kerros.','Don’t overfill the tray: one layer only.'],['Lisää ronskisti oliiviöljyä ja pyöritä niin, että kaikki kiiltää kunnolla.','Add plenty of olive oil and toss until everything shines.'],['Lisää vaahterasiirappi, suola, pippuri, valkosipuli ja timjami. Sekoita kunnolla.','Add the maple syrup, salt, pepper, garlic and thyme. Mix well.'],['Paista uunissa 180 °C välillä sekoittaen, niin pinnat eivät nahistu ja kiilto säilyy.','Roast at 180 °C, stirring now and then so the surface doesn’t dry out and stays glossy.'],['Valmis porkkana ei ole läpikypsä eikä liian kova, vaan sopivan napakka. Paistoaika vaihtelee.','A finished carrot is not soft all the way through and not too hard, just firm. Roasting time varies.'],['Liilat porkkanat kypsennetään ja säilytetään erikseen!!','Purple carrots are roasted and stored separately!!']]},

(function(){
  var T = {
    fi:{title:'Reseptit',search:'Hae: pesto, voi, kantarelli…',all:'Kaikki',recipes:'reseptiä',results:'Tulokset',none:'Ei reseptejä haulla',
        batch:'Määrä',auto:'Ainekset lasketaan itse',ingredients:'Ainekset',method:'Valmistus',back:'Takaisin',
        nomethod:'Paperissa ei ole kirjoitettua valmistusohjetta.',original:'Näytä alkuperäinen paperi',minus:'Vähemmän',plus:'Enemmän',vegan:'vegaani',parts:'osaa',
        foot:'Reseptit luettu keittiön paperikansiosta. Jos jokin näyttää väärältä, tarkista alkuperäinen paperi.',
        have:'Minulla on',havehint:'Reseptissä {q}. Kirjoita, paljonko sinulla on, niin kaikki muut määrät lasketaan sen mukaan.',haveok:'Laske',
        calc:'Laskin',gen:'Paperissa ei ollut ohjetta, joten tämä on lisätty. Tarkista keittiömestarilta.',calcuse:'Käytä määränä',tiphave:'Napauta määrää: laske kaikki sen mukaan, mitä sinulla on.'},
    en:{title:'Recipes',search:'Search: pesto, butter, chanterelle…',all:'All',recipes:'recipes',results:'Results',none:'No recipes for',
        batch:'Batch',auto:'Amounts update automatically',ingredients:'Ingredients',method:'Method',back:'Back',
        nomethod:'No method is written on the paper.',original:'Show original paper',minus:'Less',plus:'More',vegan:'vegan',parts:'parts',
        foot:'Recipes read from the kitchen binder. If something looks wrong, check the original paper.',
        have:'I have',havehint:'The recipe uses {q}. Type how much you have and every other amount is worked out from it.',haveok:'Calculate',
        calc:'Calculator',gen:'The paper had no method, so this was added. Check with the head chef.',calcuse:'Use as batch',tiphave:'Tap an amount to scale everything to what you have.'}
  };
  var CATS = {
    kastike:['Kastikkeet ja dipit','Sauces & dips'], majo:['Majoneesit','Mayos'], oljy:['Öljyt ja vinegretit','Oils & dressings'],
    pesto:['Pestot','Pestos'], voi:['Voit','Butters'], liemi:['Liemet','Stocks'], keitto:['Keitot','Soups'], pohja:['Pohjat','Bases'],
    lisuke:['Lisukkeet ja risotot','Sides & risottos'], mari:['Marinadit','Marinades'], sailyke:['Hillot, chutneyt ja pikkelit','Jams, chutneys & pickles'],
    mauste:['Rapeat ja mausteet','Crunch & seasonings'], jalki:['Jälkiruoat','Desserts']
  };
  var U = {g:['g','g'],kg:['kg','kg'],ml:['ml','ml'],cl:['cl','cl'],dl:['dl','dl'],l:['l','l'],tl:['tl','tsp'],rkl:['rkl','tbsp'],kpl:['kpl','pcs'],
    prk:['prk','tub'],pss:['pss','bag'],pnt:['nippu','bunch'],rss:['rasia','box'],tlk:['tlk','can'],levy:['levyä','sheets'],tuubi:['tuubia','tubes'],osa:['osa','part']};

  var lang = 'fi', cat = 'all', cur = null, mult = 1;
  try{ var s = localStorage.getItem('tinta-lang'); if(s==='en'||s==='fi') lang = s; }catch(e){}
  var L = function(){ return lang==='fi' ? 0 : 1; };

  var $ = function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

  function num(r){
    var v = r>=100 ? Math.round(r) : r>=10 ? Math.round(r*10)/10 : Math.round(r*100)/100;
    return String(v).replace('.', lang==='fi' ? ',' : '.');
  }
  function fmt(q,u){
    if(q===null) return '';
    q = q*mult;
    if(u==='g' && q>=1000){q=q/1000;u='kg'}
    else if(u==='kg' && q<1){q=q*1000;u='g'}
    else if(u==='dl' && q>=10){q=q/10;u='l'}
    else if(u==='l' && q<1){q=q*10;u='dl'}
    else if(u==='ml' && q>=1000){q=q/1000;u='l'}
    var unit = U[u] ? U[u][L()] : u;
    if(u==='osa' && q!==1) unit = lang==='fi' ? 'osaa' : 'parts';
    if(u==='pnt' && q!==1) unit = lang==='fi' ? 'nippua' : 'bunches';
    return num(q)+' '+unit;
  }

  function setLang(l){
    lang = l;
    try{localStorage.setItem('tinta-lang',l)}catch(e){}
    document.documentElement.lang = l;
    render();
  }
  function langButtons(){
    document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.lang===lang))});
  }

  function renderHome(){
    var t = T[lang], i = L();
    document.querySelectorAll('#home [data-t]').forEach(function(el){el.textContent = t[el.dataset.t]});
    $('q').placeholder = t.search; $('q').setAttribute('aria-label', t.search);
    $('count').textContent = R.length+' '+t.recipes;
    var keys = ['all'].concat(Object.keys(CATS).filter(function(k){return R.some(function(r){return r.c===k})}));
    $('chips').innerHTML = keys.map(function(k){
      return '<button type="button" class="chip" data-cat="'+k+'" aria-pressed="'+(k===cat)+'">'+esc(k==='all'?t.all:CATS[k][i])+'</button>';
    }).join('');
    var q = norm($('q').value.trim());
    var hits = R.filter(function(r){
      if(cat!=='all' && r.c!==cat) return false;
      if(!q) return true;
      var parts = [r.n[0], r.n[1]];
      r.p.forEach(function(p){ if(p.t) parts.push(p.t[0], p.t[1]); p.i.forEach(function(x){parts.push(x[2], x[3])}); });
      return norm(parts.join(' ')).indexOf(q)>-1;
    }).sort(function(a,b){ return a.n[i].localeCompare(b.n[i], lang); });
    $('listlabel').textContent = q ? t.results+' ('+hits.length+')' : (cat==='all' ? t.all : CATS[cat][i]);
    $('list').innerHTML = hits.length ? hits.map(function(r){
      var meta = CATS[r.c][i] + (r.p.length>1 ? ' · '+r.p.length+' '+t.parts : '');
      return '<button type="button" class="row" data-open="'+r.id+'"><div class="t"><div class="n">'+esc(r.n[i])+
        (r.v?'<span class="tag">'+t.vegan+'</span>':'')+'</div><div class="m">'+esc(r.n[1-i])+' · '+esc(meta)+'</div></div>'+
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E675E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>';
    }).join('') : '<p class="empty">'+esc(t.none)+' “'+esc($('q').value)+'”</p>';
  }

  function renderRecipe(){
    var r = cur, t = T[lang], i = L();
    var checked = {};
    document.querySelectorAll('#recipe .ing input').forEach(function(c){checked[c.id]=c.checked});
    var html =
      '<div class="bar"><button type="button" class="back" id="back" aria-label="'+t.back+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>'+
      '<div class="lang" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi">FI</button><button type="button" data-lang="en">EN</button></div></div>'+
      '<h1 class="title">'+esc(r.n[i])+'</h1><div class="other">'+esc(r.n[1-i])+'</div>'+
      '<div class="pills"><span class="pill">'+esc(CATS[r.c][i])+'</span>'+(r.v?'<span class="pill warn">'+t.vegan+'</span>':'')+'</div>'+
      (r.note ? '<p class="callout">'+esc(r.note[i])+'</p>' : '')+
      '<div class="scale"><div><div class="k">'+t.batch+'</div><div class="h">'+t.auto+'</div></div>'+
      '<div class="step"><button type="button" id="minus" aria-label="'+t.minus+'">−</button><output id="pn" aria-live="polite">'+num(mult)+'×</output><button type="button" class="plus" id="plus" aria-label="'+t.plus+'">+</button></div></div>'+
      '<div class="quick">'+[0.5,1,2,3].map(function(v){return '<button type="button" data-p="'+v+'" aria-pressed="'+(v===mult)+'">'+num(v)+'×</button>'}).join('')+'</div>'+
      '<p class="tip">'+t.tiphave+'</p>';
    r.p.forEach(function(p, pi){
      html += p.t ? '<h2 class="part">'+esc(p.t[i])+'</h2>' : '';
      html += '<h3 class="sec">'+t.ingredients+'</h3>';
      html += p.i.map(function(x,n){var id='c'+pi+'-'+n;return '<div class="ing"><input type="checkbox" id="'+id+'"'+(checked[id]?' checked':'')+'><label class="name" for="'+id+'">'+esc(x[2+i])+'</label>'+
        (x[0]===null ? '' : '<button type="button" class="qty" data-have="'+pi+'-'+n+'" aria-label="'+esc(t.have+': '+x[2+i])+'">'+esc(fmt(x[0],x[1]))+'</button>')+'</div>'}).join('');
      if(p.s && p.s.length){
        html += '<h3 class="sec">'+t.method+'</h3>'+(p.gen?'<p class="gen">'+t.gen+'</p>':'')+'<ol class="steps">'+p.s.map(function(s,n){return '<li><span class="num">'+(n+1)+'</span><span class="txt">'+esc(s[i])+'</span></li>'}).join('')+'</ol>';
      } else if(r.p.length===1 || pi===r.p.length-1 && !r.p.some(function(o){return o.s})) {
        html += '<p class="nomethod">'+t.nomethod+'</p>';
      }
    });
    html += '<a class="orig" href="https://drive.google.com/file/d/'+r.f+'/view" target="_blank" rel="noopener">'+t.original+' ↗</a>';
    $('recipe').innerHTML = html;
  }

  function render(){
    if(cur){ renderRecipe(); } else { renderHome(); }
    langButtons();
  }

  function open(id){
    var r = R.filter(function(x){return x.id===id})[0];
    if(!r){ cur=null; $('recipe').hidden=true; $('home').hidden=false; render(); return; }
    if(cur!==r){ mult = 1; $('recipe').innerHTML=''; }
    cur = r; $('home').hidden = true; $('recipe').hidden = false; render(); window.scrollTo(0,0);
  }
  function route(){ var h = location.hash.replace('#',''); open(h.indexOf('r-')===0 ? h.slice(2) : ''); }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.lang){ setLang(b.dataset.lang); return; }
    if(b.dataset.cat){ cat = b.dataset.cat; renderHome(); return; }
    if(b.dataset.open){ location.hash = 'r-'+b.dataset.open; return; }
    if(b.id==='back'){ location.hash = ''; return; }
    if(b.id==='minus'){ mult = Math.max(0.5, mult-0.5); render(); return; }
    if(b.id==='plus'){ mult = mult+0.5; render(); return; }
    if(b.dataset.p){ mult = +b.dataset.p; render(); return; }
    if(b.dataset.have){ openHave(b.dataset.have); return; }
    if(b.id==='calcbtn'){ openCalc(); return; }
    if(b.dataset.close){ closeSheets(); return; }
    if(b.dataset.k){ key(b.dataset.k); return; }
    if(b.id==='calcuse'){ var v=calcVal(); if(v>0 && cur){ mult=v; closeSheets(); render(); } return; }
    if(b.id==='haveok'){ applyHave(); return; }
  });

  /* ---------- "Minulla on" : laske kaikki yhden aineen mukaan ---------- */
  var haveItem = null;
  function openHave(ref){
    var a = ref.split('-'), x = cur.p[+a[0]].i[+a[1]], t = T[lang];
    haveItem = x;
    $('havetitle').textContent = x[2+L()];
    $('havehint').textContent = t.havehint.replace('{q}', fmt(x[0],x[1]));
    $('haveunit').textContent = U[x[1]] ? U[x[1]][L()] : x[1];
    $('havelabel').textContent = t.have;
    $('haveok').textContent = t.haveok;
    $('havein').value = '';
    $('havesheet').hidden = false; $('veil').hidden = false;
    setTimeout(function(){ $('havein').focus(); }, 50);
  }
  function applyHave(){
    var v = parseFloat(String($('havein').value).replace(',', '.'));
    if(!(v>0) || !haveItem) { $('havein').focus(); return; }
    mult = v / haveItem[0];
    closeSheets(); render();
  }
  $('havein').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); applyHave(); } });

  /* ---------- Laskin ---------- */
  var acc = null, op = null, curv = '0', fresh = true;
  function show(){ $('calcdisp').textContent = curv.replace('.', lang==='fi' ? ',' : '.'); $('calcexp').textContent = acc===null ? '' : num(acc)+' '+op; }
  function calc(a,o,b){ return o==='+'?a+b : o==='−'?a-b : o==='×'?a*b : o==='÷'?(b===0?NaN:a/b) : b; }
  function calcVal(){ var v = parseFloat(curv); if(acc!==null && op) v = calc(acc,op,v); return Math.round(v*1e6)/1e6; }
  function key(k){
    if(/^[0-9]$/.test(k)){ curv = (fresh || curv==='0') ? k : (curv.length<12 ? curv+k : curv); fresh=false; }
    else if(k==='.'){ if(fresh){curv='0.';fresh=false;} else if(curv.indexOf('.')<0) curv+='.'; }
    else if(k==='C'){ acc=null; op=null; curv='0'; fresh=true; }
    else if(k==='back'){ curv = curv.length>1 ? curv.slice(0,-1) : '0'; }
    else if(k==='='){ if(op!==null){ var r=calcVal(); curv = isFinite(r) ? String(r) : '0'; acc=null; op=null; fresh=true; } }
    else { if(op!==null && !fresh){ var r2=calcVal(); acc = isFinite(r2)?r2:0; } else if(acc===null){ acc=parseFloat(curv); } op=k; fresh=true; curv = String(acc); }
    show();
  }
  function openCalc(){
    var t = T[lang];
    $('calctitle').textContent = t.calc;
    $('calcuse').hidden = !cur; $('calcuse').textContent = t.calcuse;
    show();
    $('calcsheet').hidden = false; $('veil').hidden = false;
  }
  function closeSheets(){ $('calcsheet').hidden = true; $('havesheet').hidden = true; $('veil').hidden = true; }
  $('veil').addEventListener('click', closeSheets);
  document.addEventListener('keydown', function(e){
    if($('calcsheet').hidden) { if(e.key==='Escape') closeSheets(); return; }
    var m = {'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'back','Escape':'close',',':'.','.':'.'};
    var k = /^[0-9]$/.test(e.key) ? e.key : m[e.key];
    if(k==='close'){ closeSheets(); } else if(k){ e.preventDefault(); key(k); }
  });

  /* ---------- Näyttö pysyy päällä reseptissä ---------- */
  var lock = null;
  function wake(){ try{ if(cur && navigator.wakeLock && !lock){ navigator.wakeLock.request('screen').then(function(l){ lock=l; l.addEventListener('release',function(){lock=null;}); }).catch(function(){}); } else if(!cur && lock){ lock.release(); lock=null; } }catch(e){} }
  window.addEventListener('hashchange', wake);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') wake(); });
  $('q').addEventListener('input', renderHome);
  window.addEventListener('hashchange', route);
  route();
})();
</script>
