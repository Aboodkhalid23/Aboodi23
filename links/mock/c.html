<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:radial-gradient(500px 360px at 80% -40px,rgba(255,60,40,.35),transparent),radial-gradient(400px 300px at 0% 30%,rgba(120,40,255,.18),transparent),#08080b;color:#fff}
.top{padding:54px 20px 0;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;font-weight:900}.top p{font-size:12px;color:#9d9daa}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:13px}
.ready{margin:18px 20px 0;display:flex;align-items:center;gap:16px;padding:18px;border-radius:28px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px)}
.gauge{width:128px;height:128px;position:relative}.gauge svg{width:100%;height:100%;transform:rotate(135deg)}.gauge div{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.gauge b{font-size:40px;display:block;line-height:1}.gauge span{font-size:11px;color:#aaa}
.ready p{font-size:13px;line-height:1.6}.ready h2{font-size:17px;margin-bottom:4px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 20px 0}
.t{border-radius:24px;padding:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.t.w{grid-row:span 2;background:linear-gradient(170deg,#ff3d2e,#7a0d3a);border:0;min-height:236px}
.t.w img{position:absolute;bottom:-6px;left:-20px;height:150px;opacity:.95}.t.w small{font-size:11px;opacity:.85}.t.w h2{font-size:24px;line-height:1.1;margin-top:4px}
.t b.n{font-size:30px;display:block}.t span{font-size:11.5px;color:#a9a9b5}.t .mini{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:8px}.t .mini i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffb020,#ff3d2e)}
.meal{grid-column:span 2;display:flex;gap:12px;align-items:center}.meal img{width:70px;height:70px;border-radius:18px;object-fit:cover}.meal b{font-size:15px}
nav{position:absolute;bottom:16px;left:20px;right:20px;height:64px;border-radius:32px;background:rgba(20,20,26,.75);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);display:flex;justify-content:space-around;align-items:center;font-size:10px;color:#8b8b97}
nav i{display:block;width:22px;height:22px;border-radius:7px;background:#2b2b34;margin:0 auto 3px}nav .on{color:#fff}nav .on i{background:linear-gradient(135deg,#ffb020,#ff3d2e)}
</style></head><body>
<div class="top"><div><p>الخميس، 13 تشرين الثاني</p><h1>هلا أبودي 🔥</h1></div><div class="chip">🔥 <b class="n">12</b> يوم</div></div>
<div class="ready"><div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,.1)" stroke-width="10" fill="none" stroke-dasharray="236 314" stroke-linecap="round"/><circle cx="60" cy="60" r="50" stroke="url(#g)" stroke-width="10" fill="none" stroke-dasharray="190 314" stroke-linecap="round"/><defs><linearGradient id="g"><stop offset="0" stop-color="#ffb020"/><stop offset="1" stop-color="#ff3d2e"/></linearGradient></defs></svg><div><div><b class="n">82</b><span>جاهزيتك</span></div></div></div>
<div><h2>جسمك جاهز للتمرين 💪</h2><p>نمت 7.5 ساعات وعضلاتك ارتاحت. اليوم تگدر تزيد كيلو بالتمرين الأول.</p></div></div>
<div class="bento"><div class="t w"><small>تمرين اليوم</small><h2>صدر<br>+ أمامية</h2><span style="color:#ffd9d4">6 تمارين • 50 د</span><img src="../nexfit/img/ex3d/curl.jpg"></div>
<div class="t"><span>البروتين</span><b class="n">64<small style="font-size:14px">/104g</small></b><div class="mini"><i style="width:62%"></i></div></div>
<div class="t"><span>السعرات</span><b class="n">1640</b><div class="mini"><i style="width:57%"></i></div></div>
<div class="t meal"><img src="../nexfit/img/dish/kabsa.webp"><div><span>الغدا الجاي</span><br><b>كبسة العضل</b><br><span class="n" style="color:#ffb020">51g بروتين • 724 سعرة</span></div></div></div>
<nav><div class="on"><i></i>اليوم</div><div><i></i>تمريني</div><div><i></i>الأكل</div><div><i></i>الماركت</div><div><i></i>أنا</div></nav>
</body></html>
