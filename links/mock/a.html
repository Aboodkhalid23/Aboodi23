<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#060607;color:#fff}
.top{padding:54px 20px 0;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Oswald;font-size:26px;letter-spacing:2px}.logo span{color:#ff2d3d}
.av{width:42px;height:42px;border-radius:50%;background:#1c1c20;display:grid;place-items:center;font-weight:800}
.big{margin:18px 20px 0;height:330px;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(160deg,#ff2d3d,#5a0a12)}
.big img{position:absolute;left:-30px;bottom:0;height:115%}
.big .t{position:absolute;right:20px;top:22px;width:55%}
.big small{font-size:12px;opacity:.8;letter-spacing:1px}.big h1{font-size:40px;line-height:1;font-weight:900;margin:6px 0}
.big .d{font-size:13px;opacity:.9}.go{position:absolute;right:20px;bottom:20px;background:#fff;color:#c4101f;border-radius:999px;padding:12px 22px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 20px 0}
.s{background:#121215;border-radius:20px;padding:12px}.s b{font-size:28px;display:block}.s span{font-size:11px;color:#8d8d96}
.s .bar{height:4px;background:#26262b;border-radius:3px;margin-top:8px}.s .bar i{display:block;height:100%;border-radius:3px}
h3{margin:20px 20px 10px;font-size:18px;display:flex;justify-content:space-between}h3 small{font-size:12px;color:#ff2d3d}
.row{display:flex;gap:10px;padding:0 20px;overflow:hidden;width:390px}.m{flex:none;width:150px;border-radius:20px;overflow:hidden;background:#121215}.m img{width:150px;height:105px;object-fit:cover}.m div{padding:8px}.m b{font-size:13px}.m span{font-size:11px;color:#ff2d3d;display:block}
nav{position:absolute;bottom:0;left:0;right:0;height:84px;background:#0b0b0d;border-top:1px solid #1d1d22;display:flex;justify-content:space-around;align-items:center;padding-bottom:14px;font-size:10px;color:#77777f}
nav i{display:block;width:22px;height:22px;border-radius:7px;background:#2a2a30;margin:0 auto 4px}nav .on{color:#ff2d3d}nav .on i{background:#ff2d3d}
nav .fab i{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#ff2d3d,#a30d1b);margin-top:-30px;box-shadow:0 8px 24px rgba(255,45,61,.5)}
</style></head><body>
<div class="top"><div class="av">ب</div><div class="logo">NEX<span>FIT</span></div></div>
<div class="big"><img src="../nexfit/img/ex3d/dayA.jpg"><div class="t"><small>اليوم 12 • الشهر 1</small><h1>صدر<br>+ أمامية</h1><p class="d">6 تمارين • 50 دقيقة</p></div><div class="go">▶ يلا نبدي</div></div>
<div class="stats"><div class="s"><b class="n">2850</b><span>سعرة هدفك</span><div class="bar"><i style="width:40%;background:#ff2d3d"></i></div></div><div class="s"><b class="n">64g</b><span>بروتين من 104</span><div class="bar"><i style="width:62%;background:#f5bd45"></i></div></div><div class="s"><b class="n" dir="ltr">5/10</b><span>گلاص مي</span><div class="bar"><i style="width:50%;background:#5fb8ff"></i></div></div></div>
<h3>أكلك اليوم <small>كل القائمة</small></h3>
<div class="row"><div class="m"><img src="../nexfit/img/dish/shakshuka.webp"><div><b>شكشوكة الصبح</b><span class="n">31g بروتين</span></div></div><div class="m"><img src="../nexfit/img/dish/kabsa.webp"><div><b>كبسة العضل</b><span class="n">51g بروتين</span></div></div><div class="m"><img src="../nexfit/img/dish/m52853.webp"><div><b>موس البروتين</b><span class="n">23g بروتين</span></div></div></div>
<nav><div class="on"><i></i>الرئيسية</div><div><i></i>تمريني</div><div class="fab"><i></i>الماركت</div><div><i></i>الأكل</div><div><i></i>أنا</div></nav>
</body></html>
